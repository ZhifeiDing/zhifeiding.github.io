<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Georgia, 'Times New Roman', 'Songti SC', serif">
  <rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
  <!-- Left panel: standard transformer -->
  <g>
    <text x="190" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">标准 Transformer</text>
    <text x="190" y="58" text-anchor="middle" font-size="12" fill="#666">每一层被访问一次</text>
    <!-- blocks -->
    <g font-size="12" text-anchor="middle">
      <rect x="120" y="80" width="140" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="190" y="100" fill="#1e3a8a">第 1 层 · θ₁</text>
      <rect x="120" y="118" width="140" height="30" rx="4" fill="#c7d2fe" stroke="#6366f1"/>
      <text x="190" y="138" fill="#312e81">第 2 层 · θ₂</text>
      <rect x="120" y="156" width="140" height="30" rx="4" fill="#ddd6fe" stroke="#8b5cf6"/>
      <text x="190" y="176" fill="#4c1d95">第 3 层 · θ₃</text>
      <rect x="120" y="194" width="140" height="30" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="190" y="214" fill="#4c1d95">第 4 层 · θ₄</text>
      <text x="190" y="248" fill="#999" font-size="11">…</text>
      <rect x="120" y="258" width="140" height="30" rx="4" fill="#f3e8ff" stroke="#c084fc"/>
      <text x="190" y="278" fill="#581c87">第 L 层 · θ_L</text>
    </g>
    <!-- arrows -->
    <g stroke="#666" stroke-width="1.4" fill="#666">
      <line x1="190" y1="110" x2="190" y2="118"/>
      <line x1="190" y1="148" x2="190" y2="156"/>
      <line x1="190" y1="186" x2="190" y2="194"/>
      <line x1="190" y1="224" x2="190" y2="236"/>
      <line x1="190" y1="250" x2="190" y2="258"/>
    </g>
    <g font-size="11" fill="#666">
      <text x="190" y="316" text-anchor="middle">深度 = L（由参数份数决定）</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="390" y1="30" x2="390" y2="330" stroke="#ccc" stroke-dasharray="4 4"/>

  <!-- Right panel: loop transformer -->
  <g>
    <text x="585" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Loop Transformer</text>
    <text x="585" y="58" text-anchor="middle" font-size="12" fill="#666">同一组层被循环访问 T 次</text>
    <!-- shared block -->
    <rect x="495" y="100" width="180" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
    <text x="585" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">共享层栈（同一组 θ）</text>
    <text x="585" y="135" text-anchor="middle" font-size="11" fill="#991b1b">重复执行 T 次</text>
    <!-- loop back arrow -->
    <path d="M 675 121 C 720 121, 720 205, 675 205" fill="none" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="712" y="168" text-anchor="middle" font-size="11" fill="#b91c1c" transform="rotate(90 712 168)">第 t 轮 → 第 t+1 轮</text>
    <!-- passes indicator -->
    <g font-size="12" text-anchor="middle">
      <rect x="495" y="205" width="180" height="34" rx="6" fill="#fff7ed" stroke="#f97316"/>
      <text x="585" y="220" fill="#7c2d12">输入 → 输出</text>
      <text x="585" y="233" fill="#9a3412" font-size="10.5">（每次循环后继续精炼）</text>
    </g>
    <g font-size="11" fill="#666">
      <text x="585" y="286" text-anchor="middle">等效深度 = L × T</text>
      <text x="585" y="304" text-anchor="middle">仅存储 1 份参数</text>
    </g>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="390" y="350" text-anchor="middle" font-size="11" fill="#999">图 1 底注：循环省的是参数，不是计算——前向传播仍需执行 T 次层计算</text>
</svg>
