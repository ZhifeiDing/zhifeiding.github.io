<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ob" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/>
    </marker>
    <marker id="og" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#ffffff"/>

  <text x="340" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">深度：从「参数量」到「计算量」</text>

  <line x1="372" y1="62" x2="372" y2="414" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- 左：标准 Transformer -->
  <text x="45" y="86" font-size="16" font-weight="700" fill="#1E293B">标准 Transformer</text>
  <text x="45" y="104" font-size="12" fill="#64748B">L 个独立层，各执行一次</text>

  <line x1="120" y1="120" x2="120" y2="138" stroke="#94A3B8" stroke-width="2" marker-end="url(#og)"/>
  <text x="130" y="134" font-size="12" fill="#64748B">输入 x</text>

  <rect x="45" y="142" width="150" height="32" rx="6" fill="#3B82F6"/>
  <text x="120" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">层 1</text>
  <line x1="120" y1="174" x2="120" y2="186" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#og)"/>

  <rect x="45" y="190" width="150" height="32" rx="6" fill="#F97316"/>
  <text x="120" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">层 2</text>
  <line x1="120" y1="222" x2="120" y2="234" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#og)"/>

  <rect x="45" y="238" width="150" height="32" rx="6" fill="#22C55E"/>
  <text x="120" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">层 3</text>

  <text x="120" y="286" text-anchor="middle" font-size="16" fill="#94A3B8">⋮</text>

  <rect x="45" y="296" width="150" height="32" rx="6" fill="#8B5CF6"/>
  <text x="120" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">层 L</text>

  <line x1="120" y1="328" x2="120" y2="348" stroke="#94A3B8" stroke-width="2" marker-end="url(#og)"/>
  <text x="130" y="344" font-size="12" fill="#64748B">输出</text>

  <text x="120" y="378" text-anchor="middle" font-size="12.5" fill="#64748B">存储 L 份参数 θ₁…θ_L</text>

  <!-- 右：Loop Transformer -->
  <text x="430" y="86" font-size="16" font-weight="700" fill="#1E293B">Loop Transformer</text>
  <text x="430" y="104" font-size="12" fill="#64748B">同一层循环 T 次</text>

  <line x1="505" y1="120" x2="505" y2="138" stroke="#94A3B8" stroke-width="2" marker-end="url(#og)"/>
  <text x="515" y="134" font-size="12" fill="#64748B">输入 x</text>

  <rect x="430" y="142" width="150" height="32" rx="6" fill="#3B82F6"/>
  <text x="505" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">共享层 θ</text>
  <line x1="505" y1="174" x2="505" y2="186" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#og)"/>

  <rect x="430" y="190" width="150" height="32" rx="6" fill="#3B82F6"/>
  <text x="505" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">共享层 θ</text>
  <line x1="505" y1="222" x2="505" y2="234" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#og)"/>

  <rect x="430" y="238" width="150" height="32" rx="6" fill="#3B82F6"/>
  <text x="505" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">共享层 θ</text>

  <text x="505" y="286" text-anchor="middle" font-size="16" fill="#94A3B8">⋮</text>

  <rect x="430" y="296" width="150" height="32" rx="6" fill="#3B82F6"/>
  <text x="505" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">共享层 θ</text>

  <line x1="505" y1="328" x2="505" y2="348" stroke="#94A3B8" stroke-width="2" marker-end="url(#og)"/>
  <text x="515" y="344" font-size="12" fill="#64748B">输出</text>

  <path d="M 580 312 C 656 312, 656 158, 588 158" fill="none" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#ob)"/>
  <text x="614" y="240" font-size="12.5" font-weight="700" fill="#3B82F6">循环 T 次</text>

  <text x="505" y="378" text-anchor="middle" font-size="12.5" fill="#64748B">仅存储 1 份参数 θ</text>

  <text x="340" y="440" text-anchor="middle" font-size="13.5" fill="#1E293B">等效深度：<tspan font-weight="700" fill="#64748B">L</tspan>（左） → <tspan font-weight="700" fill="#3B82F6">T</tspan>（右），T 可为任意整数</text>
</svg>
