<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 深色背景 -->
  <rect width="820" height="660" fill="#1a1a1a"/>

  <!-- 标题 -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f5f5">Nanbeige4.2-3B · Looped Transformer</text>
  <text x="410" y="56" text-anchor="middle" font-size="12.5" fill="#a8a8a8">num_loops = 2：同一 22 层栈遍历两遍 → 等效 44 层 · 3B 非嵌入参数 · 原生 256K 上下文 · GQA + SwiGLU</text>

  <!-- ===================== 左面板：整体循环流程 ===================== -->
  <rect x="24" y="76" width="320" height="548" rx="14" fill="#f1f1f1" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="40" y="100" font-size="13" font-weight="700" fill="#1a1a1a">整体循环流程</text>
  <text x="40" y="116" font-size="10.5" fill="#666666">22 层栈 × 2 遍 = 等效 44 层深度</text>

  <!-- Token Embedding -->
  <rect x="74" y="566" width="166" height="44" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="1.2"/>
  <text x="157" y="584" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Token Embedding</text>
  <text x="157" y="599" text-anchor="middle" font-size="9.5" fill="#444444">166,144 → 3,072</text>

  <!-- 进入栈 -->
  <line x1="157" y1="566" x2="157" y2="538" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 层栈分组 -->
  <rect x="70" y="322" width="174" height="216" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="157" y="340" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">× 22 Transformer 层</text>
  <text x="157" y="354" text-anchor="middle" font-size="9.5" fill="#666666">共享权重 θ</text>

  <rect x="96" y="368" width="122" height="28" rx="5" fill="#e8e8e8" stroke="#000000" stroke-width="1"/>
  <text x="157" y="386" text-anchor="middle" font-size="10" fill="#1a1a1a">Block</text>
  <text x="157" y="412" text-anchor="middle" font-size="12" fill="#666666">⋯</text>
  <rect x="96" y="416" width="122" height="28" rx="5" fill="#e8e8e8" stroke="#000000" stroke-width="1"/>
  <text x="157" y="434" text-anchor="middle" font-size="10" fill="#1a1a1a">Block</text>
  <text x="157" y="460" text-anchor="middle" font-size="12" fill="#666666">⋯</text>
  <rect x="96" y="464" width="122" height="28" rx="5" fill="#e8e8e8" stroke="#000000" stroke-width="1"/>
  <text x="157" y="482" text-anchor="middle" font-size="10" fill="#1a1a1a">Block</text>

  <line x1="157" y1="538" x2="157" y2="492" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="157" y1="368" x2="157" y2="330" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 循环回线（第 2 遍） -->
  <path d="M 200 340 L 256 340 L 256 516 L 244 516" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="274" y="428" text-anchor="middle" font-size="9.5" fill="#333333" transform="rotate(-90 274 428)">第 2 遍（复用 θ）</text>
  <text x="52" y="430" text-anchor="middle" font-size="9.5" fill="#333333" transform="rotate(-90 52 430)">第 1 遍</text>

  <!-- 出栈 → 最终 RMSNorm -->
  <line x1="157" y1="322" x2="157" y2="282" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="74" y="252" width="166" height="30" rx="6" fill="#f8d9ac" stroke="#000000" stroke-width="1.2"/>
  <text x="157" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">RMSNorm</text>

  <!-- LM Head -->
  <line x1="157" y1="252" x2="157" y2="214" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="74" y="170" width="166" height="44" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="1.2"/>
  <text x="157" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">LM Head</text>
  <text x="157" y="203" text-anchor="middle" font-size="9.5" fill="#444444">3,072 → 166,144</text>

  <line x1="157" y1="170" x2="157" y2="150" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9.5" fill="#666666">logits</text>

  <!-- ===================== 右面板：Transformer 块内部 ===================== -->
  <rect x="344" y="76" width="468" height="548" rx="14" fill="#f1f1f1" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="360" y="100" font-size="13" font-weight="700" fill="#1a1a1a">Transformer 块内部（权重 θ 复用两次）</text>
  <text x="360" y="117" font-size="10.5" fill="#666666">GQA 注意力 + SwiGLU 前馈　⊕ 残差相加　⊗ 门控相乘　σ SiLU</text>

  <!-- 输入 -->
  <text x="578" y="606" text-anchor="middle" font-size="10" fill="#555555">输入（残差流）</text>
  <line x1="578" y1="602" x2="578" y2="598" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- RMSNorm 1 -->
  <rect x="530" y="570" width="96" height="28" rx="6" fill="#f8d9ac" stroke="#000000" stroke-width="1.2"/>
  <text x="578" y="588" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">RMSNorm</text>

  <!-- 分发到 q/k/v -->
  <line x1="578" y1="570" x2="578" y2="560" stroke="#000000" stroke-width="1.3"/>
  <line x1="430" y1="560" x2="726" y2="560" stroke="#000000" stroke-width="1.3"/>
  <line x1="430" y1="560" x2="430" y2="552" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="578" y1="560" x2="578" y2="552" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="726" y1="560" x2="726" y2="552" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- q/k/v 投影 -->
  <path d="M 386 508 L 474 508 L 462 552 L 398 552 Z" fill="#c9cfea" stroke="#000000" stroke-width="1.1"/>
  <text x="430" y="526" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a1a">Linear</text>
  <text x="430" y="542" text-anchor="middle" font-size="10" font-style="italic" fill="#1a1a1a">q</text>
  <path d="M 534 508 L 622 508 L 610 552 L 546 552 Z" fill="#c9cfea" stroke="#000000" stroke-width="1.1"/>
  <text x="578" y="526" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a1a">Linear</text>
  <text x="578" y="542" text-anchor="middle" font-size="10" font-style="italic" fill="#1a1a1a">k</text>
  <path d="M 682 508 L 770 508 L 758 552 L 694 552 Z" fill="#c9cfea" stroke="#000000" stroke-width="1.1"/>
  <text x="726" y="526" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a1a">Linear</text>
  <text x="726" y="542" text-anchor="middle" font-size="10" font-style="italic" fill="#1a1a1a">v</text>

  <!-- RoPE（仅 q、k） -->
  <line x1="430" y1="508" x2="430" y2="498" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="398" y="468" width="64" height="30" rx="5" fill="#f8d3d8" stroke="#000000" stroke-width="1.1"/>
  <text x="430" y="487" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">RoPE</text>
  <line x1="578" y1="508" x2="578" y2="498" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="546" y="468" width="64" height="30" rx="5" fill="#f8d3d8" stroke="#000000" stroke-width="1.1"/>
  <text x="578" y="487" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">RoPE</text>
  <line x1="726" y1="508" x2="726" y2="468" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- GQA 注意力核心 -->
  <line x1="430" y1="468" x2="430" y2="462" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="578" y1="468" x2="578" y2="462" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="382" y="422" width="392" height="46" rx="6" fill="#fbf3c9" stroke="#000000" stroke-width="1.2"/>
  <text x="578" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">分组查询注意力 · Scaled Dot-Product（GQA）</text>
  <text x="578" y="456" text-anchor="middle" font-size="10" fill="#333333">48 Q 头 · 8 KV 头 · 头维 128 · RoPE θ = 7 × 10⁷</text>

  <!-- 输出投影 -->
  <line x1="578" y1="422" x2="578" y2="416" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 518 386 L 638 386 L 620 416 L 536 416 Z" fill="#c9cfea" stroke="#000000" stroke-width="1.1"/>
  <text x="578" y="405" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">Linear (o)</text>

  <!-- 残差 ⊕ 1 -->
  <line x1="578" y1="386" x2="578" y2="378" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <circle cx="578" cy="368" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="578" y="373" text-anchor="middle" font-size="15" fill="#1a1a1a">⊕</text>
  <line x1="390" y1="368" x2="565" y2="368" stroke="#999999" stroke-width="1.1"/>
  <text x="386" y="372" text-anchor="end" font-size="9.5" font-style="italic" fill="#555555">x</text>

  <!-- RMSNorm 2 -->
  <line x1="578" y1="355" x2="578" y2="350" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="530" y="322" width="96" height="28" rx="6" fill="#f8d9ac" stroke="#000000" stroke-width="1.2"/>
  <text x="578" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">RMSNorm</text>

  <!-- 分发到 gate / up -->
  <line x1="578" y1="322" x2="578" y2="312" stroke="#000000" stroke-width="1.3"/>
  <line x1="486" y1="312" x2="670" y2="312" stroke="#000000" stroke-width="1.3"/>
  <line x1="486" y1="312" x2="486" y2="296" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="670" y1="312" x2="670" y2="296" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- gate / up 投影 -->
  <path d="M 446 250 L 526 250 L 514 296 L 458 296 Z" fill="#c9cfea" stroke="#000000" stroke-width="1.1"/>
  <text x="486" y="268" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a1a">Linear</text>
  <text x="486" y="284" text-anchor="middle" font-size="10" font-style="italic" fill="#1a1a1a">gate</text>
  <path d="M 630 250 L 710 250 L 698 296 L 642 296 Z" fill="#c9cfea" stroke="#000000" stroke-width="1.1"/>
  <text x="670" y="268" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a1a">Linear</text>
  <text x="670" y="284" text-anchor="middle" font-size="10" font-style="italic" fill="#1a1a1a">up</text>

  <!-- σ (SiLU) 与 ⊗ 门控 -->
  <line x1="486" y1="250" x2="486" y2="243" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <circle cx="486" cy="232" r="11" fill="#ffffff" stroke="#c9a227" stroke-width="1.6"/>
  <text x="486" y="237" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a1a">σ</text>
  <line x1="670" y1="250" x2="670" y2="232" stroke="#000000" stroke-width="1.3"/>
  <line x1="670" y1="232" x2="591" y2="232" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="497" y1="232" x2="565" y2="232" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <circle cx="578" cy="232" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="578" y="237" text-anchor="middle" font-size="15" fill="#1a1a1a">⊗</text>
  <text x="486" y="222" text-anchor="middle" font-size="9" fill="#555555">SiLU</text>

  <!-- down 投影 -->
  <line x1="578" y1="219" x2="578" y2="206" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M 518 176 L 638 176 L 620 206 L 536 206 Z" fill="#c9cfea" stroke="#000000" stroke-width="1.1"/>
  <text x="578" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">Linear</text>
  <text x="578" y="202" text-anchor="middle" font-size="9.5" font-style="italic" fill="#1a1a1a">down</text>

  <!-- 残差 ⊕ 2 -->
  <line x1="578" y1="176" x2="578" y2="168" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <circle cx="578" cy="156" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="578" y="161" text-anchor="middle" font-size="15" fill="#1a1a1a">⊕</text>
  <line x1="390" y1="156" x2="565" y2="156" stroke="#999999" stroke-width="1.1"/>
  <text x="386" y="160" text-anchor="end" font-size="9.5" font-style="italic" fill="#555555">x</text>

  <!-- 输出 -->
  <line x1="578" y1="143" x2="578" y2="126" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="578" y="116" text-anchor="middle" font-size="10" fill="#555555">输出（残差流 → 下一层）</text>

  <!-- 脚注 -->
  <text x="410" y="646" text-anchor="middle" font-size="10.5" fill="#8a8a8a">图 8 · Nanbeige4.2-3B 朴素循环：22 层 Decoder 栈（GQA 注意力 + SwiGLU 前馈）原样走两遍，等效 44 层深度（据 Nanbeige Lab, 2026, arXiv:2607.22083 与官方 config.json 绘制）</text>
</svg>
