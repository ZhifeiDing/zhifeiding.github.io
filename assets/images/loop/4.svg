<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 深色背景 -->
  <rect width="820" height="660" fill="#1a1a1a"/>

  <!-- 标题 -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f5f5">Huginn-3.5B · 潜在循环深度（Latent Recurrent Depth）</text>
  <text x="410" y="56" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Prelude–Core–Coda · 核心 4 层循环 32 次 → 2 + 4×32 + 2 = 132 层等效深度 · 3.5B 参数 · 显存约 7.13 GB</text>

  <!-- ===================== 左面板：整体 Prelude–Core–Coda ===================== -->
  <rect x="24" y="76" width="316" height="548" rx="14" fill="#f1f1f1" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="40" y="100" font-size="13" font-weight="700" fill="#1a1a1a">整体结构：三段式</text>
  <text x="40" y="116" font-size="10.5" fill="#666666">前奏 / 核心 / 尾声 · 核心循环 32 次</text>

  <!-- Token Embedding -->
  <rect x="82" y="560" width="200" height="44" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="1.2"/>
  <text x="182" y="578" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">Token Embedding</text>
  <text x="182" y="594" text-anchor="middle" font-size="9.5" fill="#444444">约 0.5B 参数</text>

  <!-- Prelude -->
  <line x1="182" y1="560" x2="182" y2="546" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="82" y="508" width="200" height="38" rx="6" fill="#c9cfea" stroke="#000000" stroke-width="1.2"/>
  <text x="182" y="525" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">Prelude（前奏）· 2 层</text>
  <text x="182" y="540" text-anchor="middle" font-size="9" fill="#555555">输入 → 潜在表示 e</text>

  <!-- Core 循环分组 -->
  <line x1="182" y1="508" x2="182" y2="492" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="76" y="300" width="212" height="192" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="182" y="318" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">Core（核心）· 4 层</text>
  <text x="182" y="332" text-anchor="middle" font-size="9.5" fill="#666666">共享权重 θ · 循环 32 次</text>

  <rect x="108" y="348" width="148" height="26" rx="5" fill="#fbf3c9" stroke="#000000" stroke-width="1"/>
  <text x="182" y="365" text-anchor="middle" font-size="9.5" fill="#1a1a1a">推理引擎（隐空间推演）</text>
  <text x="182" y="387" text-anchor="middle" font-size="11" fill="#666666">⋯</text>
  <rect x="108" y="394" width="148" height="26" rx="5" fill="#fbf3c9" stroke="#000000" stroke-width="1"/>
  <text x="182" y="411" text-anchor="middle" font-size="9.5" fill="#1a1a1a">推理引擎（隐空间推演）</text>
  <text x="182" y="433" text-anchor="middle" font-size="11" fill="#666666">⋯</text>
  <rect x="108" y="440" width="148" height="26" rx="5" fill="#fbf3c9" stroke="#000000" stroke-width="1"/>
  <text x="182" y="457" text-anchor="middle" font-size="9.5" fill="#1a1a1a">推理引擎（隐空间推演）</text>

  <line x1="182" y1="492" x2="182" y2="466" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="182" y1="348" x2="182" y2="316" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 循环回线 -->
  <path d="M 240 356 L 268 356 L 268 470 L 240 470" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="278" y="414" text-anchor="middle" font-size="9" fill="#333333" transform="rotate(-90 278 414)">× 32 次</text>

  <!-- Coda -->
  <line x1="182" y1="300" x2="182" y2="284" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="82" y="246" width="200" height="38" rx="6" fill="#c9cfea" stroke="#000000" stroke-width="1.2"/>
  <text x="182" y="263" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">Coda（尾声）· 2 层</text>
  <text x="182" y="278" text-anchor="middle" font-size="9" fill="#555555">潜在状态 → token 分布</text>

  <!-- Output -->
  <line x1="182" y1="246" x2="182" y2="214" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="82" y="170" width="200" height="44" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="1.2"/>
  <text x="182" y="188" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">Output Head</text>
  <text x="182" y="203" text-anchor="middle" font-size="9.5" fill="#444444">下一个 token</text>
  <line x1="182" y1="170" x2="182" y2="152" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ===================== 右面板：输入锚点 + Core 循环 ===================== -->
  <rect x="344" y="76" width="468" height="548" rx="14" fill="#f1f1f1" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="360" y="100" font-size="13" font-weight="700" fill="#1a1a1a">输入锚点 + Core 循环</text>
  <text x="360" y="117" font-size="10.5" fill="#666666">每轮把当前状态与初始嵌入 e 拼接后投影回原宽度，避免深层遗忘输入</text>

  <!-- 输入锚点卡 -->
  <rect x="360" y="128" width="436" height="360" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.1"/>
  <text x="372" y="146" font-size="11" font-weight="700" fill="#1a1a1a">单个循环步（第 t 次）</text>

  <!-- 初始嵌入 e -->
  <rect x="470" y="162" width="216" height="44" rx="7" fill="#f8d3d8" stroke="#000000" stroke-width="1.2"/>
  <text x="578" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">初始嵌入 e</text>
  <text x="578" y="196" text-anchor="middle" font-size="9" fill="#555555">来自 Prelude · 每轮重新注入</text>

  <line x1="578" y1="206" x2="578" y2="222" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 输入锚点 -->
  <rect x="470" y="222" width="216" height="58" rx="7" fill="#c9cfea" stroke="#000000" stroke-width="1.2"/>
  <text x="578" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">输入锚点（Adapter）</text>
  <text x="578" y="262" text-anchor="middle" font-size="9.5" fill="#333333">concat(h(t), e) → 投影回原宽度</text>

  <line x1="578" y1="280" x2="578" y2="296" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Core 块 -->
  <rect x="470" y="296" width="216" height="50" rx="7" fill="#fbf3c9" stroke="#000000" stroke-width="1.2"/>
  <text x="578" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Core 块（4 层 · 共享 θ）</text>
  <text x="578" y="332" text-anchor="middle" font-size="9" fill="#333333">注意力 + 前馈 · 隐空间推演</text>

  <line x1="578" y1="346" x2="578" y2="362" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>

  <text x="578" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">h(t+1)</text>

  <!-- h_t 输入 -->
  <line x1="390" y1="251" x2="470" y2="251" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="386" y="255" text-anchor="end" font-size="10" font-style="italic" fill="#555555">h(t)</text>

  <!-- 循环回线（h_{t+1} → h_t） -->
  <path d="M 578 386 L 578 436 L 700 436 L 700 251 L 686 251" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="706" y="344" text-anchor="middle" font-size="9.5" fill="#333333" transform="rotate(-90 706 344)">循环 32 次 · h(t+1) → h(t)</text>

  <!-- 消融提示 -->
  <rect x="372" y="452" width="412" height="32" rx="6" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1"/>
  <text x="578" y="472" text-anchor="middle" font-size="9.8" fill="#8a6d1f">消融：首轮后移除锚点，置信度 92.89% → 0.02%</text>

  <!-- 脚注 -->
  <text x="410" y="646" text-anchor="middle" font-size="10.5" fill="#8a8a8a">图 5 · Huginn-3.5B：Prelude–Core–Coda 三段式，核心 4 层循环 32 次，输入锚点每轮重新注入初始嵌入（据 Geiping et al., 2025, arXiv:2502.05171 绘制）</text>
</svg>
