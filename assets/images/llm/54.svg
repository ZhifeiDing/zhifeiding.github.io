ize="11" fill="#4a4a4a" text-anchor="start">总参 675B / 激活 41B，其中主干 673B、视觉 2.5B；视觉编码器 48 层、宽 1664、patch 14，经 2 × 2 空间合并接入。</text><text x="80.0" y="702.0" font-size="11" fill="#4a4a4a" text-anchor="start">FP8 以 128 × 128 分块量化，嵌入、视觉、低秩投影、门控与输出头豁免；另有 NVFP4 与 BF16 两版。</text><rect x="96.0" y="727.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力 / 路由</text><rect x="193.8" y="727.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="215.8" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化</text><rect x="259.3" y="727.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="281.3" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影</text><rect x="314.3" y="727.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="336.3" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>