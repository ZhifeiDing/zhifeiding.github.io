<svg xmlns="http://www.w3.org/2000/svg" width="680" height="632" viewBox="0 0 680 632" font-family="Georgia, 'Times New Roman', serif">
<text x="340.0" y="24" font-size="14.5" fill="#111111" text-anchor="middle">Ling-flash-2.0 的层组合与算子序列</text>
<text x="340.0" y="43" font-size="8.9" fill="#5a6675" text-anchor="middle">32 层 = 1 层稠密 SwiGLU（中间维 9216）+ 31 层 MoE，隐藏维 4096；256 选 8 + 1 共享，专家中间维 1024</text>
<text x="340.0" y="58" font-size="8.9" fill="#5a6675" text-anchor="middle">注意力为标准 GQA：32 查询头 / 4 键值头 × 128 维，打分前作 QK-Norm，位置编码只作用于前 64 维（Partial-RoPE）</text>
<line x1="12" y1="70" x2="668" y2="70" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="90" font-size="9.8" fill="#1b2430" font-weight="bold">（a）块内组合：标准注意力配高稀疏专家</text>
<text x="348" y="90" font-size="9.8" fill="#1b2430" font-weight="bold">（b）32 层：第 0 层稠密，其后 31 层 MoE</text>
<g transform="translate(0,98.0)"><rect x="12" y="0.0" width="320" height="18" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9"/></g>
