<g transform="translate(0,98.0)"><text x="20" y="71.0" font-size="8.8" fill="#446084" font-weight="bold">注意力单元：GQA（逐层同构）</text></g>
<g transform="translate(0,98.0)"><rect x="20" y="75.0" width="304" height="16" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="25" y="86.5" font-size="7.7" fill="#33414f">32 Q / 4 KV × 128 维，键值头比 8 : 1</text></g>
<g transform="translate(0,98.0)"><line x1="172.0" y1="97.0" x2="172.0" y2="99.0" stroke="#8a94a3" stroke-width="1"/><path d="M169.0,99.0 L172.0,104.0 L175.0,99.0 z" fill="#8a94a3"/></g>
<g transform="translate(0,98.0)"><rect x="12" y="104.0" width="320" height="20" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9"/></g>
<g transform="translate(0,98.0)"><text x="20" y="117.5" font-size="8.8" fill="#1b2430">残差相加</text></g>
<g transform="translate(0,98.0)"><text x="324" y="117.5" font-size="7.6" fill="#5a6675" text-anchor="end">x ← x + y</text></g>
<g transform="translate(0,98.0)"><line x1="172.0" y1="124.0" x2="172.0" y2="126.0" stroke="#8a94a3" stroke-width="1"/><path d="M169.0,126.0 L172.0,131.0 L175.0,126.0 z" fill="#8a94a3"/></g>
<g transform="translate(0,98.0)"><rect x="12" y="131.0" width="320" height="52" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/></g>
