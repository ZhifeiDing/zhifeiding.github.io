<g transform="translate(0,98.0)"><text x="386.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 1</text></g>
<g transform="translate(0,98.0)"><rect x="428.0" y="50.0" width="76.0" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="466.0" y="66.5" font-size="7.6" fill="#111111" text-anchor="middle">GQA+MoE</text></g>
<g transform="translate(0,98.0)"><text x="466.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 2</text></g>
<g transform="translate(0,98.0)"><rect x="508.0" y="50.0" width="76.0" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="546.0" y="66.5" font-size="7.6" fill="#111111" text-anchor="middle">GQA+MoE</text></g>
<g transform="translate(0,98.0)"><text x="546.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 3</text></g>
<g transform="translate(0,98.0)"><rect x="588.0" y="50.0" width="76.0" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="626.0" y="66.5" font-size="7.6" fill="#111111" text-anchor="middle">GQA+MoE</text></g>
<g transform="translate(0,98.0)"><text x="626.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 4</text></g>
<g transform="translate(0,98.0)"><text x="348" y="104.0" font-size="7.7" fill="#33414f">三个规格共用同一骨架，只改层数、隐藏维与头数，形状由缩放定律先行确定。</text></g>
<g transform="translate(0,98.0)"><text x="348" y="116.0" font-size="7.7" fill="#33414f">主干末端接 1 层 MTP（损失权重 0.1），不计入 32 层。</text></g>
<g transform="translate(0,98.0)"><rect x="348" y="124.0" width="12" height="8" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="364" y="132.0" font-size="7.4" fill="#33414f">稠密 FFN：1 层</text></g>
<g transform="translate(0,98.0)"><rect x="508" y="124.0" width="12" height="8" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="524" y="132.0" font-size="7.4" fill="#33414f">MoE：31 层</text></g>
<line x1="12" y1="299.0" x2="668" y2="299.0" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12.0" y="317.0" font-size="9.6" fill="#1b2430" font-weight="bold">（c）GQA 链</text>
<text x="226.66666666666666" y="317.0" font-size="7.6" fill="#5a6675" text-anchor="end">32 Q / 4 KV × 128</text>
<rect x="12.0" y="325.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="337.0" font-size="8.0" fill="#446084" font-weight="bold">① 投影</text>
<text x="19.0" y="348.0" font-size="7.2" fill="#33414f">q, k, v = x W_q, x W_k, x W_v</text>
<text x="19.0" y="359.5" font-size="7.2" fill="#33414f">32 / 4 头，头维 128</text>
<rect x="12.0" y="368.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="380.0" font-size="8.0" fill="#446084" font-weight="bold">② QK-Norm</text>
<text x="19.0" y="391.0" font-size="7.2" fill="#33414f">q̂ = RMSNorm(q)，k̂ = RMSNorm(k)</text>
<text x="19.0" y="402.5" font-size="7.2" fill="#33414f">打分前各一次，FP32 累加</text>
<rect x="12.0" y="411.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="423.0" font-size="8.0" fill="#446084" font-weight="bold">③ Partial-RoPE</text>
<text x="19.0" y="434.0" font-size="7.2" fill="#33414f">仅前 64 维施加旋转，θ = 6e5</text>
<text x="19.0" y="445.5" font-size="7.2" fill="#33414f">后 64 维不动</text>
<rect x="12.0" y="454.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="466.0" font-size="8.0" fill="#446084" font-weight="bold">④ 打分与聚合</text>
<text x="19.0" y="477.0" font-size="7.2" fill="#33414f">o = softmax(q̂ k̂ᵀ/√128) v</text>
<text x="19.0" y="488.5" font-size="7.2" fill="#33414f">4 个 KV 头供 32 头复用</text>
<rect x="12.0" y="497.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="509.0" font-size="8.0" fill="#446084" font-weight="bold">⑤ 输出投影</text>
<text x="19.0" y="520.0" font-size="7.2" fill="#33414f">y = o W_O</text>
<text x="19.0" y="531.5" font-size="7.2" fill="#33414f">4096</text>
<text x="232.66666666666666" y="317.0" font-size="9.6" fill="#1b2430" font-weight="bold">（d）路由与合并</text>
<text x="447.3333333333333" y="317.0" font-size="7.6" fill="#5a6675" text-anchor="end">256 选 8 + 1 共享</text>
<rect x="232.66666666666666" y="325.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="239.66666666666666" y="337.0" font-size="8.0" fill="#55702f" font-weight="bold">① 路由打分</text>
<text x="239.66666666666666" y="348.0" font-size="7.2" fill="#33414f">s_i = σ(x e_iᵀ) + b_i</text>
<text x="239.66666666666666" y="359.5" font-size="7.2" fill="#33414f">无辅助损失的偏置均衡</text>
<rect x="232.66666666666666" y="368.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="239.66666666666666" y="380.0" font-size="8.0" fill="#55702f" font-weight="bold">② 组限制选择</text>
<text x="239.66666666666666" y="391.0" font-size="7.2" fill="#33414f">先按 8 组取 4 组，再在组内取 top-8</text>
<text x="239.66666666666666" y="402.5" font-size="7.2" fill="#33414f">组内两级选择</text>
<rect x="232.66666666666666" y="411.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="239.66666666666666" y="423.0" font-size="8.0" fill="#55702f" font-weight="bold">③ 专家 FFN</text>
<text x="239.66666666666666" y="434.0" font-size="7.2" fill="#33414f">h_i = (SiLU(x W_g,i) ⊙ x W_u,i) W_d,i</text>
<text x="239.66666666666666" y="445.5" font-size="7.2" fill="#33414f">专家中间维 1024</text>
<rect x="232.66666666666666" y="454.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="239.66666666666666" y="466.0" font-size="8.0" fill="#55702f" font-weight="bold">④ 共享专家</text>
<text x="239.66666666666666" y="477.0" font-size="7.2" fill="#33414f">E_s(x) 与路由专家并列</text>
<text x="239.66666666666666" y="488.5" font-size="7.2" fill="#33414f">1 个共享</text>
<rect x="232.66666666666666" y="497.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="239.66666666666666" y="509.0" font-size="8.0" fill="#55702f" font-weight="bold">⑤ 合并</text>
<text x="239.66666666666666" y="520.0" font-size="7.2" fill="#33414f">y = 2.5 · Σ ŝ_i h_i + E_s(x)</text>
<text x="239.66666666666666" y="531.5" font-size="7.2" fill="#33414f">缩放 2.5，一次 all-to-all</text>
<text x="453.3333333333333" y="317.0" font-size="9.6" fill="#1b2430" font-weight="bold">（e）MTP 与缓存</text>
<text x="668.0" y="317.0" font-size="7.6" fill="#5a6675" text-anchor="end">1 层，损失权重 0.1</text>
<rect x="453.3333333333333" y="325.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3333333333333" y="337.0" font-size="8.0" fill="#446084" font-weight="bold">① 输入拼接</text>
<text x="460.3333333333333" y="348.0" font-size="7.2" fill="#33414f">[RMSNorm(h_t) ; RMSNorm(Emb(t+1))]</text>
<text x="460.3333333333333" y="359.5" font-size="7.2" fill="#33414f">两个分支各自归一</text>
<rect x="453.3333333333333" y="368.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3333333333333" y="380.0" font-size="8.0" fill="#446084" font-weight="bold">② 投影</text>
<text x="460.3333333333333" y="391.0" font-size="7.2" fill="#33414f">h' = M · 拼接向量</text>
<text x="460.3333333333333" y="402.5" font-size="7.2" fill="#33414f">折回 4096</text>
<rect x="453.3333333333333" y="411.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3333333333333" y="423.0" font-size="8.0" fill="#446084" font-weight="bold">③ 单层块</text>
