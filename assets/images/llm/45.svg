<rect x="646.67" y="96" width="6.41" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.6"/>
<rect x="653.78" y="96" width="6.41" height="26" fill="#fff2dc" stroke="#a9742a" stroke-width="0.6"/>
<rect x="660.89" y="96" width="6.41" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.6"/>
<rect x="348.00" y="125" width="20.63" height="2.6" fill="#1b2430"/>
<text x="375.33" y="129" font-size="7.4" fill="#5a6675">前 3 层稠密 MLP</text>
<rect x="348" y="140" width="9" height="9" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<text x="361" y="148" font-size="8.0" fill="#33414f">KDA 线性层 34</text>
<rect x="458" y="140" width="9" height="9" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<text x="471" y="148" font-size="8.0" fill="#33414f">DSA 稀疏层 11</text>
<text x="578" y="148" font-size="8.0" fill="#5a6675">每 4 层 1 组，比例 3 : 1</text>
<text x="348" y="170" font-size="8.4" fill="#1b2430" font-weight="bold">放大第 1–4 层</text>
<rect x="348" y="178" width="68" height="34" rx="2" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/>
<text x="355" y="191" font-size="8.0" fill="#5a6675">层 1</text>
<text x="355" y="205" font-size="9.6" fill="#1b2430" font-weight="bold">KDA</text>
<rect x="422" y="178" width="68" height="34" rx="2" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/>
<text x="429" y="191" font-size="8.0" fill="#5a6675">层 2</text>
<text x="429" y="205" font-size="9.6" fill="#1b2430" font-weight="bold">KDA</text>
<rect x="496" y="178" width="68" height="34" rx="2" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/>
<text x="503" y="191" font-size="8.0" fill="#5a6675">层 3</text>
<text x="503" y="205" font-size="9.6" fill="#1b2430" font-weight="bold">KDA</text>
<rect x="570" y="178" width="68" height="34" rx="2" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="577" y="191" font-size="8.0" fill="#5a6675">层 4</text>
<text x="577" y="205" font-size="9.6" fill="#1b2430" font-weight="bold">DSA</text>
<text x="348" y="230" font-size="8.0" fill="#33414f">KDA 层不写 KV：每层状态 64 × 128 × 128，FP32 约 4 MB</text>
<text x="348" y="244" font-size="8.0" fill="#33414f">DSA 层每 token 写 512 维潜向量 + 256 维索引器状态</text>
<text x="348" y="258" font-size="8.0" fill="#33414f">11 个稀疏层各自持索引器，不做跨层复用</text>
<text x="12.0" y="340" font-size="9.6" fill="#1b2430" font-weight="bold">（c）稀疏层：MLA + IndexPool</text>
<rect x="12.0" y="348" width="214.7" height="38" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="19.0" y="360" font-size="8.0" fill="#55702f" font-weight="bold">① MLA 低秩投影</text>
<text x="19.0" y="371" font-size="7.2" fill="#33414f">q_a 4096→1536，q_b→64 × 256</text>
<text x="19.0" y="382" font-size="7.2" fill="#33414f">kv_a→512，kv_b→64 × 512</text>
<rect x="12.0" y="391" width="214.7" height="38" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="19.0" y="403" font-size="8.0" fill="#55702f" font-weight="bold">② 索引器投影</text>
<text x="19.0" y="414" font-size="7.2" fill="#33414f">32 头 × 128，键经 LayerNorm</text>
<text x="19.0" y="425" font-size="7.2" fill="#33414f">查询复用 q 的 1536 维残差</text>
<rect x="12.0" y="434" width="214.7" height="38" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="19.0" y="446" font-size="8.0" fill="#55702f" font-weight="bold">③ 键池化 IndexPool</text>
<text x="19.0" y="457" font-size="7.2" fill="#33414f">4 键按门控加权合为 1</text>
<text x="19.0" y="468" font-size="7.2" fill="#33414f">门控取自隐藏态，另加位置偏置</text>
<rect x="12.0" y="477" width="214.7" height="38" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="19.0" y="489" font-size="8.0" fill="#55702f" font-weight="bold">④ 池级打分与选择</text>
<text x="19.0" y="500" font-size="7.2" fill="#33414f">s = Σ w ReLU(q k_pᵀ/√128)</text>
<text x="19.0" y="511" font-size="7.2" fill="#33414f">取 512 池 → 2048 token，末池恒选</text>
<rect x="12.0" y="520" width="214.7" height="38" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="19.0" y="532" font-size="8.0" fill="#55702f" font-weight="bold">⑤ 稀疏聚合</text>
<text x="19.0" y="543" font-size="7.2" fill="#33414f">o = softmax(q k_Iᵀ/√256) v_I</text>
<text x="19.0" y="554" font-size="7.2" fill="#33414f">无位置编码；y = o W_O 回 4096</text>
<text x="232.7" y="340" font-size="9.6" fill="#1b2430" font-weight="bold">（d）KDA 层：两形态共用一式</text>
<rect x="232.7" y="348" width="214.7" height="38" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.7" y="360" font-size="8.0" fill="#a9742a" font-weight="bold">① 三路投影</text>
<text x="239.7" y="371" font-size="7.2" fill="#33414f">q / k / v 各 64 头 × 128</text>
<text x="239.7" y="382" font-size="7.2" fill="#33414f">q、k 在核内作 L2 归一化</text>
<rect x="232.7" y="391" width="214.7" height="38" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.7" y="403" font-size="8.0" fill="#a9742a" font-weight="bold">② 深度短卷积</text>
<text x="239.7" y="414" font-size="7.2" fill="#33414f">核长 4，q、k、v 拼接后同卷积</text>
<text x="239.7" y="425" font-size="7.2" fill="#33414f">silu 激活，因果填充</text>
<rect x="232.7" y="434" width="214.7" height="38" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.7" y="446" font-size="8.0" fill="#a9742a" font-weight="bold">③ 遗忘门与 β</text>
<text x="239.7" y="457" font-size="7.2" fill="#33414f">g = −5 · σ(eᴬ(W x + b))</text>
<text x="239.7" y="468" font-size="7.2" fill="#33414f">β = σ(W_b x)，逐头学习率</text>
<rect x="232.7" y="477" width="214.7" height="38" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.7" y="489" font-size="8.0" fill="#a9742a" font-weight="bold">④ chunkwise（预填）</text>
<text x="239.7" y="500" font-size="7.2" fill="#33414f">块长 64，块内并行、块间传状态</text>
<text x="239.7" y="511" font-size="7.2" fill="#33414f">S ← α ⊙ S + β k (v − kᵀS)ᵀ</text>
<rect x="232.7" y="520" width="214.7" height="38" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.7" y="532" font-size="8.0" fill="#a9742a" font-weight="bold">⑤ recurrent（解码）</text>
<text x="239.7" y="543" font-size="7.2" fill="#33414f">o = q S，逐 token 更新状态</text>
<text x="239.7" y="554" font-size="7.2" fill="#33414f">状态以 FP32 保存，每层 4 MB</text>
<text x="453.3" y="340" font-size="9.6" fill="#1b2430" font-weight="bold">（e）mHC 残差与专家</text>
<rect x="453.3" y="348" width="214.7" height="38" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3" y="360" font-size="8.0" fill="#446084" font-weight="bold">① mHC 折叠与展开</text>
<text x="460.3" y="371" font-size="7.2" fill="#33414f">pre = σ(w) + ε，4 路折叠为 1 路</text>
<text x="460.3" y="382" font-size="7.2" fill="#33414f">post = 2σ(w)，1 路展开为 4 路</text>
<rect x="453.3" y="391" width="214.7" height="38" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3" y="403" font-size="8.0" fill="#446084" font-weight="bold">② mHC 混合</text>
<text x="460.3" y="414" font-size="7.2" fill="#33414f">out = In · comb + Out，comb 双随机</text>
<text x="460.3" y="425" font-size="7.2" fill="#33414f">Sinkhorn 20 次，行与列各为 1</text>
<rect x="453.3" y="434" width="214.7" height="38" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3" y="446" font-size="8.0" fill="#446084" font-weight="bold">③ 路由</text>
<text x="460.3" y="457" font-size="7.2" fill="#33414f">sigmoid 打分 + noaux_tc 偏置</text>
<text x="460.3" y="468" font-size="7.2" fill="#33414f">288 选 8 + 1 共享，缩放 2.5</text>
<rect x="453.3" y="477" width="214.7" height="38" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3" y="489" font-size="8.0" fill="#446084" font-weight="bold">④ 专家计算</text>
<text x="460.3" y="500" font-size="7.2" fill="#33414f">SwiGLU：gate、up 均截断 ±10</text>
<text x="460.3" y="511" font-size="7.2" fill="#33414f">中间维 2048；前 3 层稠密 12288</text>
<rect x="453.3" y="520" width="214.7" height="38" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="460.3" y="532" font-size="8.0" fill="#446084" font-weight="bold">⑤ 视觉与 MTP</text>
<text x="460.3" y="543" font-size="7.2" fill="#33414f">24 层 ViT，1024 维、16 头、patch 14</text>
<text x="460.3" y="554" font-size="7.2" fill="#33414f">2 × 2 合并输出 4096 维；MTP 1 层</text>
