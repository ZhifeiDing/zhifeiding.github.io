<svg xmlns="http://www.w3.org/2000/svg" width="680" height="655" viewBox="0 0 680 655" font-family="Georgia, 'Times New Roman', serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/></marker></defs>
<text x="340.0" y="24" font-size="14.5" fill="#111111" text-anchor="middle">GLM-5.3-Flash 的层组合与算子序列</text>
<text x="340.0" y="43" font-size="8.9" fill="#5a6675" text-anchor="middle">45 层 = 3 层稠密 + 42 层 MoE，注意力按「3 层 KDA + 1 层 DSA」排布，残差为 mHC 四路混流</text>
<text x="340.0" y="58" font-size="8.9" fill="#5a6675" text-anchor="middle">KDA 以定长状态替代 KV（chunkwise / recurrent 两形态），DSA 以 IndexPool 把索引打分粒度由 token 放大到 4-token 组</text>
<line x1="12" y1="70" x2="668" y2="70" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="90" font-size="9.8" fill="#1b2430" font-weight="bold">（a）块内组合：注意力按层型二选一</text>
<text x="348" y="90" font-size="9.8" fill="#1b2430" font-weight="bold">（b）45 层：KDA 34 / DSA 11</text>
<rect x="12" y="98" width="320" height="18" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9"/>
<text x="20" y="110.5" font-size="9.0" fill="#1b2430" text-anchor="start">输入 xˡ（4 路 mHC 流）</text>
<text x="324" y="110.5" font-size="8.2" fill="#5a6675" text-anchor="end">4 × 4096</text>
<line x1="172.0" y1="116" x2="172.0" y2="120.5" stroke="#8a94a3" stroke-width="1" marker-end="url(#ar)"/>
<rect x="12" y="119" width="320" height="24" fill="#eef1f7" stroke="#446084" stroke-width="0.9"/>
<text x="20" y="129.5" font-size="8.5" fill="#1b2430" text-anchor="start">attn mHC：pre 折叠 → 块 → post 展开 + comb 混合</text>
<text x="20" y="139.5" font-size="7.4" fill="#5a6675" text-anchor="start">comb 经 Sinkhorn 20 次，约束为双随机矩阵</text>
<line x1="172.0" y1="143" x2="172.0" y2="147.5" stroke="#8a94a3" stroke-width="1" marker-end="url(#ar)"/>
<rect x="12" y="147" width="320" height="18" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9"/>
<text x="20" y="159.5" font-size="8.8" fill="#1b2430" text-anchor="start">RMSNorm</text>
<text x="324" y="159.5" font-size="7.6" fill="#5a6675" text-anchor="end">γ ⊙ x / ‖x‖</text>
<line x1="172.0" y1="165" x2="172.0" y2="169.5" stroke="#8a94a3" stroke-width="1" marker-end="url(#ar)"/>
<rect x="12" y="169" width="320" height="56" fill="#ffffff" stroke="#446084" stroke-width="1.0"/>
<text x="20" y="182" font-size="8.8" fill="#446084" text-anchor="start" font-weight="bold">注意力单元：按层型二选一</text>
<rect x="20" y="186" width="304" height="17" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<text x="25" y="198" font-size="7.7" fill="#33414f" text-anchor="start">34 层 KDA：三路投影 → 短卷积 → 遗忘门 → 递推</text>
<rect x="20" y="204" width="304" height="17" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<text x="25" y="216" font-size="7.4" fill="#33414f" text-anchor="start">11 层 DSA：MLA 低秩 → IndexPool 池化 → 池级 top-512 → 聚合</text>
<line x1="172.0" y1="225" x2="172.0" y2="229.5" stroke="#8a94a3" stroke-width="1" marker-end="url(#ar)"/>
<rect x="12" y="229" width="320" height="24" fill="#eef1f7" stroke="#446084" stroke-width="0.9"/>
<text x="20" y="239.5" font-size="8.5" fill="#1b2430" text-anchor="start">ffn mHC：同一组 pre / post / comb</text>
<text x="20" y="249.5" font-size="7.4" fill="#5a6675" text-anchor="start">与注意力共用 4 路流，参数同样不参与量化</text>
<line x1="172.0" y1="253" x2="172.0" y2="257.5" stroke="#8a94a3" stroke-width="1" marker-end="url(#ar)"/>
<rect x="12" y="257" width="320" height="18" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9"/>
<text x="20" y="269.5" font-size="8.8" fill="#1b2430" text-anchor="start">RMSNorm</text>
<text x="324" y="269.5" font-size="7.6" fill="#5a6675" text-anchor="end">每 token 独立</text>
<line x1="172.0" y1="275" x2="172.0" y2="279.5" stroke="#8a94a3" stroke-width="1" marker-end="url(#ar)"/>
<rect x="12" y="279" width="320" height="38" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/>
<text x="20" y="292" font-size="8.6" fill="#1b2430" text-anchor="start">前馈单元：42 层 MoE（288 选 8 + 1 共享，中间维 2048）</text>
<text x="20" y="304" font-size="7.6" fill="#33414f" text-anchor="start">前 3 层为稠密 MLP，中间维 12288；SwiGLU 截断 ±10</text>
<text x="20" y="314" font-size="7.6" fill="#5a6675" text-anchor="start">视觉前端 24 层 ViT，MTP 1 层</text>
