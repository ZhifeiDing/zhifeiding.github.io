" width="119.5" height="66.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="505.8" y="454.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">输入 x</text><text x="505.8" y="469.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">残差流</text><rect x="575.5" y="426.0" width="119.5" height="66.0" rx="9" fill="#fce6e6" stroke="#b85450" stroke-width="1.3" fill-opacity="1"/><text x="635.2" y="454.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">四路展开</text><text x="635.2" y="469.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">含恒等映射</text><rect x="705.0" y="426.0" width="119.5" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="764.8" y="454.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">逐路缩放</text><text x="764.8" y="469.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">可学习系数</text><rect x="834.5" y="426.0" width="119.5" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="894.2" y="454.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">混合写回</text><text x="894.2" y="469.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">逐路缩放后相加</text><path d="M565.5,459.0 L575.5,459.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M695.0,459.0 L705.0,459.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M824.5,459.0 L834.5,459.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="514.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">四路残差让深层梯度不依赖单一路径，代价是每层多三次读写。</text><text x="80.0" y="664.0" font-size="11" fill="#4a4a4a" text-anchor="start">Hunyuan Hy4：78 层主干，77 层 MoE（256 选 8 + 1 共享，中间维 2048），首层 FFN 18432，末端原生 MTP 1 层（10B / 0.7B 激活）。</text><text x="80.0" y="688.0" font-size="11" fill="#4a4a4a" text-anchor="start">总参 770B / 每 token 激活 49B，隐藏维 6144，词表 120,832，上下文 1M；数值格式 BF16 / FP8，许可 Apache 2.0。</text><text x="80.0" y="712.0" font-size="11" fill="#4a4a4a" text-anchor="start">与 Hy3 相比：GQA 全注意力换为 Gated DSA，常规残差换为 4 路 iHC，上下文由 256K 扩到 1M；正式版另增视觉理解与 Computer Use。</text><rect x="96.0" y="749.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="758.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力 / 混合</text><rect x="193.8" y="749.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="215.8" y="758.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化 / 视觉</text><rect x="291.7" y="749.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="313.7" y="758.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影</text><rect x="346.7" y="749.0" width="16.0" height="12.0" rx="3" fill="#fce6e6" stroke="#b85450" stroke-width="1.0" fill-opacity="1"/><text x="368.7" y="758.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">残差</text><rect x="401.7" y="749.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="423.7" y="758.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>