<text x="24" y="692" font-size="10.6" font-weight="700" fill="#8a6d1f">核算：缓存、算力与权重</text>
<rect x="24.0" y="702" width="366.6666666666667" height="85" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="36.0" y="719" font-size="12.4" font-weight="700" fill="#1b2430">KV Cache / token</text>
<text x="36.0" y="738" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">GA：23 × 2 × 4 × 192 × 2 B</text>
<text x="36.0" y="756" font-size="9.4" fill="#5d6878">≈ 69 KB（BF16），随 L 增长</text>
<text x="36.0" y="771" font-size="9.4" fill="#5d6878">SWA：69 层按 512 窗口环形覆盖，总量与 L 无关</text>
<rect x="406.6666666666667" y="702" width="366.6666666666667" height="70" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="418.6666666666667" y="719" font-size="12.4" font-weight="700" fill="#1b2430">索引器算力</text>
<text x="418.6666666666667" y="738" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">23 层 × 16 头 × 256 维打分</text>
<text x="418.6666666666667" y="756" font-size="9.4" fill="#5d6878">约占全局层注意力的 1/8</text>
<rect x="789.3333333333334" y="702" width="366.6666666666667" height="70" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="801.3333333333334" y="719" font-size="12.4" font-weight="700" fill="#1b2430">权重体积</text>
<text x="801.3333333333334" y="738" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">600B：BF16 ≈ 1.2 TB / FP8 ≈ 600 GB</text>
<text x="801.3333333333334" y="756" font-size="9.4" fill="#5d6878">FP8 需 8×80GB</text>
