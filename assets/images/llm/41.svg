<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="806" viewBox="0 0 1180 806" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/></marker></defs>
<rect width="1180" height="806" fill="#ffffff"/>
<text x="24" y="40" font-size="19" font-weight="700" fill="#16202c">Step 5 Preview｜SWA / GA 与稀疏索引算子分解</text>
<text x="24" y="62" font-size="11.2" fill="#4d5866">92 层 · 隐藏维 4096 · FFN 13,824 · 词表 128,896 · GQA 64 Q / 4 KV × 192 · 69 层 SWA(512) + 23 层 GA · 352 专家 top-8 + 1 共享、中间维 1536 · MTP 3 层</text>
<text x="24" y="80" font-size="10.2" fill="#8a94a2">算子级数据流：每框给出算子、计算公式与张量维度；B = batch，L = 序列长度，d_h = 头维</text>
<line x1="24" y1="92" x2="1156" y2="92" stroke="#dfe4ea" stroke-width="1"/>
<text x="24" y="110" font-size="10.6" font-weight="700" fill="#6b7280">输入与归一</text>
<text x="286" y="110" font-size="10.6" font-weight="700" fill="#3f6fa8">注意力通路</text>
<text x="736" y="110" font-size="10.6" font-weight="700" fill="#3d8b5f">前馈 / 专家通路</text>
<rect x="24" y="118" width="236" height="70" rx="7" fill="#f4f6f9" stroke="#7d8794" stroke-width="1.2"/>
<text x="36" y="135" font-size="12.4" font-weight="700" fill="#1b2430">词嵌入查表</text>
<text x="36" y="154" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">x = E[t]</text>
<text x="36" y="172" font-size="9.4" fill="#5d6878">[B,L] → [B,L,4096]</text>
<rect x="24" y="204" width="236" height="70" rx="7" fill="#f4f6f9" stroke="#7d8794" stroke-width="1.2"/>
<text x="36" y="221" font-size="12.4" font-weight="700" fill="#1b2430">视觉投影</text>
<text x="36" y="240" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">z = Proj(ViT_{47}(I))，stride 2</text>
<text x="36" y="258" font-size="9.4" fill="#5d6878">728² → 169 token</text>
<rect x="24" y="290" width="236" height="70" rx="7" fill="#f4f6f9" stroke="#7d8794" stroke-width="1.2"/>
<text x="36" y="307" font-size="12.4" font-weight="700" fill="#1b2430">RMSNorm</text>
<text x="36" y="326" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">x̂ = x / √(mean(x²)+ε) ⊙ γ</text>
<text x="36" y="344" font-size="9.4" fill="#5d6878">4096</text>
<rect x="286" y="118" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="135" font-size="12.4" font-weight="700" fill="#1b2430">① QKV 投影（GQA）</text>
<text x="298" y="154" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">q, k, v = x W_q, x W_k, x W_v</text>
<text x="298" y="172" font-size="9.4" fill="#5d6878">64 Q / 4 KV，头维 192</text>
<rect x="286" y="208" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="225" font-size="12.4" font-weight="700" fill="#1b2430">② 位置编码</text>
<text x="298" y="244" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">RoPE：SWA θ=1e4；GA θ=1e7，旋转维取 1/3</text>
<text x="298" y="262" font-size="9.4" fill="#5d6878">部分维度旋转</text>
<rect x="286" y="298" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="315" font-size="12.4" font-weight="700" fill="#1b2430">③ 掩码</text>
<text x="298" y="334" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">M_ij = 0 若 j ≥ i−512（SWA）；GA 全因果</text>
<text x="298" y="352" font-size="9.4" fill="#5d6878">69 / 23 层分工</text>
<rect x="286" y="388" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="405" font-size="12.4" font-weight="700" fill="#1b2430">④ GA 块索引</text>
<text x="298" y="424" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">s_b = Σ_h w_h ssmax(q_I · k_I,b), 块粒度 8</text>
<text x="298" y="442" font-size="9.4" fill="#5d6878">16 索引头，proxy 维 256</text>
<rect x="286" y="478" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="495" font-size="12.4" font-weight="700" fill="#1b2430">⑤ Top-512 块 + 注意力</text>
<text x="298" y="514" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">o = softmax(q k_{I∪win}ᵀ/√192) v</text>
<text x="298" y="532" font-size="9.4" fill="#5d6878">k = 512 块</text>
<rect x="286" y="568" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="585" font-size="12.4" font-weight="700" fill="#1b2430">⑥ 逐头输出门控</text>
<text x="298" y="604" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">y = (o ⊙ σ(x W_g)) W_O ;  x ← x + y</text>
<text x="298" y="622" font-size="9.4" fill="#5d6878">→ 4096</text>
<rect x="736" y="118" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="135" font-size="12.4" font-weight="700" fill="#1b2430">① 路由打分</text>
<text x="748" y="154" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">s_i = σ(x e_iᵀ) + b_i,  i = 1…352</text>
<text x="748" y="172" font-size="9.4" fill="#5d6878">[B,L,352]</text>
<rect x="736" y="208" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="225" font-size="12.4" font-weight="700" fill="#1b2430">② Top-k</text>
<text x="748" y="244" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">I = top8(s) + 共享专家 ;  ŝ × 3.0</text>
<text x="748" y="262" font-size="9.4" fill="#5d6878">9 / 353</text>
<rect x="736" y="298" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="315" font-size="12.4" font-weight="700" fill="#1b2430">③ 专家 SwiGLU</text>
<text x="748" y="334" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">h_i = (SiLU(x W_g,i) ⊙ x W_u,i) W_d,i</text>
<text x="748" y="352" font-size="9.4" fill="#5d6878">4096 → 1536 → 4096</text>
<rect x="736" y="388" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="405" font-size="12.4" font-weight="700" fill="#1b2430">④ 合并</text>
<text x="748" y="424" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">y = 3.0 · Σ ŝ_i h_i + E_s(x)</text>
<text x="748" y="442" font-size="9.4" fill="#5d6878">88 层 MoE，4 层稠密</text>
<rect x="736" y="478" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="495" font-size="12.4" font-weight="700" fill="#1b2430">⑤ 3 层 MTP</text>
<text x="748" y="514" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">T_1..3 = softmax(W_t h), 并行预测</text>
<text x="748" y="532" font-size="9.4" fill="#5d6878">投机解码</text>
