<text x="340.0" y="24" font-size="15" fill="#111111" text-anchor="middle">Qwen3.8-Max 的层组合、GDN 两种执行形态与缓存核算</text>
<text x="340.0" y="44" font-size="9.2" fill="#5a6675" text-anchor="middle">2.4T 总参 / 约 95B 激活 / 1M 上下文：承 Qwen3.5 的三比一混合，前馈换为更稀疏的 MoE</text>
<text x="340.0" y="60" font-size="9.2" fill="#5a6675" text-anchor="middle">层数、专家数与头配置官方未披露，图中以符号记；但既以 GDN 为骨架，两种执行形态与两段式缓存即随之确定</text>
