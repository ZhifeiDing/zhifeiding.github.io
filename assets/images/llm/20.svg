<text x="20" y="245" font-size="8.2" fill="#33414f">专家数与 top-k 未披露；激活约 95B，占总参 4%</text>
<text x="20" y="258" font-size="8.2" fill="#33414f">对照 3.5：397B / 17B，激活比 4.3%</text>
<line x1="172.0" y1="269" x2="172.0" y2="271" stroke="#8a94a3" stroke-width="1"/><path d="M169.0,271 L172.0,276 L175.0,271 z" fill="#8a94a3"/>
<text x="182.0" y="275" font-size="8.2" fill="#5a6675">× L 层</text>
<text x="348" y="90" font-size="10.2" fill="#1b2430" font-weight="bold">（b）3 : 1 的循环单元（层数未披露）</text>
<text x="348" y="112" font-size="7.8" fill="#5a6675">第 0 层起每 4 层一循环，组数 L/4 未定</text>
