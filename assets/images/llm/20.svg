<rect x="374.6666666666667" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<rect x="401.3333333333333" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
