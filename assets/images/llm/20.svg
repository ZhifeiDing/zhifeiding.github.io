<rect x="454.6666666666667" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<rect x="481.33333333333337" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<rect x="508.0" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<rect x="534.6666666666667" y="118" width="25.46666666666667" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="561.3333333333334" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<rect x="588.0" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<rect x="614.6666666666667" y="118" width="25.46666666666667" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<rect x="641.3333333333334" y="118" width="25.46666666666667" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="348" y="140" width="320" height="12" fill="#ffffff" stroke="#c9cfd8" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="508.0" y="149.5" font-size="7.6" fill="#5a6675" text-anchor="middle">其后 L − 12 层同构，L 未披露</text>
<text x="348" y="172" font-size="8.4" fill="#1b2430" font-weight="bold">放大第 0–3 层</text>
<rect x="348.0" y="178" width="76.0" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/><text x="386.0" y="193.7" font-size="8.0" fill="#111111" text-anchor="middle">GDN</text>
<text x="386.0" y="218" font-size="7.4" fill="#5a6675" text-anchor="middle">层 0</text>
<rect x="428.0" y="178" width="76.0" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/><text x="466.0" y="193.7" font-size="8.0" fill="#111111" text-anchor="middle">GDN</text>
<text x="466.0" y="218" font-size="7.4" fill="#5a6675" text-anchor="middle">层 1</text>
<rect x="508.0" y="178" width="76.0" height="26" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/><text x="546.0" y="193.7" font-size="8.0" fill="#111111" text-anchor="middle">GDN</text>
<text x="546.0" y="218" font-size="7.4" fill="#5a6675" text-anchor="middle">层 2</text>
<rect x="588.0" y="178" width="76.0" height="26" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/><text x="626.0" y="193.7" font-size="8.0" fill="#111111" text-anchor="middle">全注意力</text>
<text x="626.0" y="218" font-size="7.4" fill="#5a6675" text-anchor="middle">层 3</text>
<text x="348" y="238" font-size="8.0" fill="#33414f">与 3.5 同构：只此两种注意力，每层之后均接 MoE；</text>
<text x="348" y="251" font-size="8.0" fill="#33414f">差别在专家侧更稀、容量更大，注意力侧未换配方。</text>
<rect x="348" y="268" width="12" height="8" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<text x="364" y="276" font-size="7.8" fill="#33414f">GDN：3/4 层，定长状态</text>
<rect x="508" y="268" width="12" height="8" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<text x="524" y="276" font-size="7.8" fill="#33414f">全注意力：1/4 层，KV 随 token 增</text>
<line x1="12" y1="290" x2="668" y2="290" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="308" font-size="10.2" fill="#1b2430" font-weight="bold">（c）GDN 的两种执行形态：同一递推，两套 kernel</text>
<rect x="12" y="318" width="320" height="22" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/><text x="20" y="333" font-size="9.8" fill="#55702f" font-weight="bold">chunkwise：预填充走这条</text><text x="324" y="333" font-size="7.9" fill="#55702f" text-anchor="end">块内并行，块间串行</text><rect x="12" y="346" width="320" height="28" fill="#ffffff" stroke="#55702f" stroke-width="0.8"/><text x="20" y="359" font-size="8.5" fill="#1b2430" font-weight="bold">① 分块</text><text x="20" y="371" font-size="7.9" fill="#33414f">序列切成 C 个 token 一块，块长与 3.5 同为工程取值。</text><rect x="12" y="379" width="320" height="40" fill="#ffffff" stroke="#55702f" stroke-width="0.8"/><text x="20" y="392" font-size="8.5" fill="#1b2430" font-weight="bold">② 块内并行</text><text x="20" y="404" font-size="7.9" fill="#33414f">短卷积与门控之后构造下三角衰减矩阵 A，一次 GEMM</text><text x="20" y="416" font-size="7.9" fill="#33414f">覆盖 C × C，块内所有位置对并行算完。</text><rect x="12" y="424" width="320" height="40" fill="#ffffff" stroke="#55702f" stroke-width="0.8"/><text x="20" y="437" font-size="8.5" fill="#1b2430" font-weight="bold">③ 块状态递推</text><text x="20" y="449" font-size="7.9" fill="#33414f">S_c = γ_c S_{c-1} + K_cᵀ diag(β) (V_c − K_c S_{c-1})</text><text x="20" y="461" font-size="7.9" fill="#33414f">块间只传状态，不传历史条目——这正是 1M 上下文成立的前提。</text><rect x="12" y="469" width="320" height="28" fill="#ffffff" stroke="#55702f" stroke-width="0.8"/><text x="20" y="482" font-size="8.5" fill="#1b2430" font-weight="bold">④ 块输出</text><text x="20" y="494" font-size="7.9" fill="#33414f">O_c = A V_c + γ (Q_c S_{c-1})</text><rect x="12" y="502" width="320" height="40" fill="#ffffff" stroke="#55702f" stroke-width="0.8"/><text x="20" y="515" font-size="8.5" fill="#1b2430" font-weight="bold">⑤ 负载画像</text><text x="20" y="527" font-size="7.9" fill="#33414f">并行度 = 批 × 块数，算术强度随 C 上升；权重占比高，</text><text x="20" y="539" font-size="7.9" fill="#33414f">GEMM 形状受 2.4T 容量侧的访存支配。</text>
<rect x="348" y="318" width="320" height="22" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/><text x="356" y="333" font-size="9.8" fill="#4a3212" font-weight="bold">recurrent：解码走这条</text><text x="660" y="333" font-size="7.9" fill="#6b4a1c" text-anchor="end">逐 token 递推，时间维不可分</text><rect x="348" y="346" width="320" height="28" fill="#ffffff" stroke="#a9742a" stroke-width="0.8"/><text x="356" y="359" font-size="8.5" fill="#1b2430" font-weight="bold">① 单 token 投影</text><text x="356" y="371" font-size="7.9" fill="#33414f">q_t, k_t, v_t 各一次矩阵乘；头数与头维未披露。</text><rect x="348" y="379" width="320" height="28" fill="#ffffff" stroke="#a9742a" stroke-width="0.8"/><text x="356" y="392" font-size="8.5" fill="#1b2430" font-weight="bold">② 门控</text><text x="356" y="404" font-size="7.9" fill="#33414f">α_t = σ(·) 逐通道衰减，β_t = σ(·) 控制写入强度。</text><rect x="348" y="412" width="320" height="28" fill="#ffffff" stroke="#a9742a" stroke-width="0.8"/><text x="356" y="425" font-size="8.5" fill="#1b2430" font-weight="bold">③ 状态更新</text><text x="356" y="437" font-size="7.9" fill="#33414f">S_t = S_{t-1}(diag α_t − β_t k_t k_tᵀ) + β_t k_t v_tᵀ</text><rect x="348" y="445" width="320" height="28" fill="#ffffff" stroke="#a9742a" stroke-width="0.8"/><text x="356" y="458" font-size="8.5" fill="#1b2430" font-weight="bold">④ 读出</text><text x="356" y="470" font-size="7.9" fill="#33414f">o_t = S_t q_t，每头一次向量乘矩阵。</text><rect x="348" y="478" width="320" height="40" fill="#ffffff" stroke="#a9742a" stroke-width="0.8"/><text x="356" y="491" font-size="8.5" fill="#1b2430" font-weight="bold">⑤ 负载画像</text><text x="356" y="503" font-size="7.9" fill="#33414f">批内并行、时间维串行；每步搬运的权重远大于状态，</text><text x="356" y="515" font-size="7.9" fill="#33414f">解码在这一档是权重带宽受限，而非算力受限。</text>
<text x="12" y="563" font-size="8.4" fill="#33414f">两形态与 3.5 同构：chunkwise 求预填充吞吐，recurrent 求解码延迟，数学等价而舍入次序不同。</text>
<text x="12" y="577" font-size="8.4" fill="#33414f">2.4T 这一档多出一层压力：无论哪种形态，每步都要跨节点取权重，专家并行的通信量与容量同阶。</text>
<line x1="12" y1="589" x2="668" y2="589" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="605" font-size="10.2" fill="#1b2430" font-weight="bold">（d）门控全注意力：每四层出现一次的精确通路</text>
<rect x="12" y="613" width="122" height="34" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="73.0" y="627" font-size="8.3" fill="#4a3212" text-anchor="middle" font-weight="bold">QKV 投影</text>
<text x="73.0" y="639" font-size="7.4" fill="#33414f" text-anchor="middle">头数与头维未披露</text>
<line x1="135" y1="630" x2="140" y2="630" stroke="#8a94a3" stroke-width="1"/><path d="M140,627 L145,630 L140,633 z" fill="#8a94a3"/>
<rect x="146" y="613" width="122" height="34" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="207.0" y="627" font-size="8.3" fill="#4a3212" text-anchor="middle" font-weight="bold">Partial RoPE</text>
<text x="207.0" y="639" font-size="7.4" fill="#33414f" text-anchor="middle">沿 3.5，仅部分维旋转</text>
<line x1="269" y1="630" x2="274" y2="630" stroke="#8a94a3" stroke-width="1"/><path d="M274,627 L279,630 L274,633 z" fill="#8a94a3"/>
<rect x="280" y="613" width="122" height="34" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="341.0" y="627" font-size="8.3" fill="#4a3212" text-anchor="middle" font-weight="bold">打分与 softmax</text>
<text x="341.0" y="639" font-size="7.4" fill="#33414f" text-anchor="middle">q kᵀ / √d_h</text>
<line x1="403" y1="630" x2="408" y2="630" stroke="#8a94a3" stroke-width="1"/><path d="M408,627 L413,630 L408,633 z" fill="#8a94a3"/>
<rect x="414" y="613" width="122" height="34" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="475.0" y="627" font-size="8.3" fill="#4a3212" text-anchor="middle" font-weight="bold">输出门</text>
<text x="475.0" y="639" font-size="7.4" fill="#33414f" text-anchor="middle">o ⊙ σ(x W_g)</text>
<line x1="537" y1="630" x2="542" y2="630" stroke="#8a94a3" stroke-width="1"/><path d="M542,627 L547,630 L542,633 z" fill="#8a94a3"/>
<rect x="548" y="613" width="122" height="34" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="609.0" y="627" font-size="8.3" fill="#4a3212" text-anchor="middle" font-weight="bold">输出投影</text>
<text x="609.0" y="639" font-size="7.4" fill="#33414f" text-anchor="middle">分组输出回 d</text>
<text x="12" y="663" font-size="10.2" fill="#1b2430" font-weight="bold">（e）缓存与权重的核算：定长、按 token 增长、以及容量侧</text>
<rect x="12" y="671" width="656" height="17" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9"/>
<text x="18" y="683" font-size="8.0" fill="#1b2430" font-weight="bold">项目</text>
<text x="156" y="683" font-size="8.0" fill="#1b2430" font-weight="bold">每层单元</text>
<text x="312" y="683" font-size="8.0" fill="#1b2430" font-weight="bold">定长部分</text>
<text x="458" y="683" font-size="8.0" fill="#1b2430" font-weight="bold">随长度增长</text>
<line x1="12" y1="688" x2="668" y2="688" stroke="#c9cfd8" stroke-width="0.6"/>
<text x="18" y="701" font-size="8.0" fill="#1b2430">GDN 层</text>
<text x="156" y="701" font-size="8.0" fill="#33414f">H_v 头 × 128×128 状态</text>
<text x="312" y="701" font-size="8.0" fill="#1b2430">H_v = 64 时 2 MB / 层</text>
<text x="458" y="701" font-size="8.0" fill="#1b2430">不增长</text>
<line x1="12" y1="705" x2="668" y2="705" stroke="#c9cfd8" stroke-width="0.6"/>
<text x="18" y="718" font-size="8.0" fill="#1b2430">全注意力层</text>
<text x="156" y="718" font-size="8.0" fill="#33414f">2 KV 头 × 256 维 × (K + V)</text>
<text x="312" y="718" font-size="8.0" fill="#1b2430">—</text>
<text x="458" y="718" font-size="8.0" fill="#1b2430">2 KB / token / 层</text>
<line x1="12" y1="722" x2="668" y2="722" stroke="#c9cfd8" stroke-width="0.6"/>
<text x="18" y="735" font-size="8.0" fill="#1b2430">权重</text>
<text x="156" y="735" font-size="8.0" fill="#33414f">2.4T 参数，FP8 计</text>
<text x="312" y="735" font-size="8.0" fill="#1b2430">约 2.4 TB</text>
<text x="458" y="735" font-size="8.0" fill="#1b2430">跨节点分片</text>
<text x="12" y="755" font-size="8.4" fill="#33414f">层数未披露，故只能按层核算：1M 上下文下每个全注意力层约 2 GB，每 4 层出现一次，全注意力 15 层即约 30 GB；</text>
<text x="12" y="769" font-size="8.4" fill="#33414f">GDN 层合计不到百 MB。真正压住部署的是权重——2.4TB 须数十张卡分片，激活只有 95B，容量与算力在此彻底分家。</text>
</svg>