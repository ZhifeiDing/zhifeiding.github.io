<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/></marker></defs>
<rect width="940" height="700" fill="#ffffff"/>
<text x="24" y="34" font-size="16" fill="#16202c" text-anchor="start" font-weight="700">GLM-5.4 的层组合与算子序列</text>
<text x="24" y="56" font-size="10.8" fill="#4d5866" text-anchor="start">循环段内的算子与 5.3 逐项相同，增量只在两处，循环输出经门控写回残差流，第二轮注意力读两路 KV 并复用第一轮索引</text>
<line x1="24" y1="70" x2="916" y2="70" stroke="#dfe4ea"/>

<text x="24" y="96" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">（a）块内组合（循环段与非循环段同构）</text>

<rect x="24" y="108" width="104" height="66" rx="6" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.1"/>
<text x="76" y="128" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="700">RMSNorm</text>
<text x="76" y="146" font-size="8.6" fill="#4d5866" text-anchor="middle">h_t 归一化</text>
<text x="76" y="162" font-size="8.6" fill="#4d5866" text-anchor="middle">FP32 累加</text>

<rect x="140" y="108" width="104" height="66" rx="6" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.1"/>
<text x="192" y="126" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="700">MLA 投影</text>
<text x="192" y="143" font-size="8.6" fill="#4d5866" text-anchor="middle">q 秩 2048</text>
<text x="192" y="158" font-size="8.6" fill="#4d5866" text-anchor="middle">kv 秩 512</text>
<text x="192" y="170" font-size="8.6" fill="#4d5866" text-anchor="middle">qk 192 + RoPE 64</text>

<rect x="256" y="108" width="104" height="66" rx="6" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.1"/>
<text x="308" y="126" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="700">DSA 索引器</text>
<text x="308" y="143" font-size="8.6" fill="#5d6878" text-anchor="middle">32 头 × 128</text>
<text x="308" y="158" font-size="8.6" fill="#5d6878" text-anchor="middle">FP8 打分</text>
<text x="308" y="170" font-size="8.6" fill="#5d6878" text-anchor="middle">top-2048</text>

<rect x="372" y="108" width="104" height="66" rx="6" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.1"/>
<text x="424" y="126" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="700">稀疏聚合</text>
<text x="424" y="143" font-size="8.6" fill="#4d5866" text-anchor="middle">共享 KV 的 MQA</text>
<text x="424" y="158" font-size="8.6" fill="#4d5866" text-anchor="middle">v 头维 256</text>
<text x="424" y="170" font-size="8.6" fill="#4d5866" text-anchor="middle">64 查询头</text>

<rect x="488" y="108" width="104" height="66" rx="6" fill="#fbeef0" stroke="#b8566a" stroke-width="1.2"/>
<text x="540" y="126" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="700">门控写回</text>
<text x="540" y="143" font-size="8.6" fill="#6b3540" text-anchor="middle">h + g ⊙ (h′ − h)</text>
<text x="540" y="158" font-size="8.6" fill="#6b3540" text-anchor="middle">两轮各一组门</text>
<text x="540" y="170" font-size="8.6" fill="#6b3540" text-anchor="middle">逐 token 标量</text>

<rect x="604" y="108" width="104" height="66" rx="6" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.1"/>
<text x="656" y="126" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="700">RMSNorm</text>
<text x="656" y="143" font-size="8.6" fill="#4d5866" text-anchor="middle">前馈前归一化</text>
<text x="656" y="158" font-size="8.6" fill="#4d5866" text-anchor="middle">与 5.3 相同</text>

<rect x="720" y="108" width="104" height="66" rx="6" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.1"/>
<text x="772" y="126" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="700">MoE 前馈</text>
<text x="772" y="143" font-size="8.6" fill="#4d5866" text-anchor="middle">256 选 8 + 1 共享</text>
<text x="772" y="158" font-size="8.6" fill="#4d5866" text-anchor="middle">中间维 2048</text>
<text x="772" y="170" font-size="8.6" fill="#4d5866" text-anchor="middle">sigmoid 偏置路由</text>

<rect x="836" y="108" width="80" height="66" rx="6" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.1"/>
<text x="876" y="132" font-size="9.6" fill="#2f6b47" text-anchor="middle" font-weight="700">残差加</text>
<text x="876" y="150" font-size="8.6" fill="#3d4a56" text-anchor="middle">回主流</text>

<path d="M128,141 L140,141" stroke="#7c8794" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M244,141 L256,141" stroke="#7c8794" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M360,141 L372,141" stroke="#7c8794" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M476,141 L488,141" stroke="#7c8794" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M592,141 L604,141" stroke="#7c8794" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M708,141 L720,141" stroke="#7c8794" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M824,141 L836,141" stroke="#7c8794" stroke-width="1.2" marker-end="url(#a)"/>

<text x="24" y="196" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">（b）106 次层执行的排布（按比例绘制）</text>

<rect x="24" y="208" width="210" height="50" rx="5" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.1"/>
<text x="129" y="230" font-size="9.8" fill="#1b2430" text-anchor="middle" font-weight="700">第 1–25 层</text>
<text x="129" y="248" font-size="8.8" fill="#4d5866" text-anchor="middle">25 次 · 单轮</text>

<rect x="234" y="208" width="236" height="50" rx="5" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.1"/>
<text x="352" y="230" font-size="9.8" fill="#1b2430" text-anchor="middle" font-weight="700">第 26–53 层 · 第一轮</text>
<text x="352" y="248" font-size="8.8" fill="#5d6878" text-anchor="middle">28 次 · 门控偏小</text>

<rect x="470" y="208" width="236" height="50" rx="5" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="588" y="230" font-size="9.8" fill="#1b2430" text-anchor="middle" font-weight="700">第 26–53 层 · 第二轮</text>
<text x="588" y="248" font-size="8.8" fill="#5d6878" text-anchor="middle">28 次 · 权重相同</text>

<rect x="706" y="208" width="210" height="50" rx="5" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.1"/>
<text x="811" y="230" font-size="9.8" fill="#1b2430" text-anchor="middle" font-weight="700">第 54–78 层</text>
<text x="811" y="248" font-size="8.8" fill="#4d5866" text-anchor="middle">25 次 · 单轮</text>

<path d="M588,260 C588,280 352,280 352,262" stroke="#c2a03c" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="470" y="292" font-size="8.8" fill="#8a6d1f" text-anchor="middle">回环处第二轮读同一份权重，索引与窗口外 KV 复用第一轮</text>

<text x="24" y="316" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">（c）第二轮注意力的两路 KV</text>

<rect x="24" y="328" width="440" height="92" rx="6" fill="#fbfcfe" stroke="#b9c4d2" stroke-width="1.1"/>
<text x="40" y="348" font-size="9.8" fill="#1b2430" text-anchor="start" font-weight="700">窗口之外，跨轮共享</text>
<rect x="40" y="358" width="150" height="24" rx="3" fill="#dce8f6"/>
<text x="115" y="375" font-size="8.6" fill="#2c4a6b" text-anchor="middle">第一轮稀疏 KV（top-2048）</text>
<rect x="40" y="388" width="150" height="24" rx="3" fill="#eef2f7" stroke="#b9c4d2" stroke-dasharray="3 3"/>
<text x="115" y="405" font-size="8.6" fill="#7c8794" text-anchor="middle">第二轮不再生成</text>
<text x="206" y="375" font-size="9" fill="#4d5866" text-anchor="start">只在第一轮算一次，两轮共用；</text>
<text x="206" y="393" font-size="9" fill="#4d5866" text-anchor="start">这部分 KV 的容量与单轮等价，</text>
<text x="206" y="411" font-size="9" fill="#4d5866" text-anchor="start">不随轮数增长。</text>

<rect x="476" y="328" width="440" height="92" rx="6" fill="#fbfcfe" stroke="#b9c4d2" stroke-width="1.1"/>
<text x="492" y="348" font-size="9.8" fill="#1b2430" text-anchor="start" font-weight="700">窗口之内，每轮独立</text>
<rect x="492" y="358" width="110" height="24" rx="3" fill="#dce8f6"/>
<text x="547" y="375" font-size="8.6" fill="#2c4a6b" text-anchor="middle">第一轮窗口 KV</text>
<rect x="492" y="388" width="110" height="24" rx="3" fill="#fdf0d9" stroke="#c2a03c"/>
<text x="547" y="405" font-size="8.6" fill="#8a6d1f" text-anchor="middle">第二轮新生成</text>
<text x="616" y="375" font-size="9" fill="#4d5866" text-anchor="start">近处上下文是两轮差异最大的部分，</text>
<text x="616" y="393" font-size="9" fill="#4d5866" text-anchor="start">故各自保留，两路允许同一位置重叠，</text>
<text x="616" y="411" font-size="9" fill="#4d5866" text-anchor="start">多一轮的代价只是一个窗口的 KV。</text>

<text x="24" y="440" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">（d）两轮的逐 token 门控与步长</text>
<rect x="24" y="452" width="440" height="84" rx="6" fill="#fbeef0" stroke="#b8566a" stroke-width="1.1"/>
<text x="40" y="474" font-size="9" fill="#6b3540" text-anchor="start">门控 g 是逐 token 标量，插在块输出与残差相加之间</text>
<text x="40" y="492" font-size="9" fill="#6b3540" text-anchor="start">第一轮 g 小，先建全局状态；第二轮放开，完成精炼</text>
<text x="40" y="510" font-size="9" fill="#6b3540" text-anchor="start">步长随预测难度调整，难例在首轮写入更多</text>
<text x="40" y="528" font-size="9" fill="#6b3540" text-anchor="start">须与输出投影融合，否则每轮多一次 6144 维读写</text>

<text x="476" y="440" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">（e）专家、FP8 权重与 1 层 MTP</text>
<rect x="476" y="452" width="440" height="84" rx="6" fill="#fbfcfe" stroke="#b9c4d2" stroke-width="1.1"/>
<text x="492" y="474" font-size="9" fill="#3d4a56" text-anchor="start">专家 256 选 8 + 1 共享，中间维 2048，与 5.3 相同</text>
<text x="492" y="492" font-size="9" fill="#3d4a56" text-anchor="start">专家段在循环段内同样执行两次，权重不复制</text>
<text x="492" y="510" font-size="9" fill="#3d4a56" text-anchor="start">权重 FP8，约 756 GB；发布形态尚未公布</text>
<text x="492" y="528" font-size="9" fill="#3d4a56" text-anchor="start">末端 1 层 MTP，不参与循环</text>

<line x1="24" y1="552" x2="916" y2="552" stroke="#dfe4ea"/>
<text x="24" y="574" font-size="11.4" fill="#8a6d1f" text-anchor="start" font-weight="700">核算</text>
<text x="24" y="596" font-size="10" fill="#243447" text-anchor="start">权重：78 层一份，约 756 GB（FP8 计）；循环段 28 层占 28/78，解码一步内被读两遍，每步权重流量按 106/78 计约 1.03 TB。</text>
<text x="24" y="616" font-size="10" fill="#243447" text-anchor="start">KV：主 KV 与 5.3 同量级，约 90 KB/token，1M 上下文约 90 GB；窗口增量 28 × w × 576 B，w 取 512 时约 8.2 MB。</text>
<text x="24" y="636" font-size="10" fill="#243447" text-anchor="start">算力与串行：每 token 乘加增 35.9%，索引器不重算；依赖链由 78 步增至 106 步，张量并行摊不平这一段。</text>

<line x1="24" y1="648" x2="916" y2="648" stroke="#dfe4ea"/>
<text x="24" y="668" font-size="11.4" fill="#2f6b47" text-anchor="start" font-weight="700">对 kernel 的要求</text>
<text x="24" y="688" font-size="9.6" fill="#243447" text-anchor="start">门控写回须与 attention 输出投影融合；第二轮的 KV 读取跨共享段与窗口段两个地址区间，取数 kernel 需支持双源 gather，不能按单一连续区间假设。</text>
</svg>
