<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/></marker></defs>
<rect width="900" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="16" fill="#16202c" text-anchor="start" font-weight="700">Qwen3.8-Max 结构示意：稀疏 MoE 与三比一混合注意力</text>
<text x="24" y="56" font-size="11" fill="#4d5866" text-anchor="start">总参 2.4T / 激活约 95B · 上下文 1M · 原生多模态 · 以 Qwen3.5 为基座（官方未披露层数、专家数与头配置）</text>
<line x1="24" y1="70" x2="876" y2="70" stroke="#dfe4ea"/>
<rect x="24" y="86" width="250" height="58" rx="7" fill="#eef2f7" stroke="#5b6b7d" stroke-width="1.2"/>
<text x="36" y="106" font-size="12.2" fill="#1b2430" text-anchor="start" font-weight="700">输入</text>
<text x="36" y="125" font-size="10.2" fill="#4d5866" text-anchor="start">文本 / 图像 / 视频</text>
<rect x="24" y="170" width="250" height="58" rx="7" fill="#eef2f7" stroke="#5b6b7d" stroke-width="1.2"/>
<text x="36" y="190" font-size="12.2" fill="#1b2430" text-anchor="start" font-weight="700">多模态前端</text>
<text x="36" y="209" font-size="10.2" fill="#4d5866" text-anchor="start">视觉 token 与文本同一序列</text>
<rect x="24" y="254" width="250" height="82" rx="7" fill="#dde7f5" stroke="#446084" stroke-width="1.2"/>
<text x="36" y="274" font-size="12.2" fill="#1b2430" text-anchor="start" font-weight="700">语言主干</text>
<text x="36" y="293" font-size="10.2" fill="#4d5866" text-anchor="start">循环块 × N（层数未披露）</text>
<rect x="24" y="362" width="250" height="58" rx="7" fill="#eef2f7" stroke="#5b6b7d" stroke-width="1.2"/>
<text x="36" y="382" font-size="12.2" fill="#1b2430" text-anchor="start" font-weight="700">输出头</text>
<text x="36" y="401" font-size="10.2" fill="#4d5866" text-anchor="start">logits</text>
<line x1="149.0" y1="144" x2="149.0" y2="164" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="149.0" y1="228" x2="149.0" y2="248" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="149.0" y1="336" x2="149.0" y2="356" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="316" y="86" width="560" height="334" rx="7" fill="#fbfcfe" stroke="#b9c4d2" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="330" y="108" font-size="11.6" fill="#3f6fa8" text-anchor="start" font-weight="700">循环块内部：每 4 层一组，3 份线性注意力配 1 份全注意力</text>
<rect x="330" y="124" width="214" height="66" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="342" y="145" font-size="11.2" fill="#1b2430" text-anchor="start" font-weight="700">Gated DeltaNet 块（线性注意力）</text>
<text x="342" y="164" font-size="9.6" fill="#4d5866" text-anchor="start">定长循环状态压缩历史</text>
<text x="342" y="179" font-size="9.6" fill="#4d5866" text-anchor="start">头配置未披露</text>
<line x1="544" y1="157" x2="572" y2="157" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="578" y="124" width="200" height="66" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="590" y="145" font-size="11.2" fill="#1b2430" text-anchor="start" font-weight="700">MoE 前馈</text>
<text x="590" y="164" font-size="9.6" fill="#4d5866" text-anchor="start">256 选 8（专家数未披露）</text>
<text x="590" y="180" font-size="9.6" fill="#4d5866" text-anchor="start">共享专家 1 个</text>
<text x="864" y="148" font-size="13" fill="#8a6d1f" text-anchor="end" font-weight="700">× 3</text>
<rect x="330" y="212" width="214" height="66" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="342" y="233" font-size="11.2" fill="#1b2430" text-anchor="start" font-weight="700">门控全注意力块（Softmax）</text>
<text x="342" y="252" font-size="9.6" fill="#4d5866" text-anchor="start">精确检索，KV 头少于 Q</text>
<text x="342" y="267" font-size="9.6" fill="#4d5866" text-anchor="start">头配置未披露</text>
<line x1="544" y1="245" x2="572" y2="245" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="578" y="212" width="200" height="66" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="590" y="233" font-size="11.2" fill="#1b2430" text-anchor="start" font-weight="700">MoE 前馈</text>
<text x="590" y="252" font-size="9.6" fill="#4d5866" text-anchor="start">256 选 8（专家数未披露）</text>
<text x="590" y="268" font-size="9.6" fill="#4d5866" text-anchor="start">共享专家 1 个</text>
<text x="864" y="236" font-size="13" fill="#8a6d1f" text-anchor="end" font-weight="700">× 1</text>
<text x="330" y="310" font-size="10.4" fill="#243447" text-anchor="start">容量与激活：2.4T 总参 / 约 95B 激活，激活比约 4%；</text>
<text x="330" y="328" font-size="10.4" fill="#243447" text-anchor="start">容量由专家承担，每 token 计算量与百 B 级稠密模型同量级。</text>
<text x="330" y="352" font-size="10.4" fill="#3f6fa8" text-anchor="start">KV Cache 仅由 1/4 的全注意力层产生，1M 上下文由此可行。</text>
<text x="330" y="376" font-size="10.2" fill="#8a6d1f" text-anchor="start">注：N-gram 查表与 QSA 微块稀疏属 Qwen3.8-Flash-Next（Qwen4 预览），</text>
<text x="330" y="394" font-size="10.2" fill="#8a6d1f" text-anchor="start">     本档未采用，故图中不列。</text>
<line x1="24" y1="442" x2="876" y2="442" stroke="#dfe4ea"/>
<text x="24" y="464" font-size="10.6" fill="#8a6d1f" text-anchor="start" font-weight="700">官方通稿只交代：以 Qwen3.5 为基础、稀疏 MoE 结合混合注意力、2.4T/95B、上下文 1M。</text>
<text x="24" y="484" font-size="10.4" fill="#5d6878" text-anchor="start">层数、专家数、头配置与数值格式均未公开；图中标「未披露」处按符号记，不作推定。</text>
</svg>