<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="680" height="700" fill="#ffffff"/>
<text x="340.0" y="24" font-size="15" fill="#111111" text-anchor="middle">DeepSeek-V4.1-Flash 的层组合与三种 CSA2 模式</text>
<text x="340.0" y="44" font-size="9.0" fill="#5a6675" text-anchor="middle">40 层 = 20 层因果编码器 + 20 层解码器：编码器 2 层纯滑窗加 3 组（每组 1 Full + 5 Reuse，m = 2），解码器 5 组（1 Full 或 Reindex + 3 Reuse，m = 1）</text>
<text x="340.0" y="60" font-size="9.0" fill="#5a6675" text-anchor="middle">全 40 层中只有 4 层产生全局 KV、4 层只重新打分、30 层连 Top-k 索引一并复用、2 层不存全局 KV；前馈全部为 MoE</text>
