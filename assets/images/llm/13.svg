<rect x="456" y="368" width="212" height="22" fill="#446084" stroke="#dde7f5" stroke-width="0.9"/><text x="464" y="383" font-size="10.0" fill="#446084" font-weight="bold">Reuse</text><text x="660" y="383" font-size="8.0" fill="#c6d4e6" text-anchor="end">30 层</text><rect x="456" y="394" width="212" height="44" fill="#ffffff" stroke="#dde7f5" stroke-width="0.8"/><text x="464" y="408" font-size="8.6" fill="#1b2430" font-weight="bold">主 Q 与滑窗 KV</text><text x="464" y="421" font-size="8.0" fill="#33414f">本层计算，不入共享</text><line x1="562.0" y1="438" x2="562.0" y2="439" stroke="#8a94a3" stroke-width="1"/><path d="M559.0,439 L562.0,444 L565.0,439 z" fill="#8a94a3"/><rect x="456" y="444" width="212" height="44" fill="#ffffff" stroke="#dde7f5" stroke-width="0.8"/><text x="464" y="458" font-size="8.6" fill="#1b2430" font-weight="bold">全局 KV</text><text x="464" y="471" font-size="8.0" fill="#33414f">复用，不再生成</text><line x1="562.0" y1="488" x2="562.0" y2="489" stroke="#8a94a3" stroke-width="1"/><path d="M559.0,489 L562.0,494 L565.0,489 z" fill="#8a94a3"/><rect x="456" y="494" width="212" height="44" fill="#ffffff" stroke="#dde7f5" stroke-width="0.8"/><text x="464" y="508" font-size="8.6" fill="#1b2430" font-weight="bold">索引器键</text><text x="464" y="521" font-size="8.0" fill="#33414f">复用</text><line x1="562.0" y1="538" x2="562.0" y2="539" stroke="#8a94a3" stroke-width="1"/><path d="M559.0,539 L562.0,544 L565.0,539 z" fill="#8a94a3"/><rect x="456" y="544" width="212" height="44" fill="#ffffff" stroke="#dde7f5" stroke-width="0.8"/><text x="464" y="558" font-size="8.6" fill="#1b2430" font-weight="bold">Top-k 索引</text><text x="464" y="571" font-size="8.0" fill="#33414f">直接沿用最近一次选择</text><line x1="562.0" y1="588" x2="562.0" y2="589" stroke="#8a94a3" stroke-width="1"/><path d="M559.0,589 L562.0,594 L565.0,589 z" fill="#8a94a3"/><rect x="456" y="594" width="212" height="44" fill="#ffffff" stroke="#dde7f5" stroke-width="0.8"/><text x="464" y="608" font-size="8.6" fill="#1b2430" font-weight="bold">代价</text><text x="464" y="621" font-size="8.0" fill="#33414f">连读三层同一套选择，适应性下降</text>
<line x1="12" y1="648" x2="668" y2="648" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="665" font-size="8.4" fill="#33414f">三种模式的共同点：主 Q 与滑窗 KV 一律本层计算，共享的只是远端全局记忆——一份档案，各层各用自己的问题去查。</text>
<text x="12" y="679" font-size="8.4" fill="#33414f">因此全局 KV 的拷贝数从 38 份降到 4 份，而局部细粒度依赖不受影响；解码器每四层插一个 Reindex，让选择重新洗一次。</text>
</svg>