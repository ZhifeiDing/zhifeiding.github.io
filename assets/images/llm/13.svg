<text x="324" y="290" font-size="8.4" fill="#55702f" text-anchor="end">× 40 层</text>
<text x="20" y="304" font-size="8.3" fill="#33414f">1 共享 + 384 路由，每 token 激活 6 个</text>
<text x="20" y="317" font-size="8.3" fill="#33414f">专家中间维 2304，SwiGLU 激活截断于 10</text>
