<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Helvetica, Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#1a1a1a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#6f7377"/></marker></defs><rect width="1000" height="800" fill="#ffffff"/><rect x="96.0" y="596.0" width="250.0" height="44.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="221.0" y="621.1" font-size="13.5" fill="#1a1a1a" text-anchor="middle">段首输入 xˡ</text><path d="M221.0,596.0 L221.0,574.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="96.0" y="512.0" width="250.0" height="62.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="221.0" y="538.3" font-size="13" fill="#1a1a1a" text-anchor="middle">MLA + 稠密 FFN · 单元 1</text><text x="221.0" y="554.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">64 头 · q 1536 / kv 512 · FFN 12288</text><rect x="96.0" y="416.0" width="250.0" height="62.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="221.0" y="442.3" font-size="13" fill="#1a1a1a" text-anchor="middle">MLA + 稠密 FFN · 单元 2</text><text x="221.0" y="458.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">同构，另持一份 576 维 KV</text><path d="M221.0,512.0 L221.0,478.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M221.0,416.0 L221.0,399.5" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="221.0" cy="390.0" r="9.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><path d="M216.1,390.0 L225.9,390.0 M221.0,385.1 L221.0,394.9" stroke="#1a1a1a" stroke-width="1.2"/><rect x="80.0" y="366.0" width="306.0" height="228.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="62.0" y="485.0" font-size="14" fill="#3a3a3a" text-anchor="middle" font-style="italic">28×</text><path d="M221.0,588.0 L372.0,588.0 L372.0,390.0 L230.5,390.0" fill="none" stroke="#1a1a1a" stroke-width="1.25" marker-end="url(#ah)"/><path d="M221.0,380.5 L221.0,356.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="221.0" y="350.0" font-size="11.5" fill="#4a4a4a" text-anchor="middle">段末输出</text><rect x="430.0" y="58.0" width="540.0" height="250.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="79.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">一段之内</text><text x="508.0" y="79.0" font-size="10.2" fill="#8a8f94" text-anchor="start">28 段同构；MoE 每段只算一次</text><rect x="446.0" y="152.0" width="162.7" height="64.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="527.3" y="179.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">单元 1</text><text x="527.3" y="194.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">MLA + 稠密 FFN</text><rect x="618.7" y="152.0" width="162.7" height="64.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="179.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">单元 2</text><text x="700.0" y="194.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">MLA + 稠密 FFN</text><rect x="791.3" y="152.0" width="162.7" height="64.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="872.7" y="179.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">段末相加</text><text x="872.7" y="194.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">两路并回残差</text><path d="M608.7,184.0 L618.7,184.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M781.3,184.0 L791.3,184.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M527.3,152.0 L527.3,116.0 L872.7,116.0 L872.7,152.0" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="700.0" y="109.0" font-size="10" fill="#8a6d1f" text-anchor="middle">MoE 768 选 12：结果暂存，跨过单元 2 后加回</text><text x="446.0" y="236.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">MoE 的 all-to-all 与单元 2 的注意力重叠执行，通信窗口扩至一个完整注意力块。</text><rect x="430.0" y="326.0" width="540.0" height="244.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="347.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">注意力与缓存</text><text x="533.0" y="347.0" font-size="10.2" fill="#8a8f94" text-anchor="start">56 个 MLA 块</text><rect x="446.0" y="414.0" width="119.5" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="505.8" y="442.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">MLA</text><text x="505.8" y="457.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">64 头 · qk 128+64</text><rect x="575.5" y="414.0" width="119.5" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="635.2" y="442.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">稠密 FFN</text><text x="635.2" y="457.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">中间维 12288</text><rect x="705.0" y="414.0" width="119.5" height="66.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="764.8" y="442.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">残差相加</text><text x="764.8" y="457.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">单元内两次</text><rect x="834.5" y="414.0" width="119.5" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="894.2" y="442.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">追加 KV</text><text x="894.2" y="457.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">576 维 / 块·token</text><path d="M565.5,447.0 L575.5,447.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M695.0,447.0 L705.0,447.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M824.5,447.0 L834.5,447.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="502.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">56 个注意力块各存一份 576 维 KV，128K 上下文每 token 约 63 KB、单条约 8.3 GB。</text><text x="80.0" y="672.0" font-size="11" fill="#4a4a4a" text-anchor="start">LongCat-Flash：28 段 × 2 个「MLA + 稠密 FFN」单元 = 56 个注意力块，MoE 只在每段算一次并在段末加回。</text><text x="80.0" y="696.0" font-size="11" fill="#4a4a4a" text-anchor="start">总参 560B，每 token 激活 18.6B–31.3B、均值约 27B（PID 偏置维持）；隐藏维 6144，词表 131,072，上下文 131,072。</text><text x="80.0" y="720.0" font-size="11" fill="#4a4a4a" text-anchor="start">768 个候选 = 512 路由专家 + 256 个 identity 零专家，取 top-12；命中零专家即少算一个真实专家。</text><rect x="96.0" y="767.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="161.5" y="767.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="183.5" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化 / 直通</text><rect x="259.3" y="767.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="281.3" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影与暂存</text><rect x="345.8" y="767.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="367.8" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>