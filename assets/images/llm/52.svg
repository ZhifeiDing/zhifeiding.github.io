<text x="12" y="58" font-size="7.2" fill="#5a6675">1</text>
<text x="332" y="58" font-size="7.2" fill="#5a6675" text-anchor="end">61</text>
<text x="172.0" y="58" font-size="7.2" fill="#5a6675" text-anchor="middle">3 + 58</text>
<text x="12" y="74" font-size="7.6" fill="#33414f">灰：稠密 FFN（中间维 16384），3 层；绿：MoE（128 选 4 + 1 共享），58 层。</text>
<text x="12" y="86" font-size="7.6" fill="#33414f">KV 只存 512 维潜向量加 64 维 RoPE 分量，每层每 token 约 1.2 KB，</text>
<text x="12" y="98" font-size="7.6" fill="#33414f">61 层合计约 70 KB/token，294,912 上下文约 20 GB。</text>
<text x="12" y="120" font-size="8.6" fill="#1b2430" font-weight="bold">放大第 1–4 层</text>
<rect x="12.0" y="126" width="76.25" height="30" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.85"/>
<text x="50.125" y="139" font-size="8.0" fill="#111111" text-anchor="middle">稠密 + MLA</text>
<text x="50.125" y="150" font-size="7.2" fill="#5a6675" text-anchor="middle">稠密 16384</text>
<text x="50.125" y="168" font-size="7.2" fill="#5a6675" text-anchor="middle">层 1</text>
<rect x="93.25" y="126" width="76.25" height="30" fill="#e8f0e2" stroke="#55702f" stroke-width="0.85"/>
<text x="131.375" y="139" font-size="8.0" fill="#111111" text-anchor="middle">MoE + MLA</text>
<text x="131.375" y="150" font-size="7.2" fill="#5a6675" text-anchor="middle">→ MoE</text>
<text x="131.375" y="168" font-size="7.2" fill="#5a6675" text-anchor="middle">层 2</text>
<rect x="174.5" y="126" width="76.25" height="30" fill="#e8f0e2" stroke="#55702f" stroke-width="0.85"/>
<text x="212.625" y="139" font-size="8.0" fill="#111111" text-anchor="middle">MoE + MLA</text>
<text x="212.625" y="150" font-size="7.2" fill="#5a6675" text-anchor="middle">→ MoE</text>
<text x="212.625" y="168" font-size="7.2" fill="#5a6675" text-anchor="middle">层 3</text>
<rect x="255.75" y="126" width="76.25" height="30" fill="#e8f0e2" stroke="#55702f" stroke-width="0.85"/>
<text x="293.875" y="139" font-size="8.0" fill="#111111" text-anchor="middle">MoE + MLA</text>
<text x="293.875" y="150" font-size="7.2" fill="#5a6675" text-anchor="middle">→ MoE</text>
<text x="293.875" y="168" font-size="7.2" fill="#5a6675" text-anchor="middle">层 4</text>
<text x="12" y="180" font-size="7.6" fill="#33414f">注意力逐层同构，只有前馈分两档：这与 V3 的排布一致。</text>
<text x="12" y="192" font-size="7.6" fill="#33414f">MLA 使 KV 与头数解耦，128 个头仍只缓存 576 维。</text>
<text x="348" y="16" font-size="9.8" fill="#1b2430" font-weight="bold">（b）两类块的内部：同一 MLA，两种前馈</text>
<rect x="348" y="26" width="320" height="99" fill="#ffffff" stroke="#446084" stroke-width="1.0"/>
<text x="356" y="40" font-size="9.0" fill="#446084" font-weight="bold">MLA 块（61 层一律）</text>
<text x="660" y="40" font-size="7.4" fill="#5a6675" text-anchor="end">潜注意力，576 维缓存</text>
<text x="356" y="62" font-size="7.8" fill="#33414f">① 输入归一 + Q 低秩</text>
<text x="660" y="62" font-size="7.6" fill="#5a6675" text-anchor="end">7168 → 1536 → 128 × 192</text>
<text x="356" y="75" font-size="7.8" fill="#33414f">② KV 低秩压缩</text>
<text x="660" y="75" font-size="7.6" fill="#5a6675" text-anchor="end">7168 → 576（512 + RoPE 64）</text>
<text x="356" y="88" font-size="7.8" fill="#33414f">③ 上投影</text>
<text x="660" y="88" font-size="7.6" fill="#5a6675" text-anchor="end">k 升至 192 维，v 升至 128 维</text>
<text x="356" y="101" font-size="7.8" fill="#33414f">④ 打分与聚合</text>
<text x="660" y="101" font-size="7.6" fill="#5a6675" text-anchor="end">128 头共用一份潜向量</text>
<text x="356" y="114" font-size="7.8" fill="#33414f">⑤ 输出投影</text>
<text x="660" y="114" font-size="7.6" fill="#5a6675" text-anchor="end">128 × 128 → 7168</text>
<rect x="348" y="133" width="320" height="99" fill="#ffffff" stroke="#55702f" stroke-width="1.0"/>
<text x="356" y="147" font-size="9.0" fill="#55702f" font-weight="bold">MoE 块（58 层）</text>
<text x="660" y="147" font-size="7.4" fill="#5a6675" text-anchor="end">细粒度路由，top-4</text>
<text x="356" y="169" font-size="7.8" fill="#33414f">① 路由</text>
<text x="660" y="169" font-size="7.6" fill="#5a6675" text-anchor="end">sigmoid 打分，全局取 top-4</text>
<text x="356" y="182" font-size="7.8" fill="#33414f">② 专家 FFN</text>
<text x="660" y="182" font-size="7.6" fill="#5a6675" text-anchor="end">128 个专家，中间维 4096，SwiGLU</text>
<text x="356" y="195" font-size="7.8" fill="#33414f">③ 共享专家</text>
<text x="660" y="195" font-size="7.6" fill="#5a6675" text-anchor="end">1 个，与路由专家并列</text>
<text x="356" y="208" font-size="7.8" fill="#33414f">④ 合并</text>
<text x="660" y="208" font-size="7.6" fill="#5a6675" text-anchor="end">y = Σ ŝ_i h_i + E_s(x)</text>
<text x="356" y="221" font-size="7.8" fill="#33414f">⑤ 稠密替代</text>
<text x="660" y="221" font-size="7.6" fill="#5a6675" text-anchor="end">前 3 层为稠密，中间维 16384</text>
<line x1="12" y1="248" x2="668" y2="248" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="264" font-size="9.8" fill="#1b2430" font-weight="bold">（c）官方 params.json：规模、头配置与数值格式</text>
<rect x="12" y="272" width="320" height="94" fill="#ffffff" stroke="#c9cfd8" stroke-width="0.8"/>
<rect x="13" y="276" width="318" height="15" fill="#f1f2f4"/>
<text x="19" y="287" font-size="7.6" fill="#33414f">总参 / 激活</text>
<text x="325" y="287" font-size="7.6" fill="#1b2430" text-anchor="end">675B / 41B</text>
<text x="19" y="302" font-size="7.6" fill="#33414f">主干 / 视觉</text>
<text x="325" y="302" font-size="7.6" fill="#1b2430" text-anchor="end">673B / 2.5B</text>
<rect x="13" y="306" width="318" height="15" fill="#f1f2f4"/>
<text x="19" y="317" font-size="7.6" fill="#33414f">隐藏维 / 层数</text>
<text x="325" y="317" font-size="7.6" fill="#1b2430" text-anchor="end">7168 / 61</text>
<text x="19" y="332" font-size="7.6" fill="#33414f">词表</text>
<text x="325" y="332" font-size="7.6" fill="#1b2430" text-anchor="end">131,072</text>
<rect x="13" y="336" width="318" height="15" fill="#f1f2f4"/>
<text x="19" y="347" font-size="7.6" fill="#33414f">上下文</text>
<text x="325" y="347" font-size="7.6" fill="#1b2430" text-anchor="end">294,912</text>
<text x="19" y="362" font-size="7.6" fill="#33414f">位置编码</text>
<text x="325" y="362" font-size="7.6" fill="#1b2430" text-anchor="end">YaRN ×36，β 0.1</text>
<rect x="348" y="272" width="320" height="94" fill="#ffffff" stroke="#c9cfd8" stroke-width="0.8"/>
<rect x="349" y="276" width="318" height="15" fill="#f1f2f4"/>
<text x="355" y="287" font-size="7.6" fill="#33414f">注意力头数</text>
<text x="661" y="287" font-size="7.6" fill="#1b2430" text-anchor="end">128</text>
<text x="355" y="302" font-size="7.6" fill="#33414f">Q 低秩</text>
<text x="661" y="302" font-size="7.6" fill="#1b2430" text-anchor="end">1536</text>
<rect x="349" y="306" width="318" height="15" fill="#f1f2f4"/>
<text x="355" y="317" font-size="7.6" fill="#33414f">KV 低秩</text>
<text x="661" y="317" font-size="7.6" fill="#1b2430" text-anchor="end">512</text>
<text x="355" y="332" font-size="7.6" fill="#33414f">qk 维</text>
<text x="661" y="332" font-size="7.6" fill="#1b2430" text-anchor="end">128 + RoPE 64</text>
<rect x="349" y="336" width="318" height="15" fill="#f1f2f4"/>
<text x="355" y="347" font-size="7.6" fill="#33414f">v 头维</text>
<text x="661" y="347" font-size="7.6" fill="#1b2430" text-anchor="end">128</text>
<text x="355" y="362" font-size="7.6" fill="#33414f">专家</text>
<text x="661" y="362" font-size="7.6" fill="#1b2430" text-anchor="end">128 选 4 + 1 共享</text>
<text x="12" y="384" font-size="7.6" fill="#33414f">视觉编码器另计：48 层、宽 1664、patch 14、最大输入 1540，经 2 × 2 空间合并接入。</text>
<text x="12" y="396" font-size="7.6" fill="#33414f">FP8 以 128 × 128 分块量化，嵌入、视觉、低秩投影、门控与输出头豁免；另有 NVFP4 与 BF16 两版。</text>
</svg>