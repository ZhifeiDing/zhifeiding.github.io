ke-width="1.3" fill-opacity="1"/><text x="596.4" y="176.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Partial RoPE</text><text x="596.4" y="191.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">qk 256 = 192+64</text><rect x="653.2" y="148.0" width="93.6" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="171.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">索引器</text><text x="700.0" y="185.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">32 头 × 128 · top-20</text><text x="700.0" y="196.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">48</text><rect x="756.8" y="148.0" width="93.6" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="803.6" y="176.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">稀疏 softmax</text><text x="803.6" y="191.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">只在选中 token 归一</text><rect x="860.4" y="148.0" width="93.6" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="907.2" y="176.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">输出门</text><text x="907.2" y="191.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">oW_O ⊙ swish(xW_g)</text><path d="M539.6,181.0 L549.6,181.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M643.2,181.0 L653.2,181.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M746.8,181.0 L756.8,181.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850.4,181.0 L860.4,181.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="236.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">KV 每层每 token 576 维（512 潜向量 + 64 RoPE），BF16 约 1.15 KB。</text><rect x="430.0" y="322.0" width="540.0" height="244.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"