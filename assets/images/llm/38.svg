8 层，前 3 层为稠密 MLP，其余 75 层为 MoE；隐藏维 6144，词表 154,880，上下文 202K。</text><text x="80.0" y="678.0" font-size="11" fill="#4a4a4a" text-anchor="start">总参 744B、每 token 激活 40B；预训练 28.5T token。Muon Split 使 MLA 在同等质量下匹配 GQA-8 的推理成本。</text><rect x="96.0" y="703.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="712.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力与打分</text><rect x="193.0" y="703.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="215.0" y="712.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化</text><rect x="258.5" y="703.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="280.5" y="712.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">线性投影</text><rect x="334.5" y="703.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="356.5" y="712.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>