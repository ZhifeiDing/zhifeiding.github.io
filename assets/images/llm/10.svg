<rect x="394.375" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="407.5" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="420.625" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="433.75" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="446.875" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<text x="470" y="307" font-size="8.2" fill="#33414f">32 条索引器键（128 维，与 CSA 条目一一对应）</text>
<text x="12" y="332" font-size="8.8" fill="#55702f" font-weight="bold">HCA</text>
<rect x="40" y="320" width="420" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/>
<text x="250.0" y="332.5" font-size="8.0" fill="#1b2430" text-anchor="middle">1 条 HCA 条目</text>
<text x="470" y="333" font-size="8.2" fill="#33414f">覆盖整块 128 token</text>
<text x="12" y="362" font-size="8.4" fill="#33414f">块长取两种压缩率的最小公倍数，令 CSA 与 HCA 的分块边界在每一层上重合：一次地址换算即可供所有层复用，</text>
<text x="12" y="376" font-size="8.4" fill="#33414f">这是把 32 : 1 的条目粒度差收进同一套块表的前提；块还需补齐到缓存行的整数倍，供稀疏注意力核直接取用。</text>
<line x1="12" y1="392" x2="668" y2="392" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="410" font-size="10.2" fill="#1b2430" font-weight="bold">（c）两处分配器：为何不并成一套页表</text>
<rect x="12" y="420" width="316" height="88" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9"/>
<text x="20" y="437" font-size="9.0" fill="#1b2430" font-weight="bold">State Cache（固定容量池）</text>
<text x="20" y="452" font-size="8.2" fill="#33414f">每请求一个定长块：滑窗 128 条 + 尚未凑满一个</text>
<text x="20" y="465" font-size="8.2" fill="#33414f">压缩窗口的尾部 KV 与隐状态。</text>
<text x="20" y="478" font-size="8.2" fill="#33414f">只依赖当前位置，按序列状态管理，不按页分配；</text>
<text x="20" y="491" font-size="8.2" fill="#33414f">并发数决定池的大小，与上下文长度无关。</text>
<rect x="348" y="420" width="320" height="88" fill="#dde7f5" stroke="#446084" stroke-width="0.9"/>
<text x="356" y="437" font-size="9.0" fill="#446084" font-weight="bold">压缩 KV Cache（按块分配）</text>
<text x="356" y="452" font-size="8.2" fill="#33414f">每块 128 token，只增不改的追加段。</text>
<text x="356" y="465" font-size="8.2" fill="#33414f">各层条目数不同（CSA 32 条、HCA 1 条），故块表</text>
<text x="356" y="478" font-size="8.2" fill="#33414f">按层维护：同一块号在两类层上换算到不同条目区间。</text>
<text x="356" y="491" font-size="8.2" fill="#33414f">前缀复用只需对齐到最后一个完整压缩块。</text>
<text x="12" y="526" font-size="8.4" fill="#33414f">合并的障碍有二：策略不同（定长状态与追加段），以及稀疏核要求每块固定 B 条条目、对应 B·m 与 B·m′ 个原始 token，</text>
<text x="12" y="540" font-size="8.4" fill="#33414f">两者只有把块长锁在 lcm 上才能共用同一核。落盘同理：压缩条目整体写出，滑窗段则在全量、周期检查点、零缓存三策中选一。</text>
<line x1="12" y1="554" x2="668" y2="554" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="572" font-size="9.0" fill="#1b2430" font-weight="bold">核算</text>
<text x="52" y="572" font-size="8.4" fill="#33414f">Pro：30 层 CSA × 177 B + 31 层 HCA × 4.5 B ≈ 5.3 KB / token，1M 上下文单序列约 5.5 GB；Flash 约 3.7 KB / token，1M 约 3.8 GB。</text>
<text x="52" y="588" font-size="8.4" fill="#33414f">对 V3.2 的 48 KB / token（1M 约 48 GB）约为 11%，与官方所报 10% 同量级；滑窗段另计 61 × 72 KB = 4.4 MB，短上下文与高并发下反成主项。</text>
</svg>