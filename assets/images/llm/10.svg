<rect x="289.375" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="302.5" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="315.625" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="328.75" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
