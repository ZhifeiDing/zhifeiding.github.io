<rect x="446.875" y="268" width="11.925" height="18" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/>
<text x="470" y="281" font-size="8.2" fill="#33414f">32 条 CSA 条目（每 4 token 一条）</text>
<text x="12" y="306" font-size="8.8" fill="#a9742a" font-weight="bold">索引器</text>
<rect x="40.0" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="53.125" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
<rect x="66.25" y="294" width="11.925" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.8"/>
