<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 626" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="680" height="626" fill="#ffffff"/>
<text x="340.0" y="24" font-size="15" fill="#111111" text-anchor="middle">DeepSeek-V4 的三类缓存与块划分</text>
<text x="340.0" y="44" font-size="9.2" fill="#5a6675" text-anchor="middle">State Cache 存未压缩滑窗与压缩尾段，压缩 KV Cache 按 lcm(4, 128) = 128 token 分块，索引器键单列一段</text>
<text x="340.0" y="60" font-size="9.2" fill="#5a6675" text-anchor="middle">一条 512 维条目的记录为 576 B：448 维 FP8 加 64 维 BF16 的 RoPE 分量</text>
<line x1="12" y1="72" x2="668" y2="72" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="90" font-size="10.2" fill="#1b2430" font-weight="bold">（a）每层四类记录的字节构成</text>
<text x="12" y="113" font-size="8.8" fill="#1b2430" font-weight="bold">SWA KV</text>
<rect x="108" y="100" width="300" height="18" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="258.0" y="112.5" font-size="8.0" fill="#5a6675" text-anchor="middle">定长段，不按每 token 折算</text>
<text x="420" y="112.5" font-size="8.2" fill="#33414f">环形覆盖，容量与序列长度无关</text>
<text x="12" y="139" font-size="8.8" fill="#1b2430" font-weight="bold">CSA 主 KV</text>
<rect x="108" y="126" width="300" height="18" fill="#ffffff" stroke="#c9cfd8" stroke-width="0.7"/>
<rect x="108" y="126" width="300.0" height="18" fill="#dde7f5" stroke="#446084" stroke-width="0.9"/>
<text x="402.0" y="138.5" font-size="7.8" fill="#1b2430" text-anchor="end">每 4 token 1 条 × 576 B</text>
<text x="420" y="138.5" font-size="8.2" fill="#33414f">≈ 144 B / token</text>
<text x="12" y="165" font-size="8.8" fill="#1b2430" font-weight="bold">CSA 索引器 KV</text>
<rect x="108" y="152" width="300" height="18" fill="#ffffff" stroke="#c9cfd8" stroke-width="0.7"/>
<rect x="108" y="152" width="68.75" height="18" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="420" y="164.5" font-size="8.2" fill="#33414f">128 B 键 + 4 B 缩放 ≈ 33 B / token</text>
<text x="12" y="191" font-size="8.8" fill="#1b2430" font-weight="bold">HCA KV</text>
<rect x="108" y="178" width="300" height="18" fill="#ffffff" stroke="#c9cfd8" stroke-width="0.7"/>
<rect x="108" y="178" width="9.375" height="18" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/>
<text x="420" y="190.5" font-size="8.2" fill="#33414f">≈ 4.5 B / token</text>
<text x="12" y="210" font-size="8.2" fill="#5a6675">记录构成：</text>
<text x="72" y="210" font-size="8.2" fill="#5a6675">64 维 RoPE 以 BF16 存（128 B），其余 448 维以 FP8 存（448 B）；索引器键 128 维 FP8 加一个逐 token 的 FP32 缩放。</text>
<line x1="12" y1="236" x2="668" y2="236" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="254" font-size="10.2" fill="#1b2430" font-weight="bold">（b）一个 cache block 的划分：128 个原始 token</text>
<text x="12" y="280" font-size="8.8" fill="#446084" font-weight="bold">CSA</text>
