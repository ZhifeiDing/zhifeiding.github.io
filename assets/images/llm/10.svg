<rect x="381.25" y="268" width="11.925" height="18" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/>
<rect x="394.375" y="268" width="11.925" height="18" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/>
<rect x="407.5" y="268" width="11.925" height="18" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/>
