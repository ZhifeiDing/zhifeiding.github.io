<g transform="translate(0,98.0)"><text x="386.0" y="66.5" font-size="7.6" fill="#111111" text-anchor="middle">MLA+DSA</text></g>
<g transform="translate(0,98.0)"><text x="386.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 1</text></g>
<g transform="translate(0,98.0)"><rect x="428.0" y="50.0" width="76.0" height="26" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="466.0" y="66.5" font-size="7.6" fill="#111111" text-anchor="middle">MLA+DSA</text></g>
<g transform="translate(0,98.0)"><text x="466.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 2</text></g>
<g transform="translate(0,98.0)"><rect x="508.0" y="50.0" width="76.0" height="26" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="546.0" y="66.5" font-size="7.6" fill="#111111" text-anchor="middle">MLA+DSA</text></g>
<g transform="translate(0,98.0)"><text x="546.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 3</text></g>
<g transform="translate(0,98.0)"><rect x="588.0" y="50.0" width="76.0" height="26" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="626.0" y="66.5" font-size="7.6" fill="#111111" text-anchor="middle">MLA+DSA</text></g>
<g transform="translate(0,98.0)"><text x="626.0" y="88.0" font-size="7.3" fill="#5a6675" text-anchor="middle">层 4</text></g>
<g transform="translate(0,98.0)"><text x="348" y="104.0" font-size="7.7" fill="#33414f">与 355B 前代相比，容量增长主要由专家数承担，激活参数只增 8B。</text></g>
<g transform="translate(0,98.0)"><text x="348" y="116.0" font-size="7.7" fill="#33414f">DSA 把索引器开销带进原本没有这一部件的注意力栈，需独立 kernel 与缓冲。</text></g>
<g transform="translate(0,98.0)"><rect x="348" y="124.0" width="12" height="8" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="364" y="132.0" font-size="7.4" fill="#33414f">MLA + DSA：约 80 层</text></g>
<g transform="translate(0,98.0)"><rect x="508" y="124.0" width="12" height="8" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="524" y="132.0" font-size="7.4" fill="#33414f">MoE：逐层其后</text></g>
<line x1="12" y1="316.0" x2="668" y2="316.0" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12.0" y="334.0" font-size="9.6" fill="#1b2430" font-weight="bold">（c）MLA + DSA 链</text>
<text x="337.0" y="334.0" font-size="7.6" fill="#5a6675" text-anchor="end">索引器 + 稀疏聚合</text>
<rect x="12.0" y="342.0" width="325.0" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="354.0" font-size="8.0" fill="#446084" font-weight="bold">① Q / KV 低秩</text>
<text x="19.0" y="365.0" font-size="7.2" fill="#33414f">c_q = x W_DQ；c_kv = x W_DKV</text>
<text x="19.0" y="376.5" font-size="7.2" fill="#33414f">秩未披露</text>
<rect x="12.0" y="385.0" width="325.0" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="397.0" font-size="8.0" fill="#446084" font-weight="bold">② 上投影</text>
<text x="19.0" y="408.0" font-size="7.2" fill="#33414f">q = c_q W_UQ；k = [c_kv W_UK ; RoPE]</text>
<text x="19.0" y="419.5" font-size="7.2" fill="#33414f">多头，头维未披露</text>
<rect x="12.0" y="428.0" width="325.0" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="440.0" font-size="8.0" fill="#446084" font-weight="bold">③ 索引打分</text>
<text x="19.0" y="451.0" font-size="7.2" fill="#33414f">s_j = Σ_h w_h ReLU(q_I · k_I,j)</text>
<text x="19.0" y="462.5" font-size="7.2" fill="#33414f">轻量索引器</text>
<rect x="12.0" y="471.0" width="325.0" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="483.0" font-size="8.0" fill="#446084" font-weight="bold">④ Top-k 与聚合</text>
<text x="19.0" y="494.0" font-size="7.2" fill="#33414f">I = argtop_k(s)；o = softmax(q k_Iᵀ) v_I</text>
<text x="19.0" y="505.5" font-size="7.2" fill="#33414f">只读选中条目</text>
<rect x="12.0" y="514.0" width="325.0" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="526.0" font-size="8.0" fill="#446084" font-weight="bold">⑤ 输出投影</text>
<text x="19.0" y="537.0" font-size="7.2" fill="#33414f">y = o W_O；x ← x + y</text>
<text x="19.0" y="548.5" font-size="7.2" fill="#33414f">回隐藏维</text>
<text x="343.0" y="334.0" font-size="9.6" fill="#1b2430" font-weight="bold">（d）MoE 前馈</text>
<text x="668.0" y="334.0" font-size="7.6" fill="#5a6675" text-anchor="end">约 256 选 8</text>
<rect x="343.0" y="342.0" width="325.0" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="350.0" y="354.0" font-size="8.0" fill="#55702f" font-weight="bold">① 路由打分</text>
<text x="350.0" y="365.0" font-size="7.2" fill="#33414f">s_i = σ(x e_iᵀ)</text>
<text x="350.0" y="376.5" font-size="7.2" fill="#33414f">专家数约 256</text>
<rect x="343.0" y="385.0" width="325.0" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="350.0" y="397.0" font-size="8.0" fill="#55702f" font-weight="bold">② Top-k</text>
<text x="350.0" y="408.0" font-size="7.2" fill="#33414f">I = top8(s)</text>
<text x="350.0" y="419.5" font-size="7.2" fill="#33414f">激活 40B</text>
<rect x="343.0" y="428.0" width="325.0" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="350.0" y="440.0" font-size="8.0" fill="#55702f" font-weight="bold">③ 专家 FFN</text>
<text x="350.0" y="451.0" font-size="7.2" fill="#33414f">h_i = SwiGLU(x ; W_i)</text>
<text x="350.0" y="462.5" font-size="7.2" fill="#33414f">中间维未披露</text>
<rect x="343.0" y="471.0" width="325.0" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="350.0" y="483.0" font-size="8.0" fill="#55702f" font-weight="bold">④ 合并</text>
<text x="350.0" y="494.0" font-size="7.2" fill="#33414f">y = Σ ŝ_i h_i</text>
<text x="350.0" y="505.5" font-size="7.2" fill="#33414f">一次 all-to-all</text>
<rect x="343.0" y="514.0" width="325.0" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="350.0" y="526.0" font-size="8.0" fill="#55702f" font-weight="bold">⑤ 训练侧</text>
<text x="350.0" y="537.0" font-size="7.2" fill="#33414f">Muon Split 使 MLA 达 GQA-8 水平</text>
<text x="350.0" y="548.5" font-size="7.2" fill="#33414f">结构—优化器耦合加深</text>
<line x1="12" y1="563.0" x2="668" y2="563.0" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12" y="577.0" font-size="9.8" fill="#1b2430" font-weight="bold">核算：缓存、算力与权重</text>
<rect x="12.0" y="585.0" width="159.5" height="52" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.8"/>
<text x="19.0" y="599.0" font-size="8.2" fill="#1b2430" font-weight="bold">规模</text>
<text x="19.0" y="612.0" font-size="7.0" fill="#33414f">744B 总参 / 40B 激活</text>
<text x="19.0" y="624.0" font-size="7.0" fill="#5a6675">较前代 +389B，激活 +8B</text>
<rect x="177.5" y="585.0" width="159.5" height="52" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.8"/>
<text x="184.5" y="599.0" font-size="8.2" fill="#1b2430" font-weight="bold">上下文</text>
<text x="184.5" y="612.0" font-size="7.0" fill="#33414f">202K</text>
<text x="184.5" y="624.0" font-size="7.0" fill="#5a6675">未作 1M 扩展</text>
<rect x="343.0" y="585.0" width="159.5" height="52" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.8"/>
<text x="350.0" y="599.0" font-size="8.2" fill="#1b2430" font-weight="bold">索引器</text>
<text x="350.0" y="612.0" font-size="7.0" fill="#33414f">逐层一次</text>
<text x="350.0" y="624.0" font-size="7.0" fill="#5a6675">新增一段独立开销</text>
<rect x="508.5" y="585.0" width="159.5" height="52" fill="#f1f2f4" stroke="#8b8f99" stroke-width="0.8"/>
<text x="515.5" y="599.0" font-size="8.2" fill="#1b2430" font-weight="bold">权重体积</text>
<text x="515.5" y="612.0" font-size="7.0" fill="#33414f">744B × 1 B（FP8）</text>
<text x="515.5" y="624.0" font-size="7.0" fill="#5a6675">≈ 744 GB</text>
</svg>