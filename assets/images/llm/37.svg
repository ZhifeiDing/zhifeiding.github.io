<svg xmlns="http://www.w3.org/2000/svg" width="680" height="649" viewBox="0 0 680 649" font-family="Georgia, 'Times New Roman', serif">
<text x="340.0" y="24" font-size="14.5" fill="#111111" text-anchor="middle">GLM-5 的层组合与算子序列</text>
<text x="340.0" y="43" font-size="8.9" fill="#5a6675" text-anchor="middle">744B 总参 / 40B 激活，约 80 层、256 个路由专家；注意力直接采纳 MLA + DSA 稀疏路线</text>
<text x="340.0" y="58" font-size="8.9" fill="#5a6675" text-anchor="middle">层数与专家拓扑官方只给约数，图中以符号记；可核实项为 DSA 索引器、MoE 规模与 202K 上下文</text>
