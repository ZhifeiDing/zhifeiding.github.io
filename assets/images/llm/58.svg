size="10.4" fill="#1a1a1a" text-anchor="middle">Pooler H → h</text><text x="596.4" y="193.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">降维到专家宽度</text><rect x="653.2" y="150.0" width="93.6" height="66.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="178.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">专家 SwiGLU</text><text x="700.0" y="193.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">逐专家 RMSNorm</text><rect x="756.8" y="150.0" width="93.6" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="803.6" y="178.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Unpooler h → H</text><text x="803.6" y="193.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">回到模型宽度</text><rect x="860.4" y="150.0" width="93.6" height="66.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="907.2" y="178.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">加权求和</text><text x="907.2" y="193.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">Σ ŝᵢ·yᵢ</text><path d="M539.6,183.0 L549.6,183.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M643.2,183.0 L653.2,183.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M746.8,183.0 L756.8,183.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850.4,183.0 L860.4,183.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="238.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">每个专家输出先归一再加权；H 为模型宽度、h 为专家宽度。</text><rect x="430.0" y="330.0" width="540.0" height="240.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="351.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">三路编码</text><text x="508.0" y="351.0" font-size="10.2" fill="#8a8f94" text-anchor="start">统一进入同一解码器</text><rect x="446.0" y="416.0" width="119.5" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="505.8" y="444.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">文本嵌入</text><text x="505.8" y="459.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">词表 → 宽度 H</text><rect x="575.5" y="416.0" width="119.5" height="66.0" rx="9" fill="#fce6e6" stroke="#b85450" stroke-width="1.3" fill-opacity="1"/><text x="635.2" y="444.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">视觉特征</text><text x="635.2" y="459.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">NaViT 切片编码</text><rect x="705.0" y="416.0" width="119.5" height="66.0" rx="9" fill="#fce6e6" stroke="#b85450" stroke-width="1.3" fill-opacity="1"/><text x="764.8" y="444.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">音频特征</text><text x="764.8" y="459.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">音频编码器</text><rect x="834.5" y="416.0" width="119.5" height="66.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="894.2" y="444.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">按位置拼接</text><text x="894.2" y="459.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">共享输入序列</text><path d="M565.5,449.0 L575.5,449.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M695.0,449.0 L705.0,449.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M824.5,449.0 L834.5,449.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="504.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">三路特征在各自 token 位置插入，解码器不区分模态。</text><text x="80.0" y="672.0" font-size="11" fill="#4a4a4a" text-anchor="start">Muse Spark Open：文本、图像 / 视频、音频各有编码通路，统一进入 62 层 MoE 语言主干。</text><text x="80.0" y="696.0" font-size="11" fill="#4a4a4a" text-anchor="start">注意力按层在滑窗与全局之间交替；MoE 以池化降低专家宽度，再升回模型宽度，token 数不变。</text><text x="80.0" y="720.0" font-size="11" fill="#4a4a4a" text-anchor="start">池化 / 反池化是本架构与常规 MoE 的唯一结构差别，其余为标准的 pre-norm 残差排布。</text><rect x="96.0" y="747.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力 / 路由</text><rect x="193.8" y="747.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="215.8" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化</text><rect x="259.3" y="747.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="281.3" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">嵌入</text><rect x="314.3" y="747.0" width="16.0" height="12.0" rx="3" fill="#fce6e6" stroke="#b85450" stroke-width="1.0" fill-opacity="1"/><text x="336.3" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">编码器</text><rect x="379.8" y="747.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="401.8" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>