 y="501.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">共享输入序列</text><path d="M565.5,491.0 L575.5,491.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M695.0,491.0 L705.0,491.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M824.5,491.0 L834.5,491.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="546.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">三路特征在各自 token 位置插入，解码器不区分模态。</text><text x="80.0" y="672.0" font-size="11" fill="#4a4a4a" text-anchor="start">Muse Spark Open：文本、图像 / 视频、音频各有编码通路，统一进入 62 层 MoE 语言主干。</text><text x="80.0" y="696.0" font-size="11" fill="#4a4a4a" text-anchor="start">注意力按层在滑窗与全局之间交替；MoE 以池化降低专家宽度，再升回模型宽度，token 数不变。</text><text x="80.0" y="720.0" font-size="11" fill="#4a4a4a" text-anchor="start">池化 / 反池化是本架构与常规 MoE 的唯一结构差别，其余为标准的 pre-norm 残差排布。</text><rect x="96.0" y="747.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力 / 路由</text><rect x="193.8" y="747.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="215.8" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化</text><rect x="259.3" y="747.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="281.3" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">嵌入</text><rect x="314.3" y="747.0" width="16.0" height="12.0" rx="3" fill="#fce6e6" stroke="#b85450" stroke-width="1.0" fill-opacity="1"/><text x="336.3" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">编码器</text><rect x="379.8" y="747.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="401.8" y="756.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg