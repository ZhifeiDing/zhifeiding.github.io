134.0,546.0 L134.0,524.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M234.0,592.0 L234.0,576.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M234.0,546.0 L234.0,524.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M334.0,592.0 L334.0,576.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M334.0,546.0 L334.0,524.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="90.0" y="482.0" width="288.0" height="42.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="234.0" y="505.3" font-size="11" fill="#1a1a1a" text-anchor="middle">投影到模型宽度 + 按位置拼接</text><path d="M234.0,482.0 L234.0,460.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="90.0" y="426.0" width="288.0" height="34.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="234.0" y="445.9" font-size="13" fill="#1a1a1a" text-anchor="middle">Pre-norm</text><rect x="90.0" y="354.0" width="288.0" height="56.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="234.0" y="377.3" font-size="13" fill="#1a1a1a" text-anchor="middle">GQA（滑窗 / 全局）</text><text x="234.0" y="393.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">两种注意力按层交替</text><rect x="90.0" y="304.0" width="288.0" height="34.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="234.0" y="323.9" font-size="13" fill="#1a1a1a" text-anchor="middle">Post-norm + 残差</text><rect x="90.0" y="232.0" width="288.0" height="56.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="234.0" y="255.3" font-size="13" fill="#1a1a1a" text-anchor="middle">MoE 前馈</text><text x="234.0" y="271.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">pooler · 路由专家 · unpooler</text><path d="M234.0,426.0 L234.0,410.0" fill="n