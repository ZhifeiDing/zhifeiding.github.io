<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Helvetica, Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#1a1a1a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#6f7377"/></marker></defs><rect width="1000" height="800" fill="#ffffff"/><rect x="96.0" y="602.0" width="216.0" height="38.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="615.8" font-size="11.5" fill="#1a1a1a" text-anchor="middle">BBPE 分词</text><text x="204.0" y="632.3" font-size="10.5" fill="#4a4a4a" text-anchor="middle">词表 157,184 · 字节级</text><path d="M204.0,602.0 L204.0,582.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="96.0" y="550.0" width="216.0" height="42.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="565.9" font-size="11.8" fill="#1a1a1a" text-anchor="middle">词嵌入</text><text x="204.0" y="582.4" font-size="10.5" fill="#4a4a4a" text-anchor="middle">E ∈ R^{157184×4096}</text><path d="M204.0,550.0 L204.0,526.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="96.0" y="454.0" width="216.0" height="62.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="480.3" font-size="13" fill="#1a1a1a" text-anchor="middle">第 0 层：稠密块</text><text x="204.0" y="496.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">GQA + QK-Norm + Partial-RoPE</text><rect x="96.0" y="374.0" width="216.0" height="62.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="400.3" font-size="13" fill="#1a1a1a" text-anchor="middle">第 1–31 层：MoE 块</text><text x="204.0" y="416.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">256 选 8 + 1 共享 · 中间维 1024</text><rect x="96.0" y="316.0" width="216.0" height="40.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="331.3" font-size="13" fill="#1a1a1a" text-anchor="middle">MTP（深度 1）</text><text x="204.0" y="347.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">共享嵌入与输出头</text><path d="M204.0,454.0 L204.0,436.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M204.0,374.0 L204.0,356.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M204.0,316.0 L204.0,299.5" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="204.0" cy="290.0" r="9.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><path d="M199.1,290.0 L208.9,290.0 M204.0,285.1 L204.0,294.9" stroke="#1a1a1a" stroke-width="1.2"/><rect x="80.0" y="266.0" width="272.0" height="270.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="62.0" y="406.0" font-size="14" fill="#3a3a3a" text-anchor="middle" font-style="italic">32×</text><path d="M204.0,530.0 L338.0,530.0 L338.0,290.0 L213.5,290.0" fill="none" stroke="#1a1a1a" stroke-width="1.25" marker-end="url(#ah)"/><path d="M204.0,280.5 L204.0,256.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="204.0" y="250.0" font-size="11.5" fill="#4a4a4a" text-anchor="middle">输出头</text><rect x="430.0" y="58.0" width="540.0" height="244.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="79.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">单层内部</text><text x="508.0" y="79.0" font-size="10.2" fill="#8a8f94" text-anchor="start">算子级见图 13-2</text><rect x="446.0" y="146.0" width="119.5" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="505.8" y="174.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">注意力</text><text x="505.8" y="189.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">32 Q / 4 KV × 128</text><rect x="575.5" y="146.0" width="119.5" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="635.2" y="174.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">位置编码</text><text x="635.2" y="189.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">Partial-RoPE 64 维</text><rect x="705.0" y="146.0" width="119.5" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="764.8" y="174.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">路由</text><text x="764.8" y="189.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">σ + 偏置，8 组取 4</text><rect x="834.5" y="146.0" width="119.5" height="66.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="894.2" y="174.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">专家聚合</text><text x="894.2" y="189.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">2.5 · Σ ŝᵢ + 共享</text><path d="M565.5,179.0 L575.5,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M695.0,179.0 L705.0,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M824.5,179.0 L834.5,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="234.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">激活率 3.1%：每 token 取 8 个路由专家加 1 个共享专家。</text><rect x="430.0" y="316.0" width="540.0" height="250.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="337.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">三个规模</text><text x="508.0" y="337.0" font-size="10.2" fill="#8a8f94" text-anchor="start">同一套骨架</text><rect x="446.0" y="402.0" width="162.7" height="76.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="527.3" y="430.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Ling-mini-2.0</text><text x="527.3" y="444.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">20 层 · 16 头 · 2048</text><text x="527.3" y="455.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">16B / 1.4B</text><rect x="618.7" y="402.0" width="162.7" height="76.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="430.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Ling-flash-2.0</text><text x="700.0" y="444.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">32 层 · 32 头 · 4096</text><text x="700.0" y="455.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">103B / 6.1B</text><rect x="791.3" y="402.0" width="162.7" height="76.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="872.7" y="430.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Ling-1T</text><text x="872.7" y="444.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">80 层 · 64 头 · 8192</text><text x="872.7" y="455.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">1T / 51B</text><path d="M608.7,440.0 L618.7,440.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M781.3,440.0 L791.3,440.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="500.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">三档只改层数、头数与专家数，注意力与路由的写法不变。</text><text x="80.0" y="672.0" font-size="11" fill="#4a4a4a" text-anchor="start">Ling 2.0 以 Ling-flash-2.0 为例：32 层（1 层稠密 + 31 层 MoE），隐藏维 4096，32 查询头 / 4 键值头 × 128，词表 157,184。</text><text x="80.0" y="696.0" font-size="11" fill="#4a4a4a" text-anchor="start">256 路由专家取 top-8 加 1 个共享专家，专家中间维 1024；稠密层 FFN 中间维 9216，是唯一不参与路由的前馈。</text><text x="80.0" y="720.0" font-size="11" fill="#4a4a4a" text-anchor="start">原生上下文 32K，YaRN 扩至 128K；MTP 深度 1，训练期辅助损失权重 0.1，推理时供投机解码。</text><rect x="96.0" y="767.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="161.5" y="767.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="183.5" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化 / 位置</text><rect x="259.3" y="767.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="281.3" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">嵌入 / 路由</text><rect x="346.7" y="767.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="368.7" y="776.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>