="508.0" y="627.0" font-size="10.2" fill="#8a8f94" text-anchor="start">同一套骨架</text><rect x="446.0" y="682.0" width="162.7" height="76.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="527.3" y="710.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Ling-mini-2.0</text><text x="527.3" y="724.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">20 层 · 16 头 · 2048</text><text x="527.3" y="735.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">16B / 1.4B</text><rect x="618.7" y="682.0" width="162.7" height="76.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="710.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Ling-flash-2.0</text><text x="700.0" y="724.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">32 层 · 32 头 · 4096</text><text x="700.0" y="735.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">103B / 6.1B</text><rect x="791.3" y="682.0" width="162.7" height="76.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="872.7" y="710.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Ling-1T</text><text x="872.7" y="724.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">80 层 · 64 头 · 8192</text><text x="872.7" y="735.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">1T / 51B</text><path d="M608.7,720.0 L618.7,720.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M781.3,720.0 L791.3,720.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="780.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">三档只改层数、头数与专家数，注意力与路由的写法不变。</text><text x="80.0" y="852.0" font-size="11" fill="#4a4a4a" text-anchor="start">Ling 2.0 以 Ling-flash-2.0 为例：32 层（1 层稠密 + 31 层 MoE），隐藏维 4096，32 查询头 / 4 键值头 × 128，词表 157,184。</text><text x="80.0" y="876.0" font-size="11" fill="#4a4a4a" text-anchor="start">256 路由专家取 top-8 加 1 个共享专家，专家中间维 1024；稠密层 FFN 中间维 9216，是唯一不参与路由的前馈。</text><text x="80.0" y="900.0" font-size="11" fill="#4a4a4a" text-anchor="start">原生上下文 32K，YaRN 扩至 128K；MTP 深度 1，训练期辅助损失权重 0.1，推理时供投机解码。</text><rect x="96.0" y="903.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="912.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="161.5" y="903.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="183.5" y="912.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化 / 位置</text><rect x="259.3" y="903.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="281.3" y="912.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">嵌入 / 路由</text><rect x="346.7" y="903.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="368.7" y="912.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>