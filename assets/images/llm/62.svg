<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/></marker></defs>
<rect width="940" height="700" fill="#ffffff"/>
<text x="24" y="34" font-size="16" fill="#16202c" text-anchor="start" font-weight="700">Ling 2.6 结构示意：7 比 1 的混合线性注意力</text>
<text x="24" y="56" font-size="10.8" fill="#4d5866" text-anchor="start">1025.41B 总参 / 激活约 51B · 80 层（4 稠密）· 70 层 Lightning + 10 层 MLA · 256 选 8 + 1 共享 · 上下文 262,144</text>
<line x1="24" y1="70" x2="916" y2="70" stroke="#dfe4ea"/>

<text x="24" y="96" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">80 层的层型排布（每 8 层 7 层线性、1 层 MLA）</text>

<rect x="24" y="112" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="118.5" y="112" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="140" y="112" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="234.5" y="112" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="256" y="112" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="350.5" y="112" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="372" y="112" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="466.5" y="112" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="488" y="112" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="582.5" y="112" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<text x="24" y="160" font-size="8.8" fill="#7c8794" text-anchor="start">第 1–8 层</text>
<text x="140" y="160" font-size="8.8" fill="#7c8794" text-anchor="start">第 9–16 层</text>
<text x="256" y="160" font-size="8.8" fill="#7c8794" text-anchor="start">第 17–24 层</text>
<text x="372" y="160" font-size="8.8" fill="#7c8794" text-anchor="start">第 25–32 层</text>
<text x="488" y="160" font-size="8.8" fill="#7c8794" text-anchor="start">第 33–40 层</text>

<rect x="24" y="172" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="118.5" y="172" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="140" y="172" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="234.5" y="172" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="256" y="172" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="350.5" y="172" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="372" y="172" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="466.5" y="172" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<rect x="488" y="172" width="108" height="30" rx="4" fill="#dce8f6" stroke="#3f6fa8" stroke-width="1"/>
<rect x="582.5" y="172" width="13.5" height="30" rx="3" fill="#f0c86a" stroke="#c2a03c" stroke-width="1"/>
<text x="24" y="220" font-size="8.8" fill="#7c8794" text-anchor="start">第 41–48 层</text>
<text x="140" y="220" font-size="8.8" fill="#7c8794" text-anchor="start">第 49–56 层</text>
<text x="256" y="220" font-size="8.8" fill="#7c8794" text-anchor="start">第 57–64 层</text>
<text x="372" y="220" font-size="8.8" fill="#7c8794" text-anchor="start">第 65–72 层</text>
<text x="488" y="220" font-size="8.8" fill="#7c8794" text-anchor="start">第 73–80 层</text>

<rect x="24" y="234" width="12" height="12" rx="2" fill="#dce8f6" stroke="#3f6fa8"/>
<text x="42" y="244" font-size="9.2" fill="#3d4a56" text-anchor="start">Lightning Attention ×70（定长状态，不存 KV）</text>
<rect x="330" y="234" width="12" height="12" rx="2" fill="#f0c86a" stroke="#c2a03c"/>
<text x="348" y="244" font-size="9.2" fill="#3d4a56" text-anchor="start">MLA ×10（低秩潜向量，存 KV）</text>

<rect x="24" y="258" width="586" height="44" rx="6" fill="#fbfcfe" stroke="#b9c4d2" stroke-width="1" stroke-dasharray="4 3"/>
<text x="38" y="276" font-size="9.2" fill="#3d4a56" text-anchor="start">7 比 1 由缩放律确定，报告在 1:1、3:1、7:1、15:1 四组配比中比较，7:1 在建模质量与推理成本之间取较优点。</text>
<text x="38" y="294" font-size="9.2" fill="#3d4a56" text-anchor="start">前 4 层为稠密 MLP（中间维 18,432），不参与专家路由；末端另接 1 层 MTP。</text>

<text x="24" y="338" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">同一系列两代的 KV 总量（横轴按 GB 等比）</text>
<line x1="180" y1="352" x2="180" y2="436" stroke="#dfe4ea"/>

<text x="38" y="370" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="700">Ling-2.0-1T</text>
<text x="38" y="386" font-size="8.6" fill="#7c8794" text-anchor="start">128K · 320 KB/token</text>
<rect x="180" y="358" width="360" height="22" rx="3" fill="#9fb4cb"/>
<text x="548" y="374" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="700">约 42 GB</text>

<text x="38" y="416" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="700">Ling-2.6-1T</text>
<text x="38" y="432" font-size="8.6" fill="#7c8794" text-anchor="start">256K · 40 KB/token</text>
<rect x="180" y="404" width="90" height="22" rx="3" fill="#f0c86a"/>
<text x="278" y="420" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="700">约 10.5 GB</text>

<text x="24" y="462" font-size="9" fill="#4d5866" text-anchor="start">上下文长度由 128K 增至 256K，缓存总量却降到四分之一，线性层占七分之八，只维护定长状态，不产生 KV。</text>
<text x="24" y="480" font-size="9" fill="#4d5866" text-anchor="start">代价转移到串行侧与状态驻留，70 层状态需常驻，解码链长随层数增长。</text>

<rect x="624" y="86" width="292" height="216" rx="7" fill="#fbfcfe" stroke="#b9c4d2" stroke-width="1.2"/>
<text x="638" y="108" font-size="11.4" fill="#3f6fa8" text-anchor="start" font-weight="700">Linear 块（70 层）</text>
<text x="638" y="128" font-size="9.2" fill="#3d4a56" text-anchor="start">q、k、v 三路投影，各 64 头 × 128 维</text>
<text x="638" y="148" font-size="9.2" fill="#3d4a56" text-anchor="start">因果衰减累积：S_t = λ ⊙ S_t−1 + k_t v_tᵀ</text>
<text x="638" y="168" font-size="9.2" fill="#3d4a56" text-anchor="start">读出：o_t = q_t · S_t，再作输出门控</text>
<text x="638" y="188" font-size="9.2" fill="#3d4a56" text-anchor="start">状态 128 × 128 / 头，FP32 约 4 MB / 层</text>
<text x="638" y="208" font-size="9.2" fill="#3d4a56" text-anchor="start">状态与序列长度无关，缓存不随上下文增长</text>
<text x="638" y="232" font-size="9.2" fill="#7c8794" text-anchor="start">预填走分块累积，解码走逐 token 递推，</text>
<text x="638" y="250" font-size="9.2" fill="#7c8794" text-anchor="start">两形态共用同一递推式。</text>

<rect x="624" y="312" width="292" height="196" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="638" y="334" font-size="11.4" fill="#8a6d1f" text-anchor="start" font-weight="700">MLA 块（10 层）</text>
<text x="638" y="354" font-size="9.2" fill="#3d4a56" text-anchor="start">沿用 2.0-1T 的配置：64 查询头、8 键值头</text>
<text x="638" y="372" font-size="9.2" fill="#3d4a56" text-anchor="start">头维 128，q / kv 低秩投影</text>
<text x="638" y="392" font-size="9.2" fill="#3d4a56" text-anchor="start">位置：Partial-RoPE，仅头维前 64 维，θ 6×10⁵</text>
<text x="638" y="412" font-size="9.2" fill="#9b4a56" text-anchor="start" font-weight="700">QK-Norm 在迁移中被移除</text>
<text x="638" y="430" font-size="9.2" fill="#3d4a56" text-anchor="start">每 token 每层 4 KB，10 层合计 40 KB</text>
<text x="638" y="450" font-size="9.2" fill="#7c8794" text-anchor="start">全模型只有这 10 层产生 KV Cache，</text>
<text x="638" y="468" font-size="9.2" fill="#7c8794" text-anchor="start">其余 70 层只维护定长状态。</text>
<text x="638" y="492" font-size="9.2" fill="#7c8794" text-anchor="start">专家段沿用 2.0，256 选 8 + 1 共享，中间维 2048。</text>

<line x1="24" y1="522" x2="916" y2="522" stroke="#dfe4ea"/>
<text x="24" y="544" font-size="11.4" fill="#2f6b47" text-anchor="start" font-weight="700">三组约束下的账（与 13.1 节的 1T 规格对照）</text>
<text x="24" y="566" font-size="10" fill="#243447" text-anchor="start">缓存：MLA 层 40 KB/token，256K 上下文约 10.5 GB；2.0-1T 的同一项为 80 层 × 4 KB = 320 KB/token，128K 已需约 42 GB。长度翻倍而缓存降为四分之一。</text>
<text x="24" y="588" font-size="10" fill="#243447" text-anchor="start">状态：70 层线性层各 4 MB，合计约 293 MB，与长度无关；容量规划由「按长度乘」改为「按序列数乘」。</text>
<text x="24" y="610" font-size="10" fill="#243447" text-anchor="start">权重：1025.41B 参数、约 1.04 TB，按一字节每元素计，部署需张量并行度不低于 8；flash 规格 104B / 7.4B，4 卡 H20 上 340 token/s。</text>
<text x="24" y="632" font-size="10" fill="#243447" text-anchor="start">串行：70 层线性层串成递推链，解码延迟不随张量并行加宽而下降，只能靠块内并行与跨设备切层分摊。</text>
<text x="24" y="662" font-size="9.6" fill="#7c8794" text-anchor="start">图源：文献 [41][42]。层型按 7 比 1 与 80 层基座计；flash 规格的层数与头配置未单列，表中记「—」。</text>
</svg>
