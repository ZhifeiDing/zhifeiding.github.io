><path d="M641.2,173.0 L799.8,173.0 L788.8,209.0 L630.2,209.0 Z" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3"/><text x="715.0" y="187.8" font-size="10.4" fill="#1a1a1a" text-anchor="middle" font-weight="600">输出投影</text><text x="715.0" y="200.3" font-size="8.5" fill="#4a4a4a" text-anchor="middle">4 KB / token·层</text><text x="526.0" y="380.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">每 token 每层 4 KB，10 层合计 40 KB。</text><text x="80.0" y="404.0" font-size="11.5" fill="#2f2f2f" text-anchor="start" font-weight="600">两代 KV 总量（横轴按 GB 等比）</text><text x="80.0" y="436.8" font-size="10.5" fill="#1a1a1a" text-anchor="start">Ling-2.0-1T · 128K</text><rect x="270.0" y="420.0" width="505.6" height="26.0" rx="4" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.1" fill-opacity="1"/><text x="783.6" y="436.8" font-size="10.5" fill="#4a4a4a" text-anchor="start">320 KB/token · 42 GB</text><text x="80.0" y="472.8" font-size="10.5" fill="#1a1a1a" text-anchor="start">Ling-2.6-1T · 256K</text><rect x="270.0" y="456.0" width="126.4" height="26.0" rx="4" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.1" fill-opacity="1"/><text x="404.4" y="472.8" font-size="10.5" fill="#4a4a4a" text-anchor="start">40 KB/token · 10.5 GB</text><text x="80.0" y="508.0" font-size="10.4" fill="#4a4a4a" text-anchor="start">上下文翻倍，缓存降为四分之一：70 层线性层只维护定长状态，不产生 KV。</text><text x="80.0" y="546.0" font-size="11" fill="#4a4a4a" text-anchor="start">Ling-2.6-1T：1025.41B 总参 / 激活约 51B，80 层，70 层 Lightning Attention 配 10 层 MLA，256 选 8 + 1 共享，上下文 262,144。</text><text x="80.0" y="570.0" font-size="11" fill="#4a4a4a" text-anchor="start">状态：70 层各约 4 MB，合计约 293 MB，与长度无关；容量规划由「按长度乘」改为「按序列数乘」。</text><text x="80.0" y="594.0" font-size="11" fill="#4a4a4a" text-anchor="start">权重约 1.04 TB，部署张量并行度不低于 8；串行侧 70 层递推链使解码延迟不随并行加宽而下降。</text><text x="80.0" y="618.0" font-size="11" fill="#4a4a4a" text-anchor="start">7 比 1 由缩放律确定：报告比较 1:1、3:1、7:1、15:1 四组，7:1 在建模质量与推理成本之间取较优点。</text><rect x="80.0" y="651.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="102.0" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">线性 / 稀疏</text><rect x="167.3" y="651.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="189.3" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">位置编码</text><rect x="243.3" y="651.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="265.3" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">MLA 与投影</text><rect x="333.2" y="651.0" width="16.0" height="12.0" rx="3" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.0" fill-opacity="1"/><text x="355.2" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">稠密</text></svg>