="62.0" width="68.8" height="26.0" rx="4" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><rect x="596.1" y="62.0" width="8.1" height="26.0" rx="4" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><rect x="606.3" y="62.0" width="68.8" height="26.0" rx="4" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><rect x="677.1" y="62.0" width="8.1" height="26.0" rx="4" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><rect x="687.2" y="62.0" width="68.8" height="26.0" rx="4" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><rect x="758.1" y="62.0" width="8.1" height="26.0" rx="4" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><rect x="768.2" y="62.0" width="68.8" height="26.0" rx="4" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><rect x="839.0" y="62.0" width="8.1" height="26.0" rx="4" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><rect x="849.2" y="62.0" width="58.7" height="26.0" rx="4" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><rect x="909.9" y="62.0" width="8.1" height="26.0" rx="4" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="80.0" y="108.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">80 层：前 4 层稠密 MLP，其后 7 层 Lightning Attention 接 1 层 MLA，共 70 层线性 + 10 层 MLA；末端另接 1 层 MTP</text><rect x="80.0" y="132.0" width="400.0" height="232.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="96.0" y="153.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">Linear 块</text><text x="165.0" y="153.0" font-size="10.2" fill="#8a8f94" text-anchor="start">70 层 · 不存 KV</text><rect x="96.0" y="201.0" width="116.0" height="92.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="154.0" y="242.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">q、k、v 投影</text><text x="154.0" y="257.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">64 头 × 128</text><rect x="222.0" y="201.0" width="116.0" height="92.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="280.0" y="242.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">因果衰减累积</text><text x="280.0" y="257.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">S ← λ ⊙ S + kvᵀ</text><rect x="348.0" y="201.0" width="116.0" height="92.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="406.0" y="242.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">读出 + 输出门</text><text x="406.0" y="257.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">o = qS，再门控</text><path d="M212.0,247.0 L222.0,247.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M338.0,247.0 L348.0,247.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="96.0" y="315.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">状态 128 × 128 / 头，FP32 约 4 MB / 层。</text><rect x="510.0" y="132.0" width="410.0" height="232.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="526.0" y="153.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">MLA 块</text><text x="579.5" y="153.0" font-size="10.2" fill="#8a8f94" text-anchor="start">10 层 · 唯一产生 KV</text><rect x="526.0" y="201.0" width="119.3" height="92.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="585.7" y="242.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">低秩投影</text><text x="585.7" y="257.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">64 Q / 8 KV</text><rect x="655.3" y="201.0" width="119.3" height="92.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="715.0" y="242.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Partial-RoPE</text><text x="715.0" y="257.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">前 64 维 · θ 6e5</text><rect x="784.7" y="201.0" width="119.3" height="92.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="844.3" y="242.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">潜注意力</text><text x="844.3" y="257.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">已移除 QK-Norm</text><path d="M645.3,247.0 L655.3,247.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M774.7,247.0 L784.7,247.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="526.0" y="315.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">每 token 每层 4 KB，10 层合计 40 KB。</text><text x="80.0" y="404.0" font-size="11.5" fill="#2f2f2f" text-anchor="start" font-weight="600">两代 KV 总量（横轴按 GB 等比）</text><text x="80.0" y="436.8" font-size="10.5" fill="#1a1a1a" text-anchor="start">Ling-2.0-1T · 128K</text><rect x="270.0" y="420.0" width="505.6" height="26.0" rx="4" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.1" fill-opacity="1"/><text x="783.6" y="436.8" font-size="10.5" fill="#4a4a4a" text-anchor="start">320 KB/token · 42 GB</text><text x="80.0" y="472.8" font-size="10.5" fill="#1a1a1a" text-anchor="start">Ling-2.6-1T · 256K</text><rect x="270.0" y="456.0" width="126.4" height="26.0" rx="4" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.1" fill-opacity="1"/><text x="404.4" y="472.8" font-size="10.5" fill="#4a4a4a" text-anchor="start">40 KB/token · 10.5 GB</text><text x="80.0" y="508.0" font-size="10.4" fill="#4a4a4a" text-anchor="start">上下文翻倍，缓存降为四分之一：70 层线性层只维护定长状态，不产生 KV。</text><text x="80.0" y="546.0" font-size="11" fill="#4a4a4a" text-anchor="start">Ling-2.6-1T：1025.41B 总参 / 激活约 51B，80 层，70 层 Lightning Attention 配 10 层 MLA，256 选 8 + 1 共享，上下文 262,144。</text><text x="80.0" y="570.0" font-size="11" fill="#4a4a4a" text-anchor="start">状态：70 层各约 4 MB，合计约 293 MB，与长度无关；容量规划由「按长度乘」改为「按序列数乘」。</text><text x="80.0" y="594.0" font-size="11" fill="#4a4a4a" text-anchor="start">权重约 1.04 TB，部署张量并行度不低于 8；串行侧 70 层递推链使解码延迟不随并行加宽而下降。</text><text x="80.0" y="618.0" font-size="11" fill="#4a4a4a" text-anchor="start">7 比 1 由缩放律确定：报告比较 1:1、3:1、7:1、15:1 四组，7:1 在建模质量与推理成本之间取较优点。</text><rect x="80.0" y="651.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="102.0" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">线性 / 稀疏</text><rect x="167.3" y="651.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="189.3" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">位置编码</text><rect x="243.3" y="651.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="265.3" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">MLA 与投影</text><rect x="333.2" y="651.0" width="16.0" height="12.0" rx="3" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.0" fill-opacity="1"/><text x="355.2" y="660.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">稠密</text></svg>