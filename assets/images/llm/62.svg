投影</text><text x="185.5" y="343.1" font-size="8.3" fill="#4a4a4a" text-anchor="middle">64 头 × 128</text><path d="M296.0,316.0 L464.0,316.0 L453.0,352.0 L285.0,352.0 Z" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3"/><text x="374.5" y="330.8" font-size="10.0" fill="#1a1a1a" text-anchor="middle" font-weight="600">K / V 投影</text><text x="374.5" y="343.1" font-size="8.3" fill="#4a4a4a" text-anchor="middle">64 头 × 128</text><rect x="154.9" y="254.0" width="250.2" height="48.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="280.0" y="273.5" font-size="11.3" fill="#1a1a1a" text-anchor="middle">因果衰减累积</text><text x="280.0" y="288.5" font-size="9.0" fill="#4a4a4a" text-anchor="middle">S ← λ ⊙ S + kvᵀ</text><path d="M185.5,316.0 L185.5,302.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M374.5,316.0 L374.5,302.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M280.0,254.0 L280.0,240.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M208.4,204.0 L362.6,204.0 L351.6,240.0 L197.4,240.0 Z" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3"/><text x="280.0" y="218.8" font-size="10.4" fill="#1a1a1a" text-anchor="middle" font-weight="600">读出 + 输出门</text><text x="280.0" y="231.3" font-size="8.5" fill="#4a4a4a" text-anchor="middle">o = qS，再门控</text><text x="96.0" y="380.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">状态 128 × 128 / 头，FP32 约 4 MB / 层。</text><rect x="510.0" y="132.0" width="410.0" height="232.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="526.0" y="153.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">MLA 块</text><text x="579.5" y="153.0" font-size="10.2" fill="#8a8f94" text-anchor="start">10 层 · 唯一产生 KV</text><path d="M537.0,316.0 L710.0,316.0 L699.0,352.0 L526.0,352.0 Z" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3"/><text x="618.0"