<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="372" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="#111">DeepSeek-V3 的 MTP 模块（预测深度 D = 1）</text>

  <!-- 主模型表示 -->
  <rect x="16" y="64" width="128" height="42" fill="#dde7f5" stroke="#446084"/>
  <text x="80" y="82" text-anchor="middle" font-size="10.5" fill="#111">主模型表示 hᵢ⁰</text>
  <text x="80" y="98" text-anchor="middle" font-size="9" fill="#333">[B, L, 7168]</text>

  <!-- 共享嵌入 -->
  <rect x="16" y="126" width="128" height="42" fill="#f2eee4" stroke="#8a7340"/>
  <text x="80" y="144" text-anchor="middle" font-size="10.5" fill="#111">共享嵌入 Emb(tᵢ₊₁)</text>
  <text x="80" y="160" text-anchor="middle" font-size="9" fill="#333">与主模型共用，不另设</text>

  <!-- RMSNorm ×2 -->
  <rect x="158" y="72" width="66" height="26" fill="#eef2f7" stroke="#555"/>
  <text x="191" y="89" text-anchor="middle" font-size="9.5" fill="#111">RMSNorm</text>
  <rect x="158" y="134" width="66" height="26" fill="#eef2f7" stroke="#555"/>
  <text x="191" y="151" text-anchor="middle" font-size="9.5" fill="#111">RMSNorm</text>

  <line x1="146" y1="85" x2="156" y2="85" stroke="#555" marker-end="url(#a)"/>
  <line x1="146" y1="147" x2="156" y2="147" stroke="#555" marker-end="url(#a)"/>

  <!-- 拼接 -->
  <rect x="236" y="64" width="58" height="104" fill="#f7f9fc" stroke="#33475e"/>
  <text x="265" y="106" text-anchor="middle" font-size="11" fill="#111">[ · ; · ]</text>
  <text x="265" y="124" text-anchor="middle" font-size="8.5" fill="#333">2d = 14,336</text>
  <line x1="226" y1="85" x2="234" y2="85" stroke="#555" marker-end="url(#a)"/>
  <line x1="226" y1="147" x2="234" y2="147" stroke="#555" marker-end="url(#a)"/>

  <!-- M1 -->
  <rect x="306" y="90" width="88" height="52" fill="#dde7f5" stroke="#446084"/>
  <text x="350" y="110" text-anchor="middle" font-size="10.5" fill="#111">M₁（拼接降维）</text>
  <text x="350" y="127" text-anchor="middle" font-size="9" fill="#333">14,336 → 7,168</text>
  <line x1="296" y1="116" x2="304" y2="116" stroke="#555" marker-end="url(#a)"/>

  <!-- TRM1 -->
  <rect x="406" y="76" width="104" height="80" fill="#e8f0e2" stroke="#55702f"/>
  <text x="458" y="96" text-anchor="middle" font-size="10.5" fill="#111">TRM₁（附加块）</text>
  <text x="458" y="113" text-anchor="middle" font-size="9" fill="#333">与主干一个 MoE 层</text>
  <text x="458" y="129" text-anchor="middle" font-size="9" fill="#333">同构：256 专家 top-8</text>
  <text x="458" y="145" text-anchor="middle" font-size="9" fill="#555">+ MLA</text>
  <line x1="396" y1="116" x2="404" y2="116" stroke="#555" marker-end="url(#a)"/>

  <!-- OutHead -->
  <rect x="522" y="88" width="88" height="56" fill="#f2eee4" stroke="#8a7340"/>
  <text x="566" y="108" text-anchor="middle" font-size="10.5" fill="#111">OutHead（共享）</text>
  <text x="566" y="125" text-anchor="middle" font-size="9" fill="#333">logits 128K</text>
  <line x1="512" y1="116" x2="520" y2="116" stroke="#555" marker-end="url(#a)"/>

  <!-- 输出 -->
  <rect x="620" y="98" width="46" height="36" fill="#f7f9fc" stroke="#33475e"/>
  <text x="643" y="113" text-anchor="middle" font-size="9" fill="#111">P(tᵢ₊₂)</text>
  <text x="643" y="126" text-anchor="middle" font-size="8" fill="#333">[B, L, V]</text>
  <line x1="612" y1="116" x2="618" y2="116" stroke="#555" marker-end="url(#a)"/>

  <!-- 分支虚线 -->
  <path d="M566 146 V172 H172 V202" fill="none" stroke="#8a94a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M566 146 V172 H489 V202" fill="none" stroke="#8a94a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- 训练分支 -->
  <rect x="16" y="206" width="312" height="78" fill="#fbfcfe" stroke="#b9c4d2"/>
  <text x="30" y="226" font-size="10.5" fill="#1b2430">训练：加权交叉熵，λ 分段衰减</text>
  <text x="30" y="246" font-size="9.5" fill="#33414f">L = L_CE + (λ / D) Σ Lᵏ_MTP，D = 1</text>
  <text x="30" y="264" font-size="9.5" fill="#33414f">λ = 0.3（前 10T token）→ 0.1（余下 4.8T）</text>

  <!-- 推理分支 -->
  <rect x="350" y="206" width="316" height="78" fill="#fbfcfe" stroke="#b9c4d2"/>
  <text x="364" y="226" font-size="10.5" fill="#1b2430">推理：可整体丢弃，或复用为投机解码</text>
  <text x="364" y="246" font-size="9.5" fill="#33414f">第二 token 接受率 85%–90%，吞吐 1.8×</text>
  <text x="364" y="264" font-size="9.5" fill="#33414f">接受率下滑时，该次前向即转为纯开销</text>

  <!-- 注记 -->
  <line x1="16" y1="300" x2="664" y2="300" stroke="#dfe4ea"/>
  <text x="16" y="320" font-size="9.5" fill="#3d4a56">参数量：M₁ 约 1.0 亿（2d × d ≈ 1.03×10⁸）；TRM₁ 与主干一个 MoE 层相当。嵌入层与输出头与主模型物理共享参数与梯度，只存一份。</text>
  <text x="16" y="342" font-size="9.5" fill="#3d4a56">因果链：第 1 深度预测 tᵢ₊₂ 时，输入含 tᵢ₊₁ 的真实嵌入，而非第 0 深度的预测值；主干由此在训练中提前规划后一位置的表示。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
</svg>
