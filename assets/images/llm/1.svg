<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="806" viewBox="0 0 1180 806" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/></marker></defs>
<rect width="1180" height="806" fill="#ffffff"/>
<text x="24" y="40" font-size="19" font-weight="700" fill="#16202c">DeepSeek-V3｜MLA + DeepSeekMoE 算子分解</text>
<text x="24" y="62" font-size="11.2" fill="#4d5866">61 层（3 稠密 + 58 MoE）· 隐藏维 7168 · 128 头 MLA（kv 潜秩 512 + RoPE 64）· 256 专家 top-8 + 1 共享 · 词表 129,280</text>
<text x="24" y="80" font-size="10.2" fill="#8a94a2">算子级数据流：每框给出算子、计算公式与张量维度；B = batch，L = 序列长度，d_h = 头维</text>
<line x1="24" y1="92" x2="1156" y2="92" stroke="#dfe4ea" stroke-width="1"/>
<text x="24" y="110" font-size="10.6" font-weight="700" fill="#6b7280">输入与归一</text>
<text x="286" y="110" font-size="10.6" font-weight="700" fill="#3f6fa8">注意力通路</text>
<text x="736" y="110" font-size="10.6" font-weight="700" fill="#3d8b5f">前馈 / 专家通路</text>
<rect x="24" y="118" width="236" height="70" rx="7" fill="#f4f6f9" stroke="#7d8794" stroke-width="1.2"/>
<text x="36" y="135" font-size="12.4" font-weight="700" fill="#1b2430">词嵌入查表</text>
<text x="36" y="154" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">x = E[t],  E ∈ R^{129280×7168}</text>
<text x="36" y="172" font-size="9.4" fill="#5d6878">[B,L] → [B,L,7168]</text>
<rect x="24" y="204" width="236" height="70" rx="7" fill="#f4f6f9" stroke="#7d8794" stroke-width="1.2"/>
<text x="36" y="221" font-size="12.4" font-weight="700" fill="#1b2430">RMSNorm（前归一）</text>
<text x="36" y="240" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">x̂ = x / √(mean(x²) + 1e-6) ⊙ γ</text>
<text x="36" y="258" font-size="9.4" fill="#5d6878">[B,L,7168] → [B,L,7168]</text>
<rect x="24" y="290" width="236" height="70" rx="7" fill="#f4f6f9" stroke="#7d8794" stroke-width="1.2"/>
<text x="36" y="307" font-size="12.4" font-weight="700" fill="#1b2430">残差主干</text>
<text x="36" y="326" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">x^{(l+1)} = x^{(l)} + Attn + MoE</text>
<text x="36" y="344" font-size="9.4" fill="#5d6878">7168（全程不变）</text>
<rect x="286" y="118" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="135" font-size="12.4" font-weight="700" fill="#1b2430">① Q 低秩投影</text>
<text x="298" y="154" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">c_q = x · W_DQ</text>
<text x="298" y="172" font-size="9.4" fill="#5d6878">[B,L,7168] → [B,L,1536]</text>
<rect x="286" y="208" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="225" font-size="12.4" font-weight="700" fill="#1b2430">② KV 低秩压缩</text>
<text x="298" y="244" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">c_kv = x · W_DKV ;  k_r = x · W_KR</text>
<text x="298" y="262" font-size="9.4" fill="#5d6878">512 维潜向量 + 64 维 RoPE 分量</text>
<rect x="286" y="298" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="315" font-size="12.4" font-weight="700" fill="#1b2430">③ 上投影与位置编码</text>
<text x="298" y="334" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">q = c_q W_UQ ;  k = [c_kv W_UK ; RoPE(k_r)]</text>
<text x="298" y="352" font-size="9.4" fill="#5d6878">[B,L,128,192]（128 头 × 192）</text>
<rect x="286" y="388" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="405" font-size="12.4" font-weight="700" fill="#1b2430">④ 打分</text>
<text x="298" y="424" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">S = q kᵀ / √192 + mask</text>
<text x="298" y="442" font-size="9.4" fill="#5d6878">[B,128,L,L]</text>
<rect x="286" y="478" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="495" font-size="12.4" font-weight="700" fill="#1b2430">⑤ Softmax 与聚合</text>
<text x="298" y="514" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">P = softmax(S) ;  o = P v</text>
<text x="298" y="532" font-size="9.4" fill="#5d6878">v: [B,L,128,128]</text>
<rect x="286" y="568" width="424" height="70" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="298" y="585" font-size="12.4" font-weight="700" fill="#1b2430">⑥ 输出投影与残差</text>
<text x="298" y="604" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">y = o W_O ;  x ← x + y</text>
<text x="298" y="622" font-size="9.4" fill="#5d6878">16384 → 7168</text>
<rect x="736" y="118" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="135" font-size="12.4" font-weight="700" fill="#1b2430">① 路由打分</text>
<text x="748" y="154" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">s_i = σ(x · e_iᵀ),  i = 1…256</text>
<text x="748" y="172" font-size="9.4" fill="#5d6878">[B,L,256]（FP32 计算）</text>
<rect x="736" y="208" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="225" font-size="12.4" font-weight="700" fill="#1b2430">② 组限制与 Top-k</text>
<text x="748" y="244" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">g = top4(8 组) ;  I = top8(g)</text>
<text x="748" y="262" font-size="9.4" fill="#5d6878">每 token 8 个专家，占比 3.1%</text>
<rect x="736" y="298" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="315" font-size="12.4" font-weight="700" fill="#1b2430">③ 专家 SwiGLU</text>
<text x="748" y="334" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">h_i = (SiLU(x W_g,i) ⊙ x W_u,i) W_d,i</text>
<text x="748" y="352" font-size="9.4" fill="#5d6878">7168 → 2048 → 7168</text>
<rect x="736" y="388" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="405" font-size="12.4" font-weight="700" fill="#1b2430">④ 共享专家与合并</text>
<text x="748" y="424" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">y = Σ_{i∈I} ŝ_i h_i + E_s(x),  ŝ = 2.5·s</text>
<text x="748" y="442" font-size="9.4" fill="#5d6878">9 个专家参与计算</text>
<rect x="736" y="478" width="420" height="70" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="748" y="495" font-size="12.4" font-weight="700" fill="#1b2430">⑤ 残差相加</text>
<text x="748" y="514" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">x ← x + y</text>
<text x="748" y="532" font-size="9.4" fill="#5d6878">[B,L,7168]</text>
<line x1="142.0" y1="189" x2="142.0" y2="198" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="142.0" y1="275" x2="142.0" y2="284" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="498.0" y1="189" x2="498.0" y2="202" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="498.0" y1="279" x2="498.0" y2="292" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="498.0" y1="369" x2="498.0" y2="382" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="498.0" y1="459" x2="498.0" y2="472" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="498.0" y1="549" x2="498.0" y2="562" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="946.0" y1="189" x2="946.0" y2="202" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="946.0" y1="279" x2="946.0" y2="292" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="946.0" y1="369" x2="946.0" y2="382" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="946.0" y1="459" x2="946.0" y2="472" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="260" y1="146" x2="280" y2="146" stroke="#7c8794" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="24" y1="676" x2="1156" y2="676" stroke="#dfe4ea" stroke-width="1"/>
<text x="24" y="692" font-size="10.6" font-weight="700" fill="#8a6d1f">核算：缓存、算力与权重</text>
<rect x="24.0" y="702" width="366.6666666666667" height="70" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="36.0" y="719" font-size="12.4" font-weight="700" fill="#1b2430">KV Cache / token</text>
<text x="36.0" y="738" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">N_kv = 61 × (512 + 64) × 1 B</text>
<text x="36.0" y="756" font-size="9.4" fill="#5d6878">≈ 35 KB（FP8）；BF16 加倍</text>
<rect x="406.6666666666667" y="702" width="366.6666666666667" height="70" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="418.6666666666667" y="719" font-size="12.4" font-weight="700" fill="#1b2430">每 token 算力</text>
<text x="418.6666666666667" y="738" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">C = 2 · N_act = 2 × 37B</text>
<text x="418.6666666666667" y="756" font-size="9.4" fill="#5d6878">≈ 74 GFLOP</text>
<rect x="789.3333333333334" y="702" width="366.6666666666667" height="70" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="801.3333333333334" y="719" font-size="12.4" font-weight="700" fill="#1b2430">权重体积（专家占 97%）</text>
<text x="801.3333333333334" y="738" font-size="10.6" fill="#243447" font-family="Consolas, Cascadia Mono, monospace">671B × 1 B（FP8 分块）</text>
<text x="801.3333333333334" y="756" font-size="9.4" fill="#5d6878">≈ 671 GB</text>
</svg>