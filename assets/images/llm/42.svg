<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#111">Mistral Large 3 结构示意图（据官方发布信息绘制）</text>

  <!-- inputs -->
  <rect x="25" y="115" width="85" height="34" fill="#eef2f7" stroke="#555"/>
  <text x="67" y="136" text-anchor="middle" font-size="11">文本</text>
  <rect x="25" y="165" width="85" height="34" fill="#eef2f7" stroke="#555"/>
  <text x="67" y="186" text-anchor="middle" font-size="11">图像</text>

  <line x1="110" y1="182" x2="150" y2="182" stroke="#555" marker-end="url(#a)"/>
  <rect x="150" y="163" width="115" height="38" fill="#f3e8ef" stroke="#7a4468"/>
  <text x="207" y="180" text-anchor="middle" font-size="11">视觉编码器</text>
  <text x="207" y="194" text-anchor="middle" font-size="9">（图像理解）</text>
  <line x1="265" y1="182" x2="300" y2="160" stroke="#555" marker-end="url(#a)"/>
  <line x1="110" y1="132" x2="220" y2="132" stroke="#555" marker-end="url(#a)"/>

  <!-- backbone -->
  <rect x="300" y="55" width="250" height="240" fill="#f7f9fc" stroke="#333"/>
  <text x="425" y="80" text-anchor="middle" font-size="12">稀疏 MoE 主干</text>

  <rect x="325" y="98" width="200" height="40" fill="#dde7f5" stroke="#446084"/>
  <text x="425" y="122" text-anchor="middle" font-size="11">注意力（多语言优化）</text>

  <rect x="325" y="154" width="200" height="56" fill="#e8f0e2" stroke="#55702f"/>
  <text x="425" y="175" text-anchor="middle" font-size="11">MoE 前馈</text>
  <text x="425" y="193" text-anchor="middle" font-size="9.5">总参 675B / 每 token 激活 41B</text>

  <text x="425" y="238" text-anchor="middle" font-size="10.5" fill="#333">上下文 256K · 文本 + 图像输入</text>
  <text x="425" y="258" text-anchor="middle" font-size="10.5" fill="#333">3,000 张 H200 从零训练 · Apache 2.0</text>
  <text x="425" y="278" text-anchor="middle" font-size="10" fill="#666">Mistral 自 Mixtral 以来首个 MoE · NVFP4 检查点</text>

  <!-- output -->
  <line x1="550" y1="175" x2="590" y2="175" stroke="#555" marker-end="url(#a)"/>
  <rect x="590" y="157" width="70" height="36" fill="#eef2f7" stroke="#555"/>
  <text x="625" y="179" text-anchor="middle" font-size="11">输出</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
</svg>
