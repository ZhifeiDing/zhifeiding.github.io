<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Helvetica, Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#1a1a1a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#6f7377"/></marker></defs><rect width="1000" height="760" fill="#ffffff"/><rect x="96.0" y="578.0" width="216.0" height="42.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="602.1" font-size="13.5" fill="#1a1a1a" text-anchor="middle">文本 / 代码</text><path d="M204.0,578.0 L204.0,556.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="96.0" y="518.0" width="216.0" height="38.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="539.9" font-size="13" fill="#1a1a1a" text-anchor="middle">RMSNorm</text><rect x="96.0" y="434.0" width="216.0" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="462.3" font-size="13" fill="#1a1a1a" text-anchor="middle">MLA + DSA（IndexShare）</text><text x="204.0" y="478.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">64 头 · 索引器 32 × 128 · top-2048</text><rect x="96.0" y="378.0" width="216.0" height="38.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="399.9" font-size="13" fill="#1a1a1a" text-anchor="middle">RMSNorm</text><rect x="96.0" y="298.0" width="216.0" height="62.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="204.0" y="324.3" font-size="13" fill="#1a1a1a" text-anchor="middle">MoE 前馈</text><text x="204.0" y="340.8" font-size="10.5" fill="#4a4a4a" text-anchor="middle">256 选 8 + 1 共享 · 中间维 2048</text><path d="M204.0,518.0 L204.0,500.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M204.0,434.0 L204.0,416.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M204.0,378.0 L204.0,360.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M204.0,298.0 L204.0,281.5" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="204.0" cy="272.0" r="9.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><path d="M199.1,272.0 L208.9,272.0 M204.0,267.1 L204.0,276.9" stroke="#1a1a1a" stroke-width="1.2"/><rect x="80.0" y="248.0" width="272.0" height="328.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="62.0" y="417.0" font-size="14" fill="#3a3a3a" text-anchor="middle" font-style="italic">78×</text><path d="M204.0,570.0 L338.0,570.0 L338.0,272.0 L213.5,272.0" fill="none" stroke="#1a1a1a" stroke-width="1.25" marker-end="url(#ah)"/><path d="M204.0,262.5 L204.0,238.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="204.0" y="232.0" font-size="11.5" fill="#4a4a4a" text-anchor="middle">输出</text><rect x="430.0" y="58.0" width="540.0" height="240.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="79.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">IndexShare</text><text x="527.0" y="79.0" font-size="10.2" fill="#8a8f94" text-anchor="start">21 full + 57 shared</text><rect x="446.0" y="144.0" width="119.5" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="505.8" y="172.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">full 层</text><text x="505.8" y="187.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">自算索引器</text><rect x="575.5" y="144.0" width="119.5" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="635.2" y="172.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">top-k 索引</text><text x="635.2" y="187.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">取 2048 个因果 key</text><rect x="705.0" y="144.0" width="119.5" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="764.8" y="172.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">shared 层 × 3</text><text x="764.8" y="187.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">直接复用，不重算</text><rect x="834.5" y="144.0" width="119.5" height="66.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="894.2" y="172.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">1M 序列</text><text x="894.2" y="187.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">索引器开销降 2.9 倍</text><path d="M565.5,177.0 L575.5,177.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M695.0,177.0 L705.0,177.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M824.5,177.0 L834.5,177.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="232.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">每 4 层共用 1 个索引器；21 个 full 层持索引器，其余 57 层复用前一 full 层的 top-k。</text><rect x="430.0" y="316.0" width="540.0" height="250.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="337.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">发布形态</text><text x="508.0" y="337.0" font-size="10.2" fill="#8a8f94" text-anchor="start">结构零改动，增量在数值格式</text><rect x="446.0" y="407.0" width="119.5" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="505.8" y="435.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">FP8 e4m3</text><text x="505.8" y="450.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">128 × 128 分块尺度</text><rect x="575.5" y="407.0" width="119.5" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="635.2" y="435.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">541 个模块</text><text x="635.2" y="450.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">留 BF16 / FP32</text><rect x="705.0" y="407.0" width="119.5" height="66.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="764.8" y="435.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">141 个分片</text><text x="764.8" y="450.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">合计约 756 GB</text><rect x="834.5" y="407.0" width="119.5" height="66.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="894.2" y="435.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">KV 90 KB/token</text><text x="894.2" y="450.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">BF16 · 1M 约 90 GB</text><path d="M565.5,440.0 L575.5,440.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M695.0,440.0 L705.0,440.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M824.5,440.0 L834.5,440.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="495.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">保留高精度的模块为各层归一化、路由 gate、索引器投影与路由偏置；权重八卡节点即可容纳。</text><text x="80.0" y="654.0" font-size="11" fill="#4a4a4a" text-anchor="start">GLM-5.3：基座与 GLM-5.2 逐项相同——78 层（前 3 层稠密）、256 专家、MLA + DSA + IndexShare、上下文 1M、MTP 1 层。</text><text x="80.0" y="678.0" font-size="11" fill="#4a4a4a" text-anchor="start">总参 744B / 激活 40B，隐藏维 6144，词表 154,880，RoPE θ = 8×10⁶，最大位置 1,048,576。</text><text x="80.0" y="702.0" font-size="11" fill="#4a4a4a" text-anchor="start">5.3 的全部增量在后训练：IndexShare 摊薄 rollout 成本，SAO 单条 rollout 双侧裁剪，slime 对齐 train / rollout logprob。</text><rect x="96.0" y="727.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="161.5" y="727.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="183.5" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化 / 高精度</text><rect x="269.8" y="727.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="291.8" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影 / 量化</text><rect x="357.2" y="727.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="379.2" y="736.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家 / 分片</text></svg>