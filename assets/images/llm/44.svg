<rect x="893.38" y="120" width="7.82" height="24" fill="#e8f0e2" stroke="#55702f" stroke-width="0.7"/>
<rect x="514.00" y="147" width="25.07" height="3" fill="#1b2430"/>
<text x="514.00" y="162" font-size="8.2" fill="#33414f">↑ 前 3 层为稠密 MLP</text>
<rect x="514" y="170" width="10" height="10" fill="#e8f0e2" stroke="#55702f" stroke-width="0.9"/>
<text x="529" y="179" font-size="9.2" fill="#33414f">KDA 线性层 34</text>
<rect x="630" y="170" width="10" height="10" fill="#fff2dc" stroke="#a9742a" stroke-width="0.9"/>
<text x="645" y="179" font-size="9.2" fill="#33414f">DSA 稀疏层 11</text>
<text x="760" y="179" font-size="9.2" fill="#5d6878">比例 3 : 1，共 45 层</text>
<text x="514" y="200" font-size="9.6" fill="#8a6d1f" font-weight="700">放大第 1–4 层</text>
<rect x="514" y="208" width="86" height="30" rx="3" fill="#e8f0e2" stroke="#55702f" stroke-width="1"/>
<text x="522" y="221" font-size="8.4" fill="#5d6878">层 1</text>
<text x="522" y="233" font-size="10.4" fill="#1b2430" font-weight="700">KDA</text>
<rect x="606" y="208" width="86" height="30" rx="3" fill="#e8f0e2" stroke="#55702f" stroke-width="1"/>
<text x="614" y="221" font-size="8.4" fill="#5d6878">层 2</text>
<text x="614" y="233" font-size="10.4" fill="#1b2430" font-weight="700">KDA</text>
<rect x="698" y="208" width="86" height="30" rx="3" fill="#e8f0e2" stroke="#55702f" stroke-width="1"/>
<text x="706" y="221" font-size="8.4" fill="#5d6878">层 3</text>
<text x="706" y="233" font-size="10.4" fill="#1b2430" font-weight="700">KDA</text>
<rect x="790" y="208" width="86" height="30" rx="3" fill="#fff2dc" stroke="#a9742a" stroke-width="1"/>
<text x="798" y="221" font-size="8.4" fill="#5d6878">层 4</text>
<text x="798" y="233" font-size="10.4" fill="#1b2430" font-weight="700">DSA</text>
<text x="514" y="258" font-size="8.8" fill="#3d4a56">· KDA 层不写 KV，每层只维护 64 × 128 × 128 的 FP32 状态</text>
<text x="514" y="274" font-size="8.8" fill="#3d4a56">· DSA 层每 token 写 512 维潜向量与 128 + 128 维索引器状态</text>
<text x="514" y="290" font-size="8.8" fill="#3d4a56">· 11 个稀疏层各自持有索引器，不做 5.2 式的跨层复用</text>
<rect x="500" y="326" width="416" height="252" rx="7" fill="#eef7f1" stroke="#3d8b5f" stroke-width="1.2"/>
<text x="514" y="348" font-size="11.6" fill="#2f6b47" font-weight="700">缓存、权重与部署</text>
<text x="514" y="372" font-size="9.2" fill="#3d4a56">· 稀疏层 1536 B/token：潜向量 1 KB + 索引键 256 B + 门控 256 B</text>
<text x="514" y="394" font-size="9.2" fill="#3d4a56">· 11 层合计 16.9 KB/token，1M 上下文约 17.7 GB</text>
<text x="514" y="416" font-size="9.2" fill="#3d4a56">· KDA 状态每层约 4 MB，34 层约 143 MB，与序列长度无关</text>
<text x="514" y="438" font-size="9.2" fill="#3d4a56">· FP8（e4m3）128 × 128 分块，激活动态量化，62 分片约 328 GB</text>
<text x="514" y="460" font-size="9.2" fill="#3d4a56">· 1509 个模块保留高精度：mHC 参数、路由 gate、归一化与索引器</text>
<text x="514" y="482" font-size="9.2" fill="#3d4a56">· 8 卡每卡约 41 GB，48 GB 级单机即可容纳</text>
<text x="514" y="504" font-size="9.2" fill="#3d4a56">· 相对 5.3：注意力计算 1/3.0，KV Cache 1/4.4（官方口径）</text>
<text x="514" y="526" font-size="9.2" fill="#3d4a56">· IndexPool 把打分粒度由 token 放大到 4-token 组，选中后展开回 2048 token</text>
<text x="514" y="548" font-size="9.2" fill="#3d4a56">· 服务侧线性注意力与 LM head 走节点内张量并行，状态以 ReplaySSM 重放</text>
<line x1="24" y1="600" x2="916" y2="600" stroke="#dfe4ea"/>
<text x="24" y="622" font-size="11.4" fill="#8a6d1f" font-weight="700">对硬件的含义</text>
<text x="24" y="644" font-size="10.4" fill="#243447">随序列长度增长的缓存只落在 11/45 的层上，1M 上下文的 KV 由百 GB 量级降到 20 GB 以内；代价是缓存管理器须同时维护</text>
<text x="24" y="664" font-size="10.4" fill="#243447">分页 KV、递推状态与卷积状态三套结构。KDA 的解码路径是逐 token 递推，34 层串成一条链，其延迟不随算力并行度下降，</text>
<text x="24" y="684" font-size="10.4" fill="#243447">只能靠块内并行与层切分分摊；权重 328 GB 已可单机容纳，跨机通信由必需转为可选。</text>
</svg>