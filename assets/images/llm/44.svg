<svg xmlns="http://www.w3.org/2000/svg" width="940" height="716" viewBox="0 0 940 716" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<rect width="940" height="716" fill="#ffffff"/>
<text x="24" y="34" font-size="16" fill="#16202c" font-weight="700">GLM-5.3-Flash 结构示意：线性递推与稀疏选择按 3 : 1 混合</text>
<text x="24" y="56" font-size="10.8" fill="#4d5866">320B 总参 / 激活 18B · 45 层 · 隐藏维 4096 · 288 选 8 + 1 共享 · 34 层 KDA + 11 层 DSA · 1M 上下文 · mHC 四路</text>
<line x1="24" y1="70" x2="916" y2="70" stroke="#dfe4ea"/>
<rect x="24" y="86" width="452" height="492" rx="7" fill="#fbfcfe" stroke="#b9c4d2" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="38" y="108" font-size="11.6" fill="#3f6fa8" font-weight="700">主干：新训底座，层数与激活同时下调</text>
<rect x="38" y="124" width="424" height="58" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="50" y="144" font-size="11" fill="#1b2430" font-weight="700">规模</text>
<text x="140" y="144" font-size="9.2" fill="#33414f">320B 总参，每 token 激活 18B；45 层，隐藏维 4096</text>
<text x="140" y="161" font-size="9.2" fill="#33414f">词表 154,880；上下文 1,048,576；MTP 1 层</text>
<rect x="38" y="190" width="424" height="58" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="50" y="210" font-size="11" fill="#1b2430" font-weight="700">层序</text>
<text x="140" y="210" font-size="9.2" fill="#33414f">第 4、8、…、44 层为 DSA 稀疏层，共 11 层</text>
<text x="140" y="227" font-size="9.2" fill="#33414f">其余 34 层为 KDA 线性层；前 3 层稠密 MLP（12288）</text>
<rect x="38" y="256" width="424" height="58" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="50" y="276" font-size="11" fill="#1b2430" font-weight="700">稀疏层注意力</text>
<text x="140" y="276" font-size="9.2" fill="#33414f">MLA：q 低秩 1536、kv 潜向量 512、64 头</text>
<text x="140" y="293" font-size="9.2" fill="#33414f">qk 256、v 256；旋转维为 0，主干不含位置编码</text>
<rect x="38" y="322" width="424" height="58" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="50" y="342" font-size="11" fill="#1b2430" font-weight="700">索引器</text>
<text x="140" y="342" font-size="9.2" fill="#33414f">32 头 × 128，键经 LayerNorm，查询复用 q 残差</text>
<text x="140" y="359" font-size="9.2" fill="#33414f">IndexPool：4 键池化为 1，取 512 池 → 2048 token</text>
<rect x="38" y="388" width="424" height="58" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="50" y="408" font-size="11" fill="#1b2430" font-weight="700">KDA 层</text>
<text x="140" y="408" font-size="9.2" fill="#33414f">64 头 × 128，深度短卷积核 4，遗忘门下界 −5</text>
<text x="140" y="425" font-size="9.2" fill="#33414f">chunkwise 块长 64（预填）/ recurrent（解码）</text>
<rect x="38" y="454" width="424" height="58" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="50" y="474" font-size="11" fill="#1b2430" font-weight="700">专家混合</text>
<text x="140" y="474" font-size="9.2" fill="#33414f">288 选 8 + 1 共享，专家中间维 2048</text>
<text x="140" y="491" font-size="9.2" fill="#33414f">sigmoid + noaux_tc 偏置，缩放 2.5；SwiGLU 截断 ±10</text>
<rect x="38" y="520" width="424" height="58" rx="7" fill="#edf3fb" stroke="#3f6fa8" stroke-width="1.2"/>
<text x="50" y="540" font-size="11" fill="#1b2430" font-weight="700">残差与视觉</text>
<text x="140" y="540" font-size="9.2" fill="#33414f">mHC 四路，Sinkhorn 20 次约束为双随机矩阵</text>
<text x="140" y="557" font-size="9.2" fill="#33414f">视觉 24 层 ViT（patch 14，2×2 合并，输出 4096 维）</text>
<rect x="500" y="86" width="416" height="222" rx="7" fill="#fdf8ec" stroke="#c2a03c" stroke-width="1.2"/>
<text x="514" y="108" font-size="11.6" fill="#8a6d1f" font-weight="700">层序：每 4 层 1 组，组首为稀疏层</text>
