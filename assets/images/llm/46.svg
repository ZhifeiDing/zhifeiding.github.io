<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="460" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="#111">Step 5 Preview 结构示意图（据官方 config.json 与模型卡绘制）</text>

  <!-- inputs -->
  <rect x="14" y="58" width="78" height="26" fill="#eef2f7" stroke="#555"/>
  <text x="53" y="76" text-anchor="middle" font-size="11" fill="#111">文本</text>
  <rect x="14" y="92" width="78" height="26" fill="#eef2f7" stroke="#555"/>
  <text x="53" y="110" text-anchor="middle" font-size="11" fill="#111">图像</text>
  <rect x="14" y="126" width="78" height="26" fill="#eef2f7" stroke="#555"/>
  <text x="53" y="144" text-anchor="middle" font-size="11" fill="#111">视频</text>

  <!-- multimodal encoder -->
  <rect x="108" y="52" width="100" height="108" fill="#f3e8ef" stroke="#7a4468"/>
  <text x="158" y="74" text-anchor="middle" font-size="11" fill="#111">多模态编码器</text>
  <text x="158" y="90" text-anchor="middle" font-size="9.5" fill="#333">47 层 · 宽 1536</text>
  <text x="158" y="106" text-anchor="middle" font-size="9.5" fill="#333">728² · patch 14</text>
  <text x="158" y="122" text-anchor="middle" font-size="9.5" fill="#333">16 头 · 169 token</text>
  <text x="158" y="140" text-anchor="middle" font-size="9" fill="#555">projector stride 2</text>

  <line x1="92" y1="71" x2="104" y2="71" stroke="#555" marker-end="url(#a)"/>
  <line x1="92" y1="105" x2="104" y2="105" stroke="#555" marker-end="url(#a)"/>
  <line x1="92" y1="139" x2="104" y2="139" stroke="#555" marker-end="url(#a)"/>
  <line x1="208" y1="106" x2="218" y2="106" stroke="#555" marker-end="url(#a)"/>

  <!-- backbone -->
  <rect x="222" y="44" width="292" height="306" fill="#f7f9fc" stroke="#333"/>
  <text x="368" y="66" text-anchor="middle" font-size="12" fill="#111">语言主干 92 层 · 隐藏维 4096</text>

  <rect x="238" y="78" width="260" height="56" fill="#dde7f5" stroke="#446084"/>
  <text x="368" y="97" text-anchor="middle" font-size="10.5" fill="#111">GQA 64 Q / 4 KV · 头维 192</text>
  <text x="368" y="113" text-anchor="middle" font-size="9.5" fill="#333">69 层滑窗（窗口 512）/ 23 层全局</text>
  <text x="368" y="128" text-anchor="middle" font-size="9.5" fill="#333">逐头注意力门控 · 全局层走稀疏索引</text>

  <rect x="238" y="142" width="260" height="44" fill="#fff2dc" stroke="#a9742a"/>
  <text x="368" y="160" text-anchor="middle" font-size="10.5" fill="#111">Sparse GQA + 块级 token 合并</text>
  <text x="368" y="176" text-anchor="middle" font-size="9.5" fill="#333">索引器 16 头 · top-512 · 块 8 · proxy 256</text>

  <rect x="238" y="194" width="260" height="58" fill="#e8f0e2" stroke="#55702f"/>
  <text x="368" y="213" text-anchor="middle" font-size="10.5" fill="#111">MoE 前馈（第 3 至 90 层）</text>
  <text x="368" y="229" text-anchor="middle" font-size="9.5" fill="#333">352 路由专家 top-8 加 1 共享</text>
  <text x="368" y="244" text-anchor="middle" font-size="9.5" fill="#333">专家中间维 1536；88 层 MoE 另 4 层稠密</text>

  <rect x="238" y="260" width="260" height="30" fill="#f3e8ef" stroke="#7a4468"/>
  <text x="368" y="280" text-anchor="middle" font-size="10.5" fill="#111">MTP × 3 层（投机解码）</text>

  <text x="368" y="310" text-anchor="middle" font-size="10.5" fill="#111">总参数 600B / 每 token 激活 27B</text>
  <text x="368" y="328" text-anchor="middle" font-size="10" fill="#111">词表 128,896 · 上下文 1M</text>
  <text x="368" y="344" text-anchor="middle" font-size="9" fill="#666">FP32 残差连接</text>

  <!-- output -->
  <line x1="514" y1="149" x2="520" y2="149" stroke="#555" marker-end="url(#a)"/>
  <rect x="520" y="132" width="62" height="34" fill="#eef2f7" stroke="#555"/>
  <text x="551" y="153" text-anchor="middle" font-size="11" fill="#111">输出</text>

  <!-- notes -->
  <text x="340" y="378" text-anchor="middle" font-size="10.5" fill="#333">69 层滑窗与 23 层全局稀疏注意力交替，KV Cache 只由滑窗窗口与全局层构成</text>
  <text x="340" y="400" text-anchor="middle" font-size="10.5" fill="#333">索引与 top-k 选择成本约为稠密基线的八分之一；块压缩粒度 8</text>
  <text x="340" y="422" text-anchor="middle" font-size="10.5" fill="#333">92 层窄深设计意在拉长信息传播路径，代价是解码逐层穿行的延迟</text>
  <text x="340" y="442" text-anchor="middle" font-size="9.5" fill="#666">数值 BF16（约 1.2TB）/ FP8（约 600GB）；许可 StepFun Model License 1.0</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
</svg>
