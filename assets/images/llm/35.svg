<svg xmlns="http://www.w3.org/2000/svg" width="680" height="649" viewBox="0 0 680 649" font-family="Georgia, 'Times New Roman', serif">
<text x="340.0" y="24" font-size="14.5" fill="#111111" text-anchor="middle">LongCat-2.0 的层组合与算子序列</text>
<text x="340.0" y="43" font-size="8.9" fill="#5a6675" text-anchor="middle">1.6T 总参，每 token 激活 33B～56B（均值约 48B）；LSA 在 DSA 索引器上叠加 SI / CLI / HI 三项改造</text>
<text x="340.0" y="58" font-size="8.9" fill="#5a6675" text-anchor="middle">相邻两层共用一次索引结果，块级粗召回后作 token 级细选；零计算专家让简单 token 跳过专家计算</text>
