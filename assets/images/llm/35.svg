<g transform="translate(0,98.0)"><text x="348" y="116.0" font-size="7.7" fill="#33414f">同一机制用于 3 步 MTP：草稿模型三个步次共用第一步生成的索引集。</text></g>
<g transform="translate(0,98.0)"><rect x="348" y="124.0" width="12" height="8" fill="#dde7f5" stroke="#446084" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="364" y="132.0" font-size="7.4" fill="#33414f">索引层</text></g>
<g transform="translate(0,98.0)"><rect x="508" y="124.0" width="12" height="8" fill="#e8f0e2" stroke="#55702f" stroke-width="0.8"/></g>
<g transform="translate(0,98.0)"><text x="524" y="132.0" font-size="7.4" fill="#33414f">复用层</text></g>
<line x1="12" y1="316.0" x2="668" y2="316.0" stroke="#c9cfd8" stroke-width="0.9"/>
<text x="12.0" y="334.0" font-size="9.6" fill="#1b2430" font-weight="bold">（c）三级索引</text>
<text x="226.66666666666666" y="334.0" font-size="7.6" fill="#5a6675" text-anchor="end">SI / CLI / HI</text>
<rect x="12.0" y="342.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="354.0" font-size="8.0" fill="#446084" font-weight="bold">① 块级粗召回</text>
<text x="19.0" y="365.0" font-size="7.2" fill="#33414f">块索引器对 128 token 的块打分</text>
<text x="19.0" y="376.5" font-size="7.2" fill="#33414f">HI：先粗选，缩小候选</text>
<rect x="12.0" y="385.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="397.0" font-size="8.0" fill="#446084" font-weight="bold">② token 级细选</text>
<text x="19.0" y="408.0" font-size="7.2" fill="#33414f">token 索引器在候选块内打分</text>
<text x="19.0" y="419.5" font-size="7.2" fill="#33414f">每层取 top-k 条目</text>
<rect x="12.0" y="428.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="440.0" font-size="8.0" fill="#446084" font-weight="bold">③ 流感知读取（SI）</text>
<text x="19.0" y="451.0" font-size="7.2" fill="#33414f">索引按硬件对齐连续存放</text>
<text x="19.0" y="462.5" font-size="7.2" fill="#33414f">碎片访存改为顺序读</text>
<rect x="12.0" y="471.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="483.0" font-size="8.0" fill="#446084" font-weight="bold">④ 跨层复用（CLI）</text>
<text x="19.0" y="494.0" font-size="7.2" fill="#33414f">I^{(l)} ← I^{(l-1)}</text>
<text x="19.0" y="505.5" font-size="7.2" fill="#33414f">相邻两层共用一次索引</text>
<rect x="12.0" y="514.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#446084" stroke-width="0.85"/>
<text x="19.0" y="526.0" font-size="8.0" fill="#446084" font-weight="bold">⑤ 三种开关</text>
<text x="19.0" y="537.0" font-size="7.2" fill="#33414f">SI / CLI / HI 可独立启停</text>
<text x="19.0" y="548.5" font-size="7.2" fill="#33414f">对应三套 kernel 变体</text>
<text x="232.66666666666666" y="334.0" font-size="9.6" fill="#1b2430" font-weight="bold">（d）LSA 注意力与缓存</text>
<text x="447.3333333333333" y="334.0" font-size="7.6" fill="#5a6675" text-anchor="end">稀疏 MLA</text>
<rect x="232.66666666666666" y="342.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.66666666666666" y="354.0" font-size="8.0" fill="#a9742a" font-weight="bold">① KV 压缩</text>
<text x="239.66666666666666" y="365.0" font-size="7.2" fill="#33414f">MLA 潜向量 512 + RoPE 64</text>
<text x="239.66666666666666" y="376.5" font-size="7.2" fill="#33414f">与索引键分开存放</text>
<rect x="232.66666666666666" y="385.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.66666666666666" y="397.0" font-size="8.0" fill="#a9742a" font-weight="bold">② 稀疏聚合</text>
<text x="239.66666666666666" y="408.0" font-size="7.2" fill="#33414f">o = softmax(q k_Iᵀ/√d) v_I</text>
<text x="239.66666666666666" y="419.5" font-size="7.2" fill="#33414f">只读选中条目，KVP 切分</text>
<rect x="232.66666666666666" y="428.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.66666666666666" y="440.0" font-size="8.0" fill="#a9742a" font-weight="bold">③ 前缀复用</text>
<text x="239.66666666666666" y="451.0" font-size="7.2" fill="#33414f">按选中集缓存前缀</text>
<text x="239.66666666666666" y="462.5" font-size="7.2" fill="#33414f">1M 上下文仍可定位</text>
<rect x="232.66666666666666" y="471.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.66666666666666" y="483.0" font-size="8.0" fill="#a9742a" font-weight="bold">④ absorb 模式</text>
<text x="239.66666666666666" y="494.0" font-size="7.2" fill="#33414f">索引与 MLA prolog 并行</text>
<text x="239.66666666666666" y="505.5" font-size="7.2" fill="#33414f">两段流水重叠</text>
<rect x="232.66666666666666" y="514.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#a9742a" stroke-width="0.85"/>
<text x="239.66666666666666" y="526.0" font-size="8.0" fill="#a9742a" font-weight="bold">⑤ 缓存形态</text>
<text x="239.66666666666666" y="537.0" font-size="7.2" fill="#33414f">索引集 + 压缩 KV 两段</text>
<text x="239.66666666666666" y="548.5" font-size="7.2" fill="#33414f">索引集可跨层共享</text>
<text x="453.3333333333333" y="334.0" font-size="9.6" fill="#1b2430" font-weight="bold">（e）专家与旁路</text>
<text x="668.0" y="334.0" font-size="7.6" fill="#5a6675" text-anchor="end">零计算专家 + N-gram</text>
<rect x="453.3333333333333" y="342.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="460.3333333333333" y="354.0" font-size="8.0" fill="#55702f" font-weight="bold">① N-gram 查表</text>
<text x="460.3333333333333" y="365.0" font-size="7.2" fill="#33414f">n = 5，135B 参数</text>
<text x="460.3333333333333" y="376.5" font-size="7.2" fill="#33414f">与 MoE 正交的稀疏维度</text>
<rect x="453.3333333333333" y="385.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="460.3333333333333" y="397.0" font-size="8.0" fill="#55702f" font-weight="bold">② 路由打分</text>
<text x="460.3333333333333" y="408.0" font-size="7.2" fill="#33414f">s_i = σ(x e_iᵀ)</text>
<text x="460.3333333333333" y="419.5" font-size="7.2" fill="#33414f">含零计算专家一类</text>
<rect x="453.3333333333333" y="428.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="460.3333333333333" y="440.0" font-size="8.0" fill="#55702f" font-weight="bold">③ 零计算跳转</text>
<text x="460.3333333333333" y="451.0" font-size="7.2" fill="#33414f">命中零专家则跳过传输</text>
<text x="460.3333333333333" y="462.5" font-size="7.2" fill="#33414f">激活量 33B～56B 动态浮动</text>
<rect x="453.3333333333333" y="471.0" width="214.66666666666666" height="38.0" fill="#ffffff" stroke="#55702f" stroke-width="0.85"/>
<text x="460.3333333333333" y="483.0" font-size="8.0" fill="#55702f" font-weight="bold">④ 专家 FFN</text>
