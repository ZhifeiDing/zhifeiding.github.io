、激活 MXFP8，量化感知训练。</text><text x="80.0" y="726.0" font-size="11" fill="#4a4a4a" text-anchor="start">相对 K3 的结构改动只有一处：24 层全注意力由 Gated MLA 换为 Gated DSA，能力提升主要来自后训练。</text><rect x="96.0" y="753.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="161.5" y="753.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="183.5" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化</text><rect x="227.0" y="753.0" width="16.0" height="12.0" rx="3" fill="#fce6e6" stroke="#b85450" stroke-width="1.0" fill-opacity="1"/><text x="249.0" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">短卷积</text><rect x="292.5" y="753.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="314.5" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影与状态</text><rect x="379.0" y="753.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="401.0" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>