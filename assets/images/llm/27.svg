1a" text-anchor="middle">状态更新</text><text x="803.6" y="188.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">S ← λS + kvᵀ</text><rect x="860.4" y="145.0" width="93.6" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="907.2" y="173.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">读出 + 输出门</text><text x="907.2" y="188.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">o = qS ⊙ σ</text><path d="M539.6,178.0 L549.6,178.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M643.2,178.0 L653.2,178.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M746.8,178.0 L756.8,178.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850.4,178.0 L860.4,178.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="233.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">状态按 128 × 128 / 头常驻；解码为逐 token 递推。</text><rect x="430.0" y="322.0" width="540.0" height="250.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="343.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">Gated DSA</text><text x="521.5" y="343.0" font-size="10.2" fill="#8a8f94" text-anchor="start">24 层 · 替换 K3 的 Gated MLA</text><rect x="446.0" y="413.0" width="93.6" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="492.8" y="441.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Q / KV 低秩</text><text x="492.8" y="456.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">q 1536 · kv 512</text><rect x="549.6" y="413.0" width="93.6" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="596.4" y="441.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">索引器</text><text x="596.4" y="456.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">32 头 × 128</text><rect x="653.2" y="413.0" width="93.6" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="441.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">取 top-2048</text><text x="700.0" y="456.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">因果 key</text><rect x="756.8" y="413.0" width="93.6" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="803.6" y="441.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">门控稀疏打分</text><text x="803.6" y="456.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">选中 token 上归一</text><rect x="860.4" y="413.0" width="93.6" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="907.2" y="441.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">输出门</text><text x="907.2" y="456.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">oW_O ⊙ swish</text><path d="M539.6,446.0 L549.6,446.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M643.2,446.0 L653.2,446.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M746.8,446.0 L756.8,446.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850.4,446.0 L860.4,446.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="501.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">24 层各自持有索引器，不做跨层复用；KV 只由这 24 层产生。</text><text x="80.0" y="654.0" font-size="11" fill="#4a4a4a" text-anchor="start">Kimi K3.1 Pro：93 层（1 层稠密 + 92 层 MoE），69 层 KDA 配 24 层 Gated DSA，隐藏维 7168、96 头。</text><text x="80.0" y="678.0" font-size="11" fill="#4a4a4a" text-anchor="start">总参 2.8T / 每 token 激活 104B；896 专家取 top-16 加 2 共享，潜维 3584、每专家 3072。</text><text x="80.0" y="702.0" font-size="11" fill="#4a4a4a" text-anchor="start">词表 160K，上下文 1,048,576；权重 MXFP4、激活 MXFP8，量化感知训练。</text><text x="80.0" y="726.0" font-size="11" fill="#4a4a4a" text-anchor="start">相对 K3 的结构改动只有一处：24 层全注意力由 Gated MLA 换为 Gated DSA，能力提升主要来自后训练。</text><rect x="96.0" y="753.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="118.0" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="161.5" y="753.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="183.5" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化</text><rect x="227.0" y="753.0" width="16.0" height="12.0" rx="3" fill="#fce6e6" stroke="#b85450" stroke-width="1.0" fill-opacity="1"/><text x="249.0" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">短卷积</text><rect x="292.5" y="753.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="314.5" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影与状态</text><rect x="379.0" y="753.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="401.0" y="762.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>