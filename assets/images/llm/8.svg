<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#111">Qwen3.8-Max 结构示意图（据官方发布信息绘制）</text>

  <!-- inputs -->
  <rect x="20" y="70" width="90" height="34" fill="#eef2f7" stroke="#555"/>
  <text x="65" y="92" text-anchor="middle" font-size="11">文本 / 图像 / 视频</text>
  <line x1="110" y1="87" x2="150" y2="87" stroke="#555" marker-end="url(#a)"/>

  <!-- ngram table -->
  <rect x="150" y="30" width="150" height="44" fill="#fdf6e3" stroke="#8a6d1a"/>
  <text x="225" y="48" text-anchor="middle" font-size="11" fill="#6b5310">N-gram Embedding</text>
  <text x="225" y="64" text-anchor="middle" font-size="10" fill="#6b5310">51B 查表参数（可卸载至主机内存）</text>
  <line x1="225" y1="74" x2="225" y2="100" stroke="#8a6d1a" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- backbone -->
  <rect x="150" y="100" width="360" height="200" fill="#f7f9fc" stroke="#333"/>
  <text x="330" y="122" text-anchor="middle" font-size="12" fill="#111">Transformer 主干（重复 N 个块）</text>

  <rect x="175" y="138" width="140" height="36" fill="#dde7f5" stroke="#446084"/>
  <text x="245" y="160" text-anchor="middle" font-size="11">Gated DeltaNet（线性注意力）</text>

  <rect x="345" y="138" width="140" height="36" fill="#e8f0e2" stroke="#55702f"/>
  <text x="415" y="153" text-anchor="middle" font-size="11">MoE 前馈</text>
  <text x="415" y="168" text-anchor="middle" font-size="9.5">总参 2.4T / 激活 95B</text>

  <rect x="175" y="192" width="140" height="36" fill="#dde7f5" stroke="#446084"/>
  <text x="245" y="214" text-anchor="middle" font-size="11">QSA 稀疏注意力（微块粒度）</text>

  <rect x="345" y="192" width="140" height="36" fill="#e8f0e2" stroke="#55702f"/>
  <text x="415" y="214" text-anchor="middle" font-size="11">MoE 前馈</text>

  <text x="330" y="252" text-anchor="middle" font-size="10.5" fill="#333">每 4 层一组：3 ×（GDN → MoE）+ 1 ×（QSA → MoE）</text>
  <text x="330" y="272" text-anchor="middle" font-size="10.5" fill="#333">门控残差：4 条并行残差通道 + 动态门控（FP8 残差状态）</text>
  <text x="330" y="290" text-anchor="middle" font-size="10" fill="#666">上下文 1M token · Muon 优化器 · 原生多模态</text>

  <!-- output -->
  <line x1="510" y1="200" x2="560" y2="200" stroke="#555" marker-end="url(#a)"/>
  <rect x="560" y="182" width="100" height="36" fill="#eef2f7" stroke="#555"/>
  <text x="610" y="204" text-anchor="middle" font-size="11">输出</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
</svg>
