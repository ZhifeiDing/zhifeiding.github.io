33.6 L703.6,426.4" stroke="#1a1a1a" stroke-width="1.2"/><path d="M700.0,447.0 L700.0,439.5" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="872.7" cy="522.0" r="10.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/><text x="872.7" y="526.2" font-size="12.5" fill="#5a4a1e" text-anchor="middle" font-style="italic">σ</text><path d="M872.7,540.0 L872.7,532.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M872.7,512.0 L872.7,430.0 L709.5,430.0" fill="none" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><path d="M700.0,420.5 L700.0,414.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M601.0,378.0 L810.0,378.0 L799.0,414.0 L590.0,414.0 Z" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3"/><text x="700.0" y="392.8" font-size="10.4" fill="#1a1a1a" text-anchor="middle" font-weight="600">输出投影</text><text x="700.0" y="405.3" font-size="8.5" fill="#4a4a4a" text-anchor="middle">oW_O</text><text x="446.0" y="604.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">KV 只由这 23 层产生（4 KB / token·层）；其余 69 层只维护定长状态。</text><text x="80.0" y="654.0" font-size="11" fill="#4a4a4a" text-anchor="start">92 层 = 23 ×（3 层 GDN + 1 层门控注意力），每层之后均接 MoE（512 选 10 + 1 共享，中间维 2048），无稠密 FFN；末层后另挂 1 层 MTP。</text><text x="80.0" y="678.0" font-size="11" fill="#4a4a4a" text-anchor="start">总参 2.4T / 激活 95B，隐藏维 8192，词表 248,320，原生上下文 262,144，最远可扩至 1,010,000。</text><text x="80.0" y="702.0" font-size="11" fill="#4a4a4a" text-anchor="start">缓存：23 层全注意力按 BF16 计 92 KB/token，1M 上下文约 92 GB；69 层 GDN 状态合计约 289 MB，与长度无关。</text><rect x="92.0" y="733.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="114.0" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="157.5" y="733.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="179.5" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化 / 位置</text><rect x="255.3" y="733.0" width="16.0" height="12.0" rx="3" fill="#fce6e6" stroke="#b85450" stroke-width="1.0" fill-opacity="1"/><text x="277.3" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">短卷积</text><rect x="320.8" y="733.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="342.8" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影与状态</text><rect x="407.3" y="733.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="429.3" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>