)"/><path d="M162.0,508.0 L162.0,488.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="92.0" y="372.0" width="140.0" height="48.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="162.0" y="398.3" font-size="11" fill="#1a1a1a" text-anchor="middle">GDN · 层 3</text><rect x="250.0" y="376.0" width="58.0" height="40.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="279.0" y="398.1" font-size="10.5" fill="#1a1a1a" text-anchor="middle">MoE</text><path d="M232.0,396.0 L250.0,396.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M162.0,440.0 L162.0,420.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="92.0" y="304.0" width="140.0" height="48.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="162.0" y="330.3" font-size="11" fill="#1a1a1a" text-anchor="middle">门控注意力 · 层 4</text><rect x="250.0" y="308.0" width="58.0" height="40.0" rx="9" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.3" fill-opacity="1"/><text x="279.0" y="330.1" font-size="10.5" fill="#1a1a1a" text-anchor="middle">MoE</text><path d="M232.0,328.0 L250.0,328.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M162.0,372.0 L162.0,352.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="76.0" y="286.0" width="242.0" height="292.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="58.0" y="437.0" font-size="14" fill="#3a3a3a" text-anchor="middle" font-style="italic">23×</text><path d="M162.0,286.0 L162.0,270.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><rect x="92.0" y="226.0" width="214.0" height="44.0" rx="9" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.3" fill-opacity="1"/><text x="199.0" y="250.1" font-size="10.6" fill="#1a1a1a" text-anchor="middle">MTP × 1（不计入 92 层）</text><path d="M162.0,226.0 L162.0,208.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="162.0" y="202.0" font-size="11.5" fill="#4a4a4a" text-anchor="middle">输出</text><rect x="430.0" y="58.0" width="540.0" height="250.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="79.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">GDN 块</text><text x="499.5" y="79.0" font-size="10.2" fill="#8a8f94" text-anchor="start">69 层 · 线性注意力，定长状态</text><rect x="446.0" y="149.0" width="93.6" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="492.8" y="172.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">归一 + 投影</text><text x="492.8" y="186.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">q,k 16×128 · v 128×</text><text x="492.8" y="197.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">128</text><rect x="549.6" y="149.0" width="93.6" height="66.0" rx="9" fill="#fce6e6" stroke="#b85450" stroke-width="1.3" fill-opacity="1"/><text x="596.4" y="177.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">因果短卷积</text><text x="596.4" y="192.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">核 4 · 后接 SiLU</text><rect x="653.2" y="149.0" width="93.6" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="177.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">门控 α、β</text><text x="700.0" y="192.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">逐通道衰减</text><rect x="756.8" y="149.0" width="93.6" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="803.6" y="177.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">delta 状态</text><text x="803.6" y="192.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">S ← S(α−βkkᵀ)</text><rect x="860.4" y="149.0" width="93.6" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="907.2" y="172.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">读出 + 输出</text><text x="907.2" y="186.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">o = Sq → 16384 → 819</text><text x="907.2" y="197.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">2</text><path d="M539.6,182.0 L549.6,182.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M643.2,182.0 L653.2,182.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M746.8,182.0 L756.8,182.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850.4,182.0 L860.4,182.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="237.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">状态按 S ← S(α − βkkᵀ) + βkvᵀ 更新，128 × 128 / 头，与序列长度无关；预填分块累积，解码逐 token 递推。</text><rect x="430.0" y="326.0" width="540.0" height="250.0" rx="12" fill="none" stroke="#b0b4b8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="1"/><text x="446.0" y="347.0" font-size="12.5" fill="#2f2f2f" text-anchor="start" font-weight="600">门控注意力块</text><text x="533.0" y="347.0" font-size="10.2" fill="#8a8f94" text-anchor="start">23 层 · 全注意力，KV 随长度增长</text><rect x="446.0" y="417.0" width="93.6" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="492.8" y="440.0" font-size="10.4" fill="#1a1a1a" text-anchor="middle">归一 + 投影</text><text x="492.8" y="454.8" font-size="8.8" fill="#4a4a4a" text-anchor="middle">Q 64×256 · KV 4×25</text><text x="492.8" y="465.4" font-size="8.8" fill="#4a4a4a" text-anchor="middle">6</text><rect x="549.6" y="417.0" width="93.6" height="66.0" rx="9" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.3" fill-opacity="1"/><text x="596.4" y="445.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">Partial-RoPE</text><text x="596.4" y="460.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">前 64 维 · θ = 1e7</text><rect x="653.2" y="417.0" width="93.6" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="700.0" y="445.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">因果打分</text><text x="700.0" y="460.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">64 头共 4 KV 头</text><rect x="756.8" y="417.0" width="93.6" height="66.0" rx="9" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.3" fill-opacity="1"/><text x="803.6" y="445.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">输出门</text><text x="803.6" y="460.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">oW_O ⊙ swish(xW_g)</text><rect x="860.4" y="417.0" width="93.6" height="66.0" rx="9" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.3" fill-opacity="1"/><text x="907.2" y="445.3" font-size="10.4" fill="#1a1a1a" text-anchor="middle">KV 缓存</text><text x="907.2" y="460.1" font-size="8.8" fill="#4a4a4a" text-anchor="middle">4 KB / token·层</text><path d="M539.6,450.0 L549.6,450.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M643.2,450.0 L653.2,450.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M746.8,450.0 L756.8,450.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><path d="M850.4,450.0 L860.4,450.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ah)"/><text x="446.0" y="505.0" font-size="10.2" fill="#4a4a4a" text-anchor="start">KV 只由这 23 层产生；其余 69 层只维护定长状态。</text><text x="80.0" y="654.0" font-size="11" fill="#4a4a4a" text-anchor="start">92 层 = 23 ×（3 层 GDN + 1 层门控注意力），每层之后均接 MoE（512 选 10 + 1 共享，中间维 2048），无稠密 FFN；末层后另挂 1 层 MTP。</text><text x="80.0" y="678.0" font-size="11" fill="#4a4a4a" text-anchor="start">总参 2.4T / 激活 95B，隐藏维 8192，词表 248,320，原生上下文 262,144，最远可扩至 1,010,000。</text><text x="80.0" y="702.0" font-size="11" fill="#4a4a4a" text-anchor="start">缓存：23 层全注意力按 BF16 计 92 KB/token，1M 上下文约 92 GB；69 层 GDN 状态合计约 289 MB，与长度无关。</text><rect x="92.0" y="733.0" width="16.0" height="12.0" rx="3" fill="#fbfbdc" stroke="#c9a63a" stroke-width="1.0" fill-opacity="1"/><text x="114.0" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">注意力</text><rect x="157.5" y="733.0" width="16.0" height="12.0" rx="3" fill="#fce7c9" stroke="#c98a2e" stroke-width="1.0" fill-opacity="1"/><text x="179.5" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">归一化 / 位置</text><rect x="255.3" y="733.0" width="16.0" height="12.0" rx="3" fill="#fce6e6" stroke="#b85450" stroke-width="1.0" fill-opacity="1"/><text x="277.3" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">短卷积</text><rect x="320.8" y="733.0" width="16.0" height="12.0" rx="3" fill="#e3e4f2" stroke="#7b7f9e" stroke-width="1.0" fill-opacity="1"/><text x="342.8" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">投影与状态</text><rect x="407.3" y="733.0" width="16.0" height="12.0" rx="3" fill="#e6e0f6" stroke="#6f6a96" stroke-width="1.0" fill-opacity="1"/><text x="429.3" y="742.0" font-size="10.5" fill="#4a4a4a" text-anchor="start">专家</text></svg>